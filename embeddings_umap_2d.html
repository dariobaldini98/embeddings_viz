n representing it to represent its\u003cbr\u003eobject. The premises may afford a likeness, index, or symbol\u003cbr\u003eof the conclusion. In deductive argument, the conclusion is\u003cbr\u003e…","Induction"],["Induction","1\u002f1","Induction may, therefore, be defined as argument which\u003cbr\u003eassumes that a whole collection, from which a number of\u003cbr\u003einstances have been taken at random, has all the common\u003cbr\u003echaracters of those instances …","Induction"],["Induction","1\u002f1","Hence the formulæ are InductionS’ S” S”’, &amp;c. are taken at\u003cbr\u003erandom as M’s,S’ S” S”’, &amp;c. are P; .·. Any M is probably P.","Induction"],["Induction","1\u002f1","Induction may be defined as an argument which proceeds upon\u003cbr\u003ethe assumption that all the members of a class or aggregate\u003cbr\u003ehave all the characters which are common to all those\u003cbr\u003emembers of this class concerning which it is known, whether\u003cbr\u003ethey have these characters or not; or, in other words, which\u003cbr\u003e…","Induction"],["Induction","1\u002f1","… So that induction is the inference of the rule from the\u003cbr\u003ecase and result. But this is not the only way of inverting a\u003cbr\u003edeductive syllogism so as to produce a synthetic inference.\u003cbr\u003e[—] We have, then– DEDUCTION. Rule.–All the beans from this\u003cbr\u003ebag are white.Case.–These beans are from this bag. …","Induction"],["Induction","1\u002f1","… the distinction between induction and hypothesis. In the\u003cbr\u003emain, it is broad and decided. By induction, we conclude\u003cbr\u003ethat facts, similar to observed facts, are true in cases not\u003cbr\u003eexamined. By hypothesis, we conclude the existence of a fact\u003cbr\u003equite different from anything observed, from which, …","Induction"],["Induction","1\u002f1","Induction infers a rule. Now, the belief of a rule is a\u003cbr\u003ehabit. That a habit is a rule active in us, is evident. That\u003cbr\u003eevery belief is of the nature of a habit, in so far as it is\u003cbr\u003eof a general character, has been shown in the earlier papers\u003cbr\u003eof this series. Induction, therefore, is the logical …","Induction"],["Induction","1\u002f2","The principle of statistical deduction is that these two\u003cbr\u003eproportions–namely, that of the P’s among the M’s, and that\u003cbr\u003eof the P’s among the S’s–are probably and approximately\u003cbr\u003eequal. If, then, this principle justifies our inferring the\u003cbr\u003evalue of the second proportion from the known value of the\u003cbr\u003efirst, …","Induction"],["Induction","2\u002f2","different. In the statistical deduction, we know that among\u003cbr\u003ethe whole body of M’s the proportion of P’s is {r}; we say,\u003cbr\u003ethen, that the S’s being random drawings of M’s are probably\u003cbr\u003eP’s in about the same proportion–and though this may happen\u003cbr\u003enot to be so, yet at any rate, on continuing the drawing …","Induction"],["Induction","1\u002f2","The following examples will illustrate the distinction\u003cbr\u003ebetween statistical deduction, induction, and hypothesis. If\u003cbr\u003eI wished to order a font of type expressly for the printing\u003cbr\u003eof this book, knowing, as I do, that in all English writing\u003cbr\u003ethe letter e occurs oftener than any other letter, I should\u003cbr\u003e…","Induction"],["Induction","2\u002f2","be wrong, because the inference is based on but a limited\u003cbr\u003enumber of instances; but on enlarging the sample the ratio\u003cbr\u003ewill be changed till it becomes approximately correct. In\u003cbr\u003einduction, the instances drawn at random are numerable\u003cbr\u003ethings; in hypothesis they are characters, which are not\u003cbr\u003ecapable of …","Induction"],["Induction","1\u002f1","… Induction proceeds from Case and Result to Rule; it is the\u003cbr\u003eformula of the formation of a habit or general conception–a\u003cbr\u003eprocess which, psychologically as well as logically, depends\u003cbr\u003eon the repetition of instances or sensations. [—] [—]\u003cbr\u003eConceiving of nature in this way, we naturally conceive of …","Induction"],["Induction","1\u002f1","We now come to the consideration of the Rules which have to\u003cbr\u003ebe followed in order to make valid and strong Inductions and\u003cbr\u003eHypotheses. These rules can all be reduced to a single one;\u003cbr\u003enamely, that the statistical deduction of which the\u003cbr\u003eInduction or Hypothesis is the inversion, must be valid and\u003cbr\u003estrong.","Induction"],["Induction","1\u002f1","The three main classes of logical inference are Deduction,\u003cbr\u003eInduction, and Hypothesis. These correspond to three chief\u003cbr\u003emodes of action of the human soul. [—] By induction, a habit\u003cbr\u003ebecomes established. Certain sensations, all involving one\u003cbr\u003egeneral idea, are followed each by the same reaction; and an\u003cbr\u003e…","Induction"],["Induction","1\u002f1","Induction is that mode of reasoning which adopts a\u003cbr\u003econclusion as approximate, because it results from a method\u003cbr\u003eof inference which must generally lead to the truth in the\u003cbr\u003elong run. For example, a ship enters port laden with coffee.\u003cbr\u003eI go aboard and sample the coffee. Perhaps I do not examine\u003cbr\u003eover a …","Induction"],["Induction","1\u002f1","In 1867, I produced what I considered, and still consider\u003cbr\u003eproof that all arguments are of three kinds Deduction,\u003cbr\u003eInduction and Hypothesis, with a supplementary kind Analogy\u003cbr\u003esharing in the nature of Induction and of Hypothesis. In\u003cbr\u003evarious publications, I gradually made my doctrine more\u003cbr\u003edefinite, …","Induction"],["Induction","1\u002f1","Induction consists in taking samples of a genus and\u003cbr\u003eobserving how many fall into a certain species, and thence\u003cbr\u003econcluding the probable and approximate value of the\u003cbr\u003eprobability that in that genus any given individual will\u003cbr\u003ebelong to that species. It supposes that there is a certain\u003cbr\u003ecourse of …","Induction"],["Induction","1\u002f2","Abduction, on the other hand, is merely preparatory. It is\u003cbr\u003ethe first step of scientific reasoning, as induction is the\u003cbr\u003econcluding step. Nothing has so much contributed to present\u003cbr\u003echaotic or erroneous ideas of the logic of science as\u003cbr\u003efailure to distinguish the essentially different characters\u003cbr\u003eof …","Induction"],["Induction","2\u002f2","to light the very facts to which the hypothesis had pointed.\u003cbr\u003eThe mode of suggestion by which, in abduction, the facts\u003cbr\u003esuggest the hypothesis is by resemblance, – the resemblance\u003cbr\u003eof the facts to the consequences of the hypothesis. The mode\u003cbr\u003eof suggestion by which in induction the hypothesis suggests\u003cbr\u003e…","Induction"],["Induction","1\u002f2","It is desirable to consider a large range of inductions,\u003cbr\u003ewith a view to distinguishing accurately between induction\u003cbr\u003eand abduction, which have generally been much confounded. I\u003cbr\u003ewill, therefore, mention that, in the present state of my\u003cbr\u003estudies, I think I recognize three distinct genera of\u003cbr\u003einduction. …","Induction"],["Induction","2\u002f2","being established; and where we may expect that any error\u003cbr\u003einto which the sampling will lead us, though it may not be\u003cbr\u003ecorrected by a mere enlargement of the sample, or even by\u003cbr\u003edrawing other similar samples, yet must be brought to light,\u003cbr\u003eand that gradually, by persistence in the same general\u003cbr\u003emethod. …","Induction"],["Induction","1\u002f1","… the distinction in respect to the nature of their validity\u003cbr\u003ebetween deduction and induction consists in this, – namely,\u003cbr\u003ededuction professes to show that certain admitted facts\u003cbr\u003ecould not exist, even in an ideal world constructed for the\u003cbr\u003epurpose, either without the existence of the very fact …","Induction"],["Induction","1\u002f1","Having, then, by means of deduction, drawn from a hypothesis\u003cbr\u003epredictions as to what the results of experiment will be, we\u003cbr\u003eproceed to test the hypothesis by making the experiments and\u003cbr\u003ecomparing those predictions with the actual results of the\u003cbr\u003eexperiment. Experiment is very expensive business, in …","Induction"],["Induction","1\u002f1","Induction is the highest and most typical form of reasoning.\u003cbr\u003eIn my essay of 1883, I only recognized two closely allied\u003cbr\u003elogical forms of pure induction, one of which is undoubtedly\u003cbr\u003ethe highest. I have since discovered eight other forms which\u003cbr\u003einclude those almost exclusively used by reasoners who …","Induction"],["Induction","1\u002f1","The discussion of probability naturally brings us to the\u003cbr\u003einteresting question of the validity of induction. I\u003cbr\u003eundertake to demonstrate mathematically that the validity of\u003cbr\u003eInduction, in the proper sense of the term, that is to say,\u003cbr\u003eexperimental reasoning, follows, through the lemmas of …","Induction"],["Induction","1\u002f1","Argument is of three kinds: Deduction, Induction, and\u003cbr\u003eAbduction (usually called adopting a hypothesis). A\u003cbr\u003eTransuasive Argument, or Induction, is an Argument which\u003cbr\u003esets out from a hypothesis, resulting from a previous\u003cbr\u003eAbduction, and from virtual predictions, drawn by Deduction,\u003cbr\u003eof the results of …","Induction"],["Induction","1\u002f1","Arguments are of three kinds, Deduction, Induction, and what\u003cbr\u003eI call Abduction [—] If the conclusion is accepted because,\u003cbr\u003ehaving been hypothetically propounded as a hypothesis, it\u003cbr\u003epredicted that experiments would yield results which they\u003cbr\u003ehave thereupon been found to yield, the argument is\u003cbr\u003eInductive.","Induction"],["Induction","1\u002f1","Now, I said, Abduction, or the suggestion of an explanatory\u003cbr\u003etheory, is inference through an Icon, and is thus connected\u003cbr\u003ewith Firstness; Induction, or trying how things will act, is\u003cbr\u003einference through an Index, and is thus connected with\u003cbr\u003eSecondness; Deduction, or recognition of the relations of …","Induction"],["Induction","1\u002f1","These three kinds of reasoning are Abduction, Induction, and\u003cbr\u003eDeduction. [–] Induction is the experimental testing of a\u003cbr\u003etheory. The justification of it is that, although the\u003cbr\u003econclusion at any stage of the investigation may be more or\u003cbr\u003eless erroneous, yet the further application of the same\u003cbr\u003emethod …","Induction"],["Induction","1\u002f1","Abduction is the process of forming an explanatory\u003cbr\u003ehypothesis. It is the only logical operation which\u003cbr\u003eintroduces any new idea; for induction does nothing but\u003cbr\u003edetermine a value, and deduction merely evolves the\u003cbr\u003enecessary consequences of a pure hypothesis. Deduction\u003cbr\u003eproves that something must be; …","Induction"],["Induction","1\u002f1","However, it is now time for me to pass to the consideration\u003cbr\u003eof Inductive Reasoning. When I say that by inductive\u003cbr\u003ereasoning I mean a course of experimental investigation, I\u003cbr\u003edo not understand experiment in the narrow sense of an\u003cbr\u003eoperation by which one varies the conditions of a phenomenon\u003cbr\u003ealmost as …","Induction"],["Induction","1\u002f1","I have argued in several of my early papers that there are\u003cbr\u003ebut three essentially different modes of reasoning:\u003cbr\u003eDeduction, Induction, and Abduction. I may mention in\u003cbr\u003eparticular papers in the Proceedings of the American Academy\u003cbr\u003eof Arts and Sciences for April and May 1867. I must say,\u003cbr\u003ehowever, that …","Induction"],["Induction","1\u002f1","Suppose we define Inductive reasoning as that reasoning\u003cbr\u003ewhose conclusion is justified not by there being any\u003cbr\u003enecessity of its being true or approximately true but by its\u003cbr\u003ebeing the result of a method which if steadily persisted in\u003cbr\u003emust bring the reasoner to the truth of the matter or must\u003cbr\u003ecause his …","Induction"],["Induction","1\u002f1","If we are to give the names of Deduction, Induction, and\u003cbr\u003eAbduction to the three grand classes of inference, then\u003cbr\u003eDeduction must include every attempt at mathematical\u003cbr\u003edemonstration, whether it relate to single occurrences or to\u003cbr\u003e“probabilities,” that is, to statistical ratios; Induction\u003cbr\u003emust mean …","Induction"],["Induction","1\u002f2","An Induction is a method of forming Dicent Symbols\u003cbr\u003econcerning a definite question, of which method the\u003cbr\u003eInterpretant does not represent that from true premisses it\u003cbr\u003ewill yield approximately true results in the majority of\u003cbr\u003einstances in the long run of experience, but does represent\u003cbr\u003ethat if this …","Induction"],["Induction","2\u002f2","approximately ascertain what that proportion is. An Argument\u003cbr\u003efrom a Random Sample, is a method of ascertaining what\u003cbr\u003eproportion of the members of a finite class possess a\u003cbr\u003epredesignate, or virtually predesignate, quality, by\u003cbr\u003eselecting instances from that class according to a method\u003cbr\u003ewhich will, in …","Induction"],["Induction","1\u002f2","… there are but three elementary kinds of reasoning. [—] The\u003cbr\u003ethird way of reasoning is induction, or experimental\u003cbr\u003eresearch. Its procedure is this. Abduction having suggested\u003cbr\u003ea theory, we employ deduction to deduce from that ideal\u003cbr\u003etheory a promiscuous variety of consequences to the effect\u003cbr\u003ethat if …","Induction"],["Induction","2\u002f2","probative force. Deduction is certain but relates only to\u003cbr\u003eideal objects. Induction gives us the only approach to\u003cbr\u003ecertainty concerning the real that we can have. In forty\u003cbr\u003eyears diligent study of arguments, I have never found one\u003cbr\u003ewhich did not consist of those elements. The successes of\u003cbr\u003emodern …","Induction"],["Induction","1\u002f1","The third kind of reasoning may fairly be called Induction,\u003cbr\u003ealthough it does not agree precisely with any one of the\u003cbr\u003emeanings attributed to this word. I apply it to any method\u003cbr\u003eof inquiry which is justified as a provisional result of a\u003cbr\u003emethod which in the long run must lead to the truth. But\u003cbr\u003esuch …","Induction"],["Induction","1\u002f1","Let us now consider non-necessary reasoning. This divides\u003cbr\u003eitself, according to the different ways in which it may be\u003cbr\u003evalid, into three classes: probable deduction; experimental\u003cbr\u003ereasoning, which I now call Induction; and processes of\u003cbr\u003ethought capable of producing no conclusion more definite\u003cbr\u003ethan a …","Induction"],["Induction","1\u002f1","As for induction (in my sense of this term) or the\u003cbr\u003eexperimental method, it consists only in putting very\u003cbr\u003edefinite questions to Nature, to which Dame Nature only\u003cbr\u003ereplies, either by a curt “No,” or else by a dubious and\u003cbr\u003eprovisional “Well.” No vestige, no scrap, of a new idea can\u003cbr\u003epossibly come from …","Induction"],["Induction","1\u002f1","… Observe that neither Deduction nor Induction contributes\u003cbr\u003ethe smallest positive item to the final conclusion of the\u003cbr\u003einquiry. They render the indefinite definite; Deduction\u003cbr\u003eExplicates; Induction evaluates: that is all.","Induction"],["Induction","1\u002f1","Concerning the question of the nature of the logical\u003cbr\u003evalidity possessed by Deduction, Induction, and\u003cbr\u003eRetroduction, which is still an arena of controversy, I\u003cbr\u003eshall confine myself to stating the opinions which I am\u003cbr\u003eprepared to defend by positive proofs. [—] Induction is a\u003cbr\u003ekind of reasoning that may …","Induction"],["Induction","1\u002f2","The purpose of Deduction, that of collecting consequents of\u003cbr\u003ethe hypothesis, having been sufficiently carried out, the\u003cbr\u003einquiry enters upon its Third Stage, that of ascertaining\u003cbr\u003ehow far those consequents accord with Experience, and of\u003cbr\u003ejudging accordingly whether the hypothesis is sensibly\u003cbr\u003ecorrect, …","Induction"],["Induction","2\u002f2","be demolished in a moment, as happened toward the end of the\u003cbr\u003eeighteenth century to the opinion of the scientific world\u003cbr\u003ethat no stones fall from the sky. The other kind is Gradual\u003cbr\u003eInduction, which makes a new estimate of the proportion of\u003cbr\u003etruth in the hypothesis with every new instance; and given …","Induction"],["Induction","1\u002f1","The true guarantee of the validity of induction is that it\u003cbr\u003eis a method of reaching conclusions which, if it be\u003cbr\u003epersisted in long enough, will assuredly correct any error\u003cbr\u003econcerning future experience into which it may temporarily\u003cbr\u003elead us. This it will do not by virtue of any deductive\u003cbr\u003enecessity …","Induction"],["Induction","1\u002f2","It is well to distinguish three different varieties of\u003cbr\u003einduction. The first and weakest kind of inductive reasoning\u003cbr\u003eis that which goes on the presumption that future experience\u003cbr\u003eas to the matter in hand will not be utterly at variance\u003cbr\u003ewith all past experience. Example: “No instance of a genuine\u003cbr\u003e…","Induction"],["Induction","2\u002f2","respect to security and to the scientific value of its\u003cbr\u003econclusions. In both these respects it is well separated\u003cbr\u003efrom each of the other kinds. It consists of those\u003cbr\u003einductions which are neither founded upon experience in one\u003cbr\u003emass, as Crude Induction is, nor upon a collection of\u003cbr\u003enumerable instances …","Induction"],["Induction","1\u002f1","The third kind of warrant is that which justifies the use of\u003cbr\u003ea method of inference provided it be carried out to the end\u003cbr\u003econsistently. There are three kinds of inference of this\u003cbr\u003ekind. They are all inferences from random samples. The\u003cbr\u003estrongest is that which is a sample (that is, a collection)\u003cbr\u003eof …","Induction"],["Induction","1\u002f1","…the essential character of induction is that it infers a\u003cbr\u003ewould-be from actual singulars. These singulars must, in\u003cbr\u003egeneral, be finite in multitude and then […] the inductive\u003cbr\u003econclusion can be (usually) but indefinite, and can never be\u003cbr\u003ecertain…","Induction"],["Induction","1\u002f1","…by Induction, or Inductive Reasoning, I mean all reasoning\u003cbr\u003ewhich infers that something is true of the whole of a given\u003cbr\u003ecollection (no matter what kind of a collection it may be)\u003cbr\u003ebecause it has been found that the same thing is true of a\u003cbr\u003epart of that collection. [—] Pure inductive reasoning hardly\u003cbr\u003e…","Induction"],["Induction","1\u002f1","… An Induction can hardly be sound or at least is to be\u003cbr\u003esuspected usually, unless it has been preceded by a\u003cbr\u003eRetroductive reasoning to the same general effect. Induction\u003cbr\u003echiefly serves to render more certain ideas that have\u003cbr\u003ealready been otherwise suggested. I use “Induction” in a\u003cbr\u003ewider sense than …","Induction"],["Induction","1\u002f1","By Induction, I mean a reasoning which provisionally\u003cbr\u003econcludes something to be true of every member of a\u003cbr\u003ecollection, or, more frequently, of whatever there may be of\u003cbr\u003ea definite general kind, for no other reason than that\u003cbr\u003efirstly, the same thing has been found to be true of a part\u003cbr\u003eof that …","Induction"],["Induction","1\u002f1","I have always, since early in the sixties, recognized three\u003cbr\u003edifferent types of reasoning, viz: 1st, Deduction which\u003cbr\u003edepends on our confidence in our ability to analyze the\u003cbr\u003emeanings of the signs in or by which we think; 2nd,\u003cbr\u003eInduction, which depends upon our confidence that a run of\u003cbr\u003eone kind of …","Induction"],["Induction","1\u002f1","There are three stages of inquiry, demanding as many\u003cbr\u003edifferent kinds of reasoning governed by different\u003cbr\u003eprinciples. They are, 1, Retroduction, forming an\u003cbr\u003eexplanatory hypothesis[;] 2, Deduction, tracing out the\u003cbr\u003econsequences that would ensue upon the truth or falsity of\u003cbr\u003ethat hypothesis; and 3, …","Induction"]],"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003econcept=%{customdata[0]}\u003cbr\u003echunk=%{customdata[1]}\u003cbr\u003equote=%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Induction attestation #0","Induction attestation #1","Induction attestation #2","Induction attestation #3","Induction attestation #4","Induction attestation #5","Induction attestation #6","Induction attestation #7","Induction attestation #8","Induction attestation #8","Induction attestation #9","Induction attestation #9","Induction attestation #10","Induction attestation #11","Induction attestation #12","Induction attestation #13","Induction attestation #14","Induction attestation #15","Induction attestation s an\u003cbr\u003eidentification of two terms previously diverse. It is in\u003cbr\u003efact, the process of nutrition of terms by which they get\u003cbr\u003eall their life and vigor and by which they put forth an\u003cbr\u003eenergy almost creative since it has the effect of reducing\u003cbr\u003ethe chaos of …","Interpretant"],["Interpretant","1\u002f1","We are all […] sufficiently familiar with the fact that many\u003cbr\u003ewords have much implication; but I think we need to reflect\u003cbr\u003eupon the circumstance that every word implies some\u003cbr\u003eproposition or, what is the same thing, every word, concept,\u003cbr\u003esymbol has an equivalent term or one which has become\u003cbr\u003eidentified …","Interpretant"],["Interpretant","1\u002f1","…by an interpretant we mean a representation which\u003cbr\u003erepresents that something is a representation of something\u003cbr\u003eelse of which it is itself a representation.","Interpretant"],["Interpretant","1\u002f1","… every comparison requires, besides the related thing, the\u003cbr\u003eground, and the correlate, also a mediating representation\u003cbr\u003ewhich represents the relate to be a representation of the\u003cbr\u003esame correlate which this mediating representation itself\u003cbr\u003erepresents. Such a mediating representation may be termed an\u003cbr\u003e…","Interpretant"],["Interpretant","1\u002f1","A sign stands for something to the idea which it produces,\u003cbr\u003eor modifies. Or, it is a vehicle conveying into the mind\u003cbr\u003esomething from without. That for which it stands is called\u003cbr\u003eits Object; that which it conveys, its Meaning; and the idea\u003cbr\u003eto which it gives rise, its Interpretant. The object of …","Interpretant"],["Interpretant","1\u002f1","A sign is a thing which serves to convey knowledge of some\u003cbr\u003eother thing, which it is said to stand for or represent.\u003cbr\u003eThis thing is called the object of the sign; the idea in the\u003cbr\u003emind that the sign excites, which is a mental sign of the\u003cbr\u003esame object, is called an interpretant of the sign.","Interpretant"],["Interpretant","1\u002f1","A representation is that character of a thing by virtue of\u003cbr\u003ewhich, for the production of a certain mental effect, it may\u003cbr\u003estand in place of another thing. The thing having this\u003cbr\u003echaracter I term a representamen, the mental effect, or\u003cbr\u003ethought, its interpretant, the thing for which it stands,\u003cbr\u003eits object.","Interpretant"],["Interpretant","1\u002f1","A Representamen can be considered from three formal points\u003cbr\u003eof view, namely, first, as the substance of the\u003cbr\u003erepresentation, or the Vehicle of the Meaning, which is\u003cbr\u003ecommon to the three representamens of the triad, second, as\u003cbr\u003ethe quasi-agent in the representation, conformity to which\u003cbr\u003emakes its Truth, …","Interpretant"],["Interpretant","1\u002f1","A sign, or representamen, is something which stands to\u003cbr\u003esomebody for something in some respect or capacity. It\u003cbr\u003eaddresses somebody, that is, creates in the mind of that\u003cbr\u003eperson an equivalent sign, or perhaps a more developed sign.\u003cbr\u003eThat sign which it creates I call the interpretant of the\u003cbr\u003efirst sign.","Interpretant"],["Interpretant","1\u002f1","A representamen, or sign, is anything which stands, in any\u003cbr\u003erespect, at once in a relation of correspondence to a\u003cbr\u003ecorrelate, called its object[,] and to another correlate,\u003cbr\u003eits interpretant. which is a possible representamen\u003cbr\u003edetermined by the first and referring to the same object.","Interpretant"],["Interpretant","1\u002f1","I call a representamen which is determined by another\u003cbr\u003erepresentamen, an interpretant of the latter.","Interpretant"],["Interpretant","1\u002f1","A representation represents an object to an interpretant,\u003cbr\u003ewhich is a representation of the same object determined by\u003cbr\u003ethe first representation.","Interpretant"],["Interpretant","1\u002f1","Every sign functioning as such determines an interpretant\u003cbr\u003esign. Generally there are [many] different signs of\u003cbr\u003edifferent meaning which the sign authorizes. I call all\u003cbr\u003ethese its interpretants. The complete interpretant is the\u003cbr\u003esign itself.","Interpretant"],["Interpretant","1\u002f1","A sign is also intended to determine, in a mind or\u003cbr\u003eelsewhere, a sign of the same object; and this interpretant\u003cbr\u003eof the sign may be the very sign itself; but as a general\u003cbr\u003erule it will be different.","Interpretant"],["Interpretant","1\u002f1","Every sign has an object, which may be regarded either as it\u003cbr\u003eis immediately represented in the sign to be [or] as it is\u003cbr\u003ein it own firstness. It is equally essential to the function\u003cbr\u003eof a sign that it should determine an Interpretant, or\u003cbr\u003esecond correlate related to the object of the sign as the\u003cbr\u003esign …","Interpretant"],["Interpretant","1\u002f1","… every sign is intended to determine a sign of the same\u003cbr\u003eobject with the same signification or meaning. Any sign, B,\u003cbr\u003ewhich a sign, A, is fitted so to determine, without\u003cbr\u003eviolation of its, A’s, purpose, that is, in accordance with\u003cbr\u003ethe ‘Truth,’ even though it, B, denotes but a part of the\u003cbr\u003eobjects of …","Interpretant"],["Interpretant","1\u002f1","The interpretant is created by the sign; and since the sign\u003cbr\u003eas such determines the interpretant, it is in some sense\u003cbr\u003erepresented in the sign, that is, it is called up by the\u003cbr\u003esign while in itself it is acted on by the sign. It is so\u003cbr\u003eacted upon as to represent the sign to be a sign of the\u003cbr\u003eobject. …","Interpretant"],["Interpretant","1\u002f1","…an interpretant is an idea or other sign legitimately &amp;\u003cbr\u003epurposely determined by a sign.","Interpretant"],["Interpretant","1\u002f1","… a Sign has an Object and an Interpretant, the latter being\u003cbr\u003ethat which the Sign produces in the Quasi-mind that is the\u003cbr\u003eInterpreter by determining the latter to a feeling, to an\u003cbr\u003eexertion, or to a Sign, which determination is the\u003cbr\u003eInterpretant.","Interpretant"],["Interpretant","1\u002f1","…a sign is not only on the one hand determined by a more or\u003cbr\u003eless real object but on the other hand it determines\u003cbr\u003esomething, – which I call its interpretant, – to be through\u003cbr\u003eit determined as it is by the object of the sign. The\u003cbr\u003einterpretants of the signs with which logic chiefly has to\u003cbr\u003edo are …","Interpretant"],["Interpretant","1\u002f1","A ‘sign’, I say, shall be understood as anything which\u003cbr\u003erepresents itself to convey an influence from an Object, so\u003cbr\u003ethat this may intelligently determine a ‘meaning’, or\u003cbr\u003e‘interpretant’","Interpretant"],["Interpretant","1\u002f1",".. a sign endeavours to represent, in part at least, an\u003cbr\u003eObject, which is therefore in a sense the cause, or\u003cbr\u003edeterminant, of the sign even if the sign represents its\u003cbr\u003eobject falsely. But to say that it represents its Object\u003cbr\u003eimplies that it affects a mind, and so affects it as, in\u003cbr\u003esome respect, to …","Interpretant"],["Interpretant","1\u002f1","I pass now to the […] essential ingredient of the\u003cbr\u003einterpreter, or as I prefer to call it, the interpretant. I\u003cbr\u003emight call it the Meaning, since it includes all that the\u003cbr\u003esign really does convey to the interpreter, its entire\u003cbr\u003eessential influence, in its capacity as sign. But I prefer,\u003cbr\u003efor the …","Interpretant"],["Interpretant","1\u002f1","…any sign, of whatsoever kind, professes to mediate between\u003cbr\u003ean Object, on the one hand, that to which it applies, and\u003cbr\u003ewhich is thus in a sense the cause of the sign, and, on the\u003cbr\u003eother hand, a Meaning, or to use a preferable technical\u003cbr\u003eterm, an Interpretant, that which the sign expresses, the\u003cbr\u003eresult …","Interpretant"],["Interpretant","1\u002f1","For the proper significate outcome of a sign, I propose the\u003cbr\u003ename, the interpretant of the sign. The example of the\u003cbr\u003eimperative command shows that it need not be of a mental\u003cbr\u003emode of being.","Interpretant"],["Interpretant","1\u002f1","How shall we name the entire mental effect which a sign of\u003cbr\u003eitself is calculated, in its proper significative function,\u003cbr\u003eto produce? The word signification is somewhat too narrow,\u003cbr\u003esince, as examples will soon show, this mental effect may be\u003cbr\u003eof the nature of an emotion or that of an effort. No …","Interpretant"],["Interpretant","1\u002f1","…the essential nature of a sign is that it mediates between\u003cbr\u003eits Object which is supposed to determine it and to be, in\u003cbr\u003esome sense, the cause of it, and its Meaning, or, as I\u003cbr\u003eprefer to say, in order to avoid certain ambiguities, its\u003cbr\u003eInterpretant, which is determined by the sign; and is, in a\u003cbr\u003esense, …","Interpretant"],["Interpretant","1\u002f1","I define a Sign as anything which is so determined by\u003cbr\u003esomething else, called its Object, and so determines an\u003cbr\u003eeffect upon a person, which effect I call its Interpretant,\u003cbr\u003ethat the latter is thereby mediately determined by the\u003cbr\u003eformer. My insertion of “upon a person” is a sop to\u003cbr\u003eCerberus, because I …","Interpretant"],["Interpretant","1\u002f1","It is usual and proper to distinguish two Objects of a Sign,\u003cbr\u003ethe Mediate without, and the Immediate within the Sign. Its\u003cbr\u003eInterpretant is all that the Sign conveys: acquaintance with\u003cbr\u003eits Object must be gained by collateral experience.","Interpretant"],["Interpretant","1\u002f2","Now let us pass to the Interpretant. I am far from having\u003cbr\u003efully explained what the Object of a Sign is; but I have\u003cbr\u003ereached the point where further explanation must suppose\u003cbr\u003esome understanding of what the Interpretant is. The Sign\u003cbr\u003ecreates something in the Mind of the Interpreter, which\u003cbr\u003esomething, in …","Interpretant"],["Interpretant","2\u002f2","seen madmen or read about them; and it will be all the\u003cbr\u003ebetter if one specifically knows (and need not be driven to\u003cbr\u003epresume) what Shakespeare’s notion of insanity was. All that\u003cbr\u003eis collateral observation and is no part of the\u003cbr\u003eInterpretant. But to put together the different subjects as\u003cbr\u003ethe sign …","Interpretant"],["Interpretant","1\u002f1","It is not only essential to a Sign that it should represent,\u003cbr\u003ei.e. stand in place of or for, an Object, but, if possible,\u003cbr\u003estill more so that it should be capable of Interpretation by\u003cbr\u003eor through a mind, into which it implants a germ which, on\u003cbr\u003edevelopment, will affect the conduct of the person to …","Interpretant"],["Interpretant","1\u002f1","By the Interpretant of a Sign is meant all that the Sign can\u003cbr\u003esignify, mean, or itself convey of new, in contradistinction\u003cbr\u003eto what it may stimulate the observer to find out otherwise,\u003cbr\u003eas for example, by new experience, or by recollecting former\u003cbr\u003eexperiences.","Interpretant"],["Interpretant","1\u002f1","… any thing that the sign, as such, effects may be\u003cbr\u003econsidered as the Interpretant.","Interpretant"],["Interpretant","1\u002f1","The Interpretant is the mental action on the Object that the\u003cbr\u003eSign excites.","Interpretant"],["Interpretant","1\u002f1","…that which is modified by the representation, that is,\u003cbr\u003e[the] idea created in the mind, called the Interpretant.","Interpretant"]],"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003econcept=%{customdata[0]}\u003cbr\u003echunk=%{customdata[1]}\u003cbr\u003equote=%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Interpretant attestation #0","Interpretant attestation #1","Interpretant attestation #2","Interpretant attestation #3","Interpretant attestation #4","Interpretant attestation #5","Interpretant attestation #6","Interpretant attestation #7","Interpretant attestation #8","Interpretant attestation #9","Interpretant attestation #10","Interpretant attestation #11","Interpretant attestation #12","Interpretant attestation #13","Interpretant attestation #14","Interpretant attestation #15","Interpretant attestation #16","Interpretant attestation #17","Interpretant attestation #18","Interpretant attestation #19","Interpretant attestation #20","Interpretant attestation #21","Interpretant attestation #22","Interpretant attestation #23","Interpretant attestation #24","Interpretant attestation #25","Interpretant attestation #26","Interpretant attestation #27","Interpretant attestation #28","Interpretant attestation #29","Interpretant attestation #29","Interpretant attestation #30","Interpretant attestation #31","Interpretant attestation #32","Interpretant attestation #33","Interpretant attestation #34"],"legendgroup":"Interpretant","marker":{"color":"#FECB52","symbol":"circle","opacity":0.8,"size":6},"mode":"markers","name":"Interpretant","showlegend":true,"x":{"dtype":"f4","bdata":"KroVQSDnFUGTxBVBw+sVQSEbGEGa8xhBMioMQbbnC0GvwhRBLZEJQW8MDkHW\u002fRJBpkwjQRjZHUEFMiNBf04hQZH6I0EoKCZBxUUjQSkqJEFfbiJBCREmQfnKLUFkaCVBkEckQdyFJEGmFiZB8NMeQQBSKkHdJiZBFoQmQbcfIkHMASZBBrolQVU3JkHNWxRB"},"xaxis":"x","y":{"dtype":"f4","bdata":"DZoKQXiVCkH++sRABYXCQOf0x0BAJtJAN0e0QJ2pw0BhqcxAj5zGQBZlwUDENsBAmj\u002feQFjd3ECch9RAOr\u002fZQKt82EAU+N9AfC3ZQL2a1EBubtxAI8zUQDAf8EAkf9lA6P7hQLDq7ECEeNdAjs\u002fZQPO42UAyF+FA8JDgQChj3EBrGtpAVoTaQADg3UB+2MNA"},"yaxis":"y","type":"scattergl"},{"customdata":[["Logic","1\u002f1","…logic treats of the reference of symbols in general to\u003cbr\u003etheir objects.","Logic"],["Logic","1\u002f1","…Logic is the study of the laws of signs so far as these\u003cbr\u003edenote things – those laws of signs which determine what\u003cbr\u003ethings they denote and what they do not…","Logic"],["Logic","1\u002f1","“Dyalectica,” says the logical text-book of the middle ages,\u003cbr\u003e“est ars artium et scientia scientiarum, ad omnium aliarum\u003cbr\u003escientiarum methodorum principia viam habens,” and although\u003cbr\u003ethe logic of our day must naturally be utterly different\u003cbr\u003efrom that of the Plantagenet epoch, yet this general …","Logic"],["Logic","1\u002f1","Logic treats of signs. A sign is a third.","Logic"],["Logic","1\u002f1","Logic is a critic. It distinguishes between what it approves\u003cbr\u003eand what it condemns. This is why it must divide\u003cbr\u003epropositions by dichotomy.","Logic"],["Logic","1\u002f1","Logic and metaphysics make no special observations; but they\u003cbr\u003erest upon observations which have been made by common men.\u003cbr\u003eMetaphysics rests upon observations of real objects, while\u003cbr\u003elogic rests upon observations of real facts about mental\u003cbr\u003eproducts, such as that, not merely according to some\u003cbr\u003earbitrary …","Logic"],["Logic","1\u002f1","Logic may be defined as the science of the laws of the\u003cbr\u003estable establishment of beliefs.","Logic"],["Logic","1\u002f1","Logic is the Theory of Reasoning. Its main business is to\u003cbr\u003eascertain the conditions upon which the just strength of\u003cbr\u003ereasoning depends.","Logic"],["Logic","1\u002f1","Logic proper is the theory of reasoning. That is to say, it\u003cbr\u003eis the study which aims to ascertain what must be the\u003cbr\u003eperceptible relations between possible facts in order that\u003cbr\u003ethe knowledge that certain ones are true may warrant us in\u003cbr\u003eassuming that certain others are not true. This definition\u003cbr\u003eis …","Logic"],["Logic","1\u002f1","Logic, in its general sense, is, as I believe I have shown,\u003cbr\u003eonly another name for semiotic (σημειωτική), the quasi-\u003cbr\u003enecessary, or formal, doctrine of signs.","Logic"],["Logic","1\u002f1","Logic is a branch of philosophy. That is to say it is an\u003cbr\u003eexperiential, or positive science, but a science which rests\u003cbr\u003eon no special observations, made by special observational\u003cbr\u003emeans, but on phenomena which lie open to the observation of\u003cbr\u003eevery man, every day and hour. There are two main branches\u003cbr\u003eof …","Logic"],["Logic","1\u002f1","Logic is the science of the general necessary laws of Signs\u003cbr\u003eand especially of Symbols.","Logic"],["Logic","1\u002f1","It is pretty generally admitted that logic is a normative\u003cbr\u003escience, that is to say, it not only lays down rules which\u003cbr\u003eought to be, but need not be followed; but it is the\u003cbr\u003eanalysis of the conditions of attainment of something of\u003cbr\u003ewhich purpose is an essential ingredient. It is, therefore,\u003cbr\u003eclosely …","Logic"],["Logic","1\u002f1","At the outset, we define the principal purpose of logic to\u003cbr\u003ebe to learn how to conduct any inquiry. [—] In my opinion,\u003cbr\u003ethe purpose of logic must ultimately come to be recognized\u003cbr\u003eas that of studying all that will be true of signs, or\u003cbr\u003erepresentations, independently of what particular signs have\u003cbr\u003e…","Logic"],["Logic","1\u002f1","…logic is the science of regulating your thoughts so as not\u003cbr\u003eto be surprised when it can be avoided; and therefore\u003cbr\u003ewhatever is said in logic about the modes of being of\u003cbr\u003equalities, of laws, etc must be understood as regulative\u003cbr\u003etruth in Kant’s sense.","Logic"],["Logic","1\u002f1","Now it may be that logic ought to be the science of\u003cbr\u003eThirdness in general. But as I have studied it, it is simply\u003cbr\u003ethe science of what must be and ought to be true\u003cbr\u003erepresentation, so far as representation can be known\u003cbr\u003ewithout any gathering of special facts beyond our ordinary\u003cbr\u003edaily life. It is, in …","Logic"],["Logic","1\u002f1","The ultimate purpose of the logician is to make out the\u003cbr\u003etheory of how knowledge is advanced.","Logic"],["Logic","1\u002f1","Supposing […] that normative science divides into esthetics,\u003cbr\u003eethics, and logic, then it is easily perceived, from my\u003cbr\u003estandpoint, that this division is governed by the three\u003cbr\u003ecategories. For Normative Science in general being the\u003cbr\u003escience of the laws of conformity of things to ends,\u003cbr\u003eesthetics …","Logic"],["Logic","1\u002f1","Logic is the theory of self-controlled, or deliberate,\u003cbr\u003ethought; and as such, must appeal to ethics for its\u003cbr\u003eprinciples. It also depends upon phenomenology and upon\u003cbr\u003emathematics. All thought being performed by means of signs,\u003cbr\u003elogic may be regarded as the science of the general laws of\u003cbr\u003esigns.","Logic"],["Logic","1\u002f1","Logic […] studies the relation of the phenomenon to the\u003cbr\u003eessential character of the phenomenon as controllable, that\u003cbr\u003eis, its reasonableness, or embodying an idea. That which\u003cbr\u003eembodies an idea is a sign, and it is best to make logic the\u003cbr\u003escience of the general properties of signs.","Logic"],["Logic","1\u002f1","[Peirce] regards logic as the science of signs in general.","Logic"],["Logic","1\u002f1","Logic is that branch of normative science which studies the\u003cbr\u003econditions of truth, or that kind of excellence which may or\u003cbr\u003emay not belong to objects considered as representing real\u003cbr\u003eobjects. [—] …logic, as a normative science, entirely\u003cbr\u003edisregards what the particular state of things may be, and …","Logic"],["Logic","1\u002f1","Logic, for me, is the study of the essential conditions to\u003cbr\u003ewhich signs must conform in order to function as such. How\u003cbr\u003ethe constitution of the human mind may compel men to think\u003cbr\u003eis not the question; and the appeal to language appears to\u003cbr\u003eme to be no better than an unsatisfactory method of …","Logic"],["Logic","1\u002f1","Logic […] is but an application of ethics to thought. For\u003cbr\u003ereasoning differs from the formation of a new belief by the\u003cbr\u003eaction of the association of ideas only be being a\u003cbr\u003edeliberate, controlled piece of conduct. However, the one\u003cbr\u003esole way to success in logic is to regard it as a science of\u003cbr\u003esigns; and …","Logic"],["Logic","1\u002f1","Logic, – I do not mean to define, but only to characterize\u003cbr\u003eit, – is supposed to be a science which investigates the\u003cbr\u003eprinciples upon which we are to decide whether any given\u003cbr\u003eargument makes its pretensions good or not.","Logic"],["Logic","1\u002f1","Logic is no doubt a science of “thought”; but “thought,” in\u003cbr\u003ethat sense, is no more internal than it is external. Logic\u003cbr\u003eis the science of truth and falsity. But truth and falsity\u003cbr\u003ebelong as much to propositions printed in books as to\u003cbr\u003epropositions in the human consciousness. The fact that a …","Logic"],["Logic","1\u002f1","…the very kernel of logic consists in the investigation of\u003cbr\u003ethe validity of arguments, which depend upon their necessary\u003cbr\u003econformity (whether perfect or not) to real facts. Now\u003cbr\u003ethinking one way or another will not alter facts. Logic, it\u003cbr\u003eis true, does not inquire into the facts of real and non- …","Logic"],["Logic","1\u002f1","…it will be necessary for the present and for a long time to\u003cbr\u003ecome to regard logic, not as a distinct science, but as only\u003cbr\u003ea department of the science of the general constitution of\u003cbr\u003esigns, – the physiology of signs, cenoscopic semeiotics. For\u003cbr\u003eit we roughly define a sign as a medium of …","Logic"],["Logic","1\u002f1","…we may as well consider Logic as the Science of the Nature\u003cbr\u003eof Signs, Semeiotic.","Logic"],["Logic","1\u002f1","…logic is merely the science of ideas considered as signs.","Logic"],["Logic","1\u002f1","…it would seem proper that in the present state of knowledge\u003cbr\u003elogic should be regarded as coëxtensive with General\u003cbr\u003eSemeiotic, the a priori theory of signs.","Logic"],["Logic","1\u002f1","The purpose and utility of logic […] lies in its final\u003cbr\u003eachievement of a methodeutic for the guidance of thought;\u003cbr\u003eand from this point of view logic is the theory of the self-\u003cbr\u003econtrol of thought in order to realize its intention, which\u003cbr\u003eis truth. So regarded, logic may be called a special kind of\u003cbr\u003e…","Logic"],["Logic","1\u002f1","In short, logic is the theory of all reasoning, while\u003cbr\u003emathematics is the practice of a particular kind of\u003cbr\u003ereasoning.","Logic"],["Logic","1\u002f1","Logic is the science of the classification of arguments.\u003cbr\u003eReasoning is self-controlled thought; and thus Logic is\u003cbr\u003edirectly dependent upon Ethics, or the science of self-\u003cbr\u003econtrol, in general.","Logic"],["Logic","1\u002f1","Logic is […] synonymous with semeiotic, the pure theory of\u003cbr\u003esigns in general.","Logic"],["Logic","1\u002f1","Logic, in general, seems to be the science of what is\u003cbr\u003euniversally true respecting scientific representations. In a\u003cbr\u003enarrow sense, logic is the science of the general conditions\u003cbr\u003eof the truth of scientific representations.","Logic"]],"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003econcept=%{customdata[0]}\u003cbr\u003echunk=%{customdata[1]}\u003cbr\u003equote=%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Logic attestation #0","Logic attestation #1","Logic attestation #2","Logic attestation #3","Logic attestation #4","Logic attestation #5","Logic attestation #6","Logic attestation #7","Logic attestation #8","Logic attestation #9","Logic attestation #10","Logic attestation #11","Logic attestation #12","Logic attestation #13","Logic attestation #14","Logic attestation #15","Logic attestation #16","Logic attestation #17","Logic attestation #18","Logic attestation #19","Logic attestation #20","Logic attestation #21","Logic attestation #22","Logic attestation #23","Logic attestation #24","Logic attestation #25","Logic attestation #26","Logic attestation #27","Logic attestation #28","Logic attestation #29","Logic attestation #30","Logic attestation #31","Logic attestation #32","Logic attestation #33","Logic attestation #34","Logic attestation #35"],"legendgroup":"Logic","marker":{"color":"#636efa","symbol":"circle","opacity":0.8,"size":6},"mode":"markers","name":"Logic","showlegend":true,"x":{"dtype":"f4","bdata":"XpbYQD+Bt0At8bRAzCTdQCMJnkBszT9AvgO5QG5ltEBdKLZAZnTAQBIftUC3xblAbjC0QAJFtECqqbVA4\u002fq1QCGlsUCuOag\u002fqOK1QEaJt0DMEb9AoSq2QKU+t0CAvLpAOIKzQPDLqUDLZcFAqpzBQFK\u002fvEBS97xAAIG\u002fQP\u002fxskDFArJAsiSxQPQ7u0CCiLdA"},"xaxis":"x","y":{"dtype":"f4","bdata":"tVoJQYJfD0E2cxZBskAFQfn7FUE9kxFBvckVQRw2GUFA7xlBxOoIQUiOGEHxYg1BVpwVQSLeFkGUqhlB6GkXQT\u002f0FEHE1NpA5LUXQRaZEEHJhwpBwIAYQSNtFEEz1xFBlo0WQRI7KkHMkxJBaIYJQS\u002fOCEH3fgxBgFIJQco0GUGazRlBCM4aQVMVCEGL+RdB"},"yaxis":"y","type":"scattergl"},{"customdata":[["Pragmatism","1\u002f1","…a quarter of a century ago I was led to the doctrine and\u003cbr\u003emaxim of right thinking that, if we search out all the\u003cbr\u003epractical consequences of a conception, we have in their\u003cbr\u003eaggregate the entire meaning of that conception. This\u003cbr\u003edoctrine, known as pragmatism, has certainly found some\u003cbr\u003eredoubtable …","Pragmatism"],["Pragmatism","1\u002f1","Pragmatism is a method in philosophy. Philosophy is that\u003cbr\u003ebranch of positive science (i.e., an investigating\u003cbr\u003etheoretical science which inquires what is the fact, in\u003cbr\u003econtradistinction to pure mathematics which merely seeks to\u003cbr\u003eknow what follows from certain hypotheses) which makes no\u003cbr\u003eobservations but …","Pragmatism"],["Pragmatism","1\u002f1","Pragmatism is the principle that every theoretical judgment\u003cbr\u003eexpressible in a sentence in the indicative mood is a\u003cbr\u003econfused form of thought whose only meaning, if it has any,\u003cbr\u003elies in its tendency to enforce a corresponding practical\u003cbr\u003emaxim expressible as a conditional sentence having its\u003cbr\u003eapodosis in …","Pragmatism"],["Pragmatism","1\u002f1","What the pragmatist has his pragmatism for is to be able to\u003cbr\u003esay: here is a definition and it does not differ at all from\u003cbr\u003eyour confusedly apprehended conception because there is no\u003cbr\u003epractical difference. But what is to prevent his opponent\u003cbr\u003efrom replying that there is a practical difference which …","Pragmatism"],["Pragmatism","1\u002f1","What the true definition of Pragmatism may be, I find it\u003cbr\u003every hard to say; but in my nature it is a sort of\u003cbr\u003einstinctive attraction for living facts.","Pragmatism"],["Pragmatism","1\u002f1","There is a logical doctrine called Pragmatism. It is the\u003cbr\u003edoctrine that what any word or thought means consists in\u003cbr\u003ewhat it can contribute to an expectation about future\u003cbr\u003eexperience, and nothing more.","Pragmatism"],["Pragmatism","1\u002f1","…one of the most solid principles of common sense is that\u003cbr\u003ewhen we begin any serious undertaking we ought to do so\u003cbr\u003edeliberately. Now this deliberation consists in making out\u003cbr\u003eas well as we can what the upshot of our efforts is likely\u003cbr\u003eto be. I propose to show the Pragmatism is nothing but …","Pragmatism"],["Pragmatism","1\u002f1","…the doctrine he called Pragmatism, namely, that every\u003cbr\u003econcept (as distinguished from a generalized sensation, such\u003cbr\u003eas ‘red’) is equivalent to a conditional purpose, should one\u003cbr\u003ehave certain desires and certain types of experience, to act\u003cbr\u003ein a certain general way.","Pragmatism"],["Pragmatism","1\u002f1","…the doctrine of Pragmatism […] according to which every\u003cbr\u003econcept proper (as distinguished from a feeling, image, or\u003cbr\u003epercept) is fully interpretable in terms of conceivable\u003cbr\u003econduct…","Pragmatism"],["Pragmatism","1\u002f1","…the principle […] called pragmatism, namely that an\u003cbr\u003eintellectual concept is nothing but a concept of a purpose\u003cbr\u003ethat might be entertained under conceivable circumstances.","Pragmatism"],["Pragmatism","1\u002f1","…the principle he called pragmatism, that is, that every\u003cbr\u003econcept (in contrast to qualities of feeling, images,\u003cbr\u003eexperiences, etc.) is definable in terms of a possible\u003cbr\u003epurpose of conduct under hypothetical general conditions,\u003cbr\u003eand that from this can be deduced the best rule for\u003cbr\u003erendering ideas clear, …","Pragmatism"],["Pragmatism","1\u002f1","…when a philosopher speaks of the ‘concept’ of matter, or\u003cbr\u003ethe ‘concept’ of cause, or any other ‘concept,’ what he\u003cbr\u003emeans by a ‘concept’ is a word or other legisign. Hence it\u003cbr\u003ehas been justly said that the entire purport of any concept\u003cbr\u003elies in the character of the actions or external effects\u003cbr\u003ewhich it …","Pragmatism"],["Pragmatism","1\u002f1","The word pragmatism was invented to express a certain maxim\u003cbr\u003eof logic, which, as was shown at its first enouncement,\u003cbr\u003einvolves a whole system of philosophy. The maxim is intended\u003cbr\u003eto furnish a method for the analysis of concepts. A concept\u003cbr\u003eis something having the mode of being of a general type\u003cbr\u003ewhich …","Pragmatism"],["Pragmatism","1\u002f1","… he [the writer of this article] framed the theory that a\u003cbr\u003econception, that is, the rational purport of a word or other\u003cbr\u003eexpression, lies exclusively in its conceivable bearing upon\u003cbr\u003ethe conduct of life; so that, since obviously nothing that\u003cbr\u003emight not result from experiment can have any direct …","Pragmatism"],["Pragmatism","1\u002f1","…I have come to think that the common pragmatistic opinion\u003cbr\u003e[…] is that every thought (unless perhaps certain single\u003cbr\u003eideas each quite sui generis) has a meaning beyond the\u003cbr\u003eimmediate content of the thought itself, so that it is as\u003cbr\u003eabsurd to speak of a thought in itself as it would be to say\u003cbr\u003eof a man …","Pragmatism"],["Pragmatism","1\u002f1","In the April number of the Monist [‘What Pragmatism Is’,\u003cbr\u003e1905] I proposed that the word ‘pragmatism’ should hereafter\u003cbr\u003ebe used somewhat loosely to signify affiliation with\u003cbr\u003eSchiller, James, Dewey, Royce, and the rest of us, while the\u003cbr\u003eparticular doctrine which I invented the word to denote,\u003cbr\u003ewhich is …","Pragmatism"],["Pragmatism","1\u002f1","… pragmatism is, in itself, no doctrine of metaphysics, no\u003cbr\u003eattempt to determine any truth of things. It is merely a\u003cbr\u003emethod of ascertaining the meanings of hard words and of\u003cbr\u003eabstract concepts. All pragmatists of whatsoever stripe will\u003cbr\u003ecordially assent to that statement. As to the ulterior and …","Pragmatism"],["Pragmatism","1\u002f1","I understand pragmatism to be a method of ascertaining the\u003cbr\u003emeanings, not of all ideas, but only of what I call\u003cbr\u003e‘intellectual concepts,’ that is to say, of those upon the\u003cbr\u003estructure of which, arguments concerning objective fact may\u003cbr\u003ehinge. [—] My pragmatism, having nothing to do with\u003cbr\u003equalities of …","Pragmatism"],["Pragmatism","1\u002f1","…pragmatism teaches that the “meaning” of any belief as a\u003cbr\u003emental representation resides in the character of the habit\u003cbr\u003eof conduct which it implies. If this be so, it is surely\u003cbr\u003eincorrect to say that pragmatism makes the ultimate\u003cbr\u003e“meaning” of a concept to consist in any kind of\u003cbr\u003erecommendation or …","Pragmatism"],["Pragmatism","1\u002f1","[Pragmatism] says nothing directly as to the truth of\u003cbr\u003ethings: but is merely a method professing to disclose the\u003cbr\u003emeaning of any and every abstract concept or general word,\u003cbr\u003ephrase, or conception, provided its meaning be of an\u003cbr\u003eintellectual nature. [—] I do not understand by pragmatism a\u003cbr\u003emethod of …","Pragmatism"],["Pragmatism","1\u002f1","I understand pragmatism to be a method of ascertaining the\u003cbr\u003emeanings, not of all ideas, but only of what I call\u003cbr\u003e“intellectual concepts,” that is to say of those upon the\u003cbr\u003estructure of which arguments concerning objective fact may\u003cbr\u003ehinge.","Pragmatism"],["Pragmatism","1\u002f1","[Pragmatism] is no doctrine of the truth of things; it is\u003cbr\u003eonly a method of finding out the meanings of hard words and\u003cbr\u003ehard concepts (for concepts are mental signs;) and this\u003cbr\u003emethod is, in essence, no other than the method of\u003cbr\u003eexperiment of the physical sciences. [—] I understand it to\u003cbr\u003ebe a method …","Pragmatism"],["Pragmatism","1\u002f1","… pragmatism does not undertake to say in what the meanings\u003cbr\u003eof all signs consist, but merely to lay down a method of\u003cbr\u003edetermining the meanings of intellectual concepts, that is,\u003cbr\u003eof those upon which reasonings may turn.","Pragmatism"],["Pragmatism","1\u002f1","… Pragmatism was not a theory which special circumstances\u003cbr\u003ehad led its authors to entertain. It had been designed and\u003cbr\u003econstructed, to use the expression of Kant,\u003cbr\u003earchitectonically. Just as a civil engineer, before erecting\u003cbr\u003ea bridge, a ship, or a house, will think of the different\u003cbr\u003eproperties of all …","Pragmatism"],["Pragmatism","1\u002f1","…so far as my pragmatism is a doctrine, it is the doctrine\u003cbr\u003ethat the significance of any intellectual thought consists\u003cbr\u003ein the particular manner in which it tends, and will tend,\u003cbr\u003eto regulate the thinker’s conduct.","Pragmatism"],["Pragmatism","1\u002f1","According to that logical doctrine which the present writer\u003cbr\u003efirst formulated in 1873 and named Pragmatism, the true\u003cbr\u003emeaning of any product of the intellect lies in whatever\u003cbr\u003eunitary determination it would impart to practical conduct\u003cbr\u003eunder any and every conceivable circumstance, supposing such\u003cbr\u003e…","Pragmatism"],["Pragmatism","1\u002f1","…Pragmatism or the doctrine of pragmatic clarification […]\u003cbr\u003econsists in a clear conception of that Habit of Conduct in\u003cbr\u003ewhich any given concept would work out its actualization.","Pragmatism"],["Pragmatism","1\u002f1","I will venture to guess that you will be surprised to learn\u003cbr\u003e[…] how true it is that a habit can be acquired by imaginary\u003cbr\u003epractice. Out of such considerations, which turn, as if upon\u003cbr\u003ea pivot, about the idea that a thought is nothing but a\u003cbr\u003ehabit connected with a sign, one can build up quite a little\u003cbr\u003e…","Pragmatism"]],"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003econcept=%{customdata[0]}\u003cbr\u003echunk=%{customdata[1]}\u003cbr\u003equote=%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Pragmatism attestation #0","Pragmatism attestation #1","Pragmatism attestation #2","Pragmatism attestation #3","Pragmatism attestation #4","Pragmatism attestation #5","Pragmatism attestation #6","Pragmatism attestation #7","Pragmatism attestation #8","Pragmatism attestation #9","Pragmatism attestation #10","Pragmatism attestation #11","Pragmatism attestation #12","Pragmatism attestation #13","Pragmatism attestation #14","Pragmatism attestation #15","Pragmatism attestation #16","Pragmatism attestation #17","Pragmatism attestation #18","Pragmatism attestation #19","Pragmatism attestation #20","Pragmatism attestation #21","Pragmatism attestation #22","Pragmatism attestation #23","Pragmatism attestation #24","Pragmatism attestation #25","Pragmatism attestation #26","Pragmatism attestation #27"],"legendgroup":"Pragmatism","marker":{"color":"#EF553B","symbol":"circle","opacity":0.8,"size":6},"mode":"markers","name":"Pragmatism","showlegend":true,"x":{"dtype":"f4","bdata":"vFzeQBVd1UCCC9dAGrvhQHLk1UC5QuBAtG3bQFE+30BNRt5AbsLbQMYZ4ECNpuhAZQXeQHUc4UAKu+BABmHUQB6M10D9xNxAyjLjQNch2ECU3NRAMrzUQPJ91UBcPtdAj5DdQGns2kC6Jt1A\u002fR\u002fhQA=="},"xaxis":"x","y":{"dtype":"f4","bdata":"mvJEQbEdQUHnA0NBsUJDQR0iREFCbkVBim9DQZbsQ0HYfEVB\u002fm1FQfBMREFRF0NByFxDQW8aRUFqzEJBWyFBQUx6QUFNk0VBH21DQZdCQ0Et3ENBbShDQTq\u002fQkEfU0NBpoZGQQhxQkGAfUZBKMpIQQ=="},"yaxis":"y","type":"scattergl"},{"customdata":[["Real","1\u002f2","… And what do we mean by the real? It is a conception which\u003cbr\u003ewe must first have had when we discovered that there was an\u003cbr\u003eunreal, an illusion; that is, when we first corrected\u003cbr\u003eourselves. Now the distinction for which alone this fact\u003cbr\u003elogically called, was between an ens relative to private\u003cbr\u003einward …","Real"],["Real","2\u002f2","doing so in any special case. But it follows that since no\u003cbr\u003ecognition of ours is absolutely determinate, generals must\u003cbr\u003ehave a real existence. Now this scholastic realism is\u003cbr\u003eusually set down as a belief in metaphysical fictions. But,\u003cbr\u003ein fact, a realist is simply one who knows no more recondite\u003cbr\u003e…","Real"],["Real","1\u002f1","A real thing is something whose characters are independent\u003cbr\u003eof how any representation represents it to be. Independent,\u003cbr\u003etherefore, of how any number of men think it to be. Idealism\u003cbr\u003edoes not falsify definition. [—] The Real thing is the\u003cbr\u003eultimate opinion about it. About it that is about the\u003cbr\u003eultimate …","Real"],["Real","1\u002f3","… Objects are divided into figments, dreams, etc., on the\u003cbr\u003eone hand, and realities on the other. The former are those\u003cbr\u003ewhich exist only inasmuch as you or I or some man imagines\u003cbr\u003ethem; the latter are those which have an existence\u003cbr\u003eindependent of your mind or mine or that of any number of\u003cbr\u003epersons. The …","Real"],["Real","2\u002f3","and opinion contains an arbitrary, accidental element,\u003cbr\u003edependent on the limitations in circumstances, power, and\u003cbr\u003ebent of the individual; an element of error, in short. But\u003cbr\u003ehuman opinion universally tends in the long run to a\u003cbr\u003edefinite form, which is the truth. Let any human being have\u003cbr\u003eenough …","Real"],["Real","3\u002f3","is arbitrary and individual in thought; is quite independent\u003cbr\u003eof how you, or I, or any number of men think. Everything,\u003cbr\u003etherefore, which will be thought to exist in the final\u003cbr\u003eopinion is real, and nothing else.","Real"],["Real","1\u002f1","If an object is of whatever character I or any man or men\u003cbr\u003ewill have it to be or imagine it, it is a fiction; but if\u003cbr\u003eits characters are independent of what you or I or any\u003cbr\u003enumber of men think about it, it is a reality. The object of\u003cbr\u003ethat final settled opinion to which it is supposed that an …","Real"],["Real","1\u002f3","Let us now approach the subject of logic, and consider a\u003cbr\u003econception which particularly concerns it, that of reality.\u003cbr\u003eTaking clearness in the sense of familiarity, no idea could\u003cbr\u003ebe clearer than this. Every child uses it with perfect\u003cbr\u003econfidence, never dreaming that he does not understand it.\u003cbr\u003eAs for …","Real"],["Real","2\u002f3","dreamt to possess them. Thus we may define the real as that\u003cbr\u003ewhose characters are independent of what anybody may think\u003cbr\u003ethem to be. But, however satisfactory such a definition may\u003cbr\u003ebe found, it would be a great mistake to suppose that it\u003cbr\u003emakes the idea of reality perfectly clear. [—] On the other\u003cbr\u003e…","Real"],["Real","3\u002f3","thought in general, but only of what you or I or any finite\u003cbr\u003enumber of men may think about it; and that, on the other\u003cbr\u003ehand, though the object of the final opinion depends on what\u003cbr\u003ethat opinion is, yet what that opinion is does not depend on\u003cbr\u003ewhat you or I or any man thinks.","Real"],["Real","1\u002f1","The commodious and compact representation in our minds, or\u003cbr\u003eicon of our hopes about beliefs[,] is that there is\u003cbr\u003esomething fixed and not subject to our wills called the\u003cbr\u003ereality, and that our beliefs come to shape themselves more\u003cbr\u003eand more under experience in conformity to that reality. So\u003cbr\u003efar as they …","Real"],["Real","1\u002f1","By a true proposition (if there be any such thing) I mean a\u003cbr\u003eproposition which at some time, past or future, emerges into\u003cbr\u003ethought, and has the following three characters: 1st, no\u003cbr\u003edirect effort of yours, mine, or anybody’s, can reverse it\u003cbr\u003epermanently, or even permanently prevent its asserting …","Real"],["Real","1\u002f1","These characters equally apply to pure mathematics. [—] The\u003cbr\u003epure mathematician deals exclusively with hypotheses.\u003cbr\u003eWhether or not there is any corresponding real thing, he\u003cbr\u003edoes not care. His hypotheses are creatures of his own\u003cbr\u003eimagination; but he discovers in them relations which\u003cbr\u003esurprise him …","Real"],["Real","1\u002f1","Reality […] is a special mode of being, the characteristic\u003cbr\u003eof which is that things that are real are whatever they\u003cbr\u003ereally are, independently of any assertion about them.","Real"],["Real","1\u002f2","Truth is a character which attaches to an abstract\u003cbr\u003eproposition, such as a person might utter. [—] But whether\u003cbr\u003eor not there would be perhaps any reality is a question for\u003cbr\u003ethe metaphysician, not the logician. Even if the\u003cbr\u003emetaphysician decides that where there is no truth there is\u003cbr\u003eno reality, still …","Real"],["Real","2\u002f2","any number of generations, yet ultimately research – if it\u003cbr\u003ebe persisted in – must bring back the contrary belief. But\u003cbr\u003ein holding that doctrine, the idealist necessarily draws the\u003cbr\u003edistinction between truth and reality. In the above we have\u003cbr\u003econsidered positive scientific truth. But the same …","Real"],["Real","1\u002f1","[The] real state of things is something which is “so,” that\u003cbr\u003eis, has a certain determination, or specialization, or\u003cbr\u003ebeing, whether it be opined to be so or otherwise.\u003cbr\u003eTherefore, the reader holds that for every question not\u003cbr\u003enonsensical, there is a certain determination of being which\u003cbr\u003eis completely …","Real"],["Real","1\u002f1","The reality of a thing consists in its retaining its own\u003cbr\u003echaracters quite independently of whatever opinion or fancy\u003cbr\u003eyou or I or any man or generation of men may entertain about\u003cbr\u003eit. Reality has its grades. Any object which maintains its\u003cbr\u003echaracters with sufficient steadiness to make one\u003cbr\u003eproposition …","Real"],["Real","1\u002f1","…”real” is a word which I use to denote merely that which is\u003cbr\u003esuch as it is independently of you or I or any of our\u003cbr\u003ecommunity thinking it to be so.","Real"],["Real","1\u002f1","The method prescribed in the maxim [of pragmatism] is to\u003cbr\u003etrace out in the imagination the conceivable practical\u003cbr\u003econsequences, – that is, the consequences for deliberate,\u003cbr\u003eself-controlled conduct, – of the affirmation or denial of\u003cbr\u003ethe concept; and the assertion of the maxim is that herein\u003cbr\u003elies the …","Real"],["Real","1\u002f1","By mellonization (Gr. μέλλωγ the being about to do, to be,\u003cbr\u003eor to suffer) I mean that operation of logic by which what\u003cbr\u003eis conceived as having been (which I call conceived as\u003cbr\u003eparele’lythose) is conceived as repeated or extended\u003cbr\u003eindefinitely into what always will be (or what will some day\u003cbr\u003ebe, that …","Real"],["Real","1\u002f2","As to reality, one finds it defined in various ways; but if\u003cbr\u003ethat principle of terminological ethics that was proposed be\u003cbr\u003eaccepted, the equivocal language will soon disappear. For\u003cbr\u003erealis and realitas are not ancient words. They were\u003cbr\u003einvented to be terms of philosophy in the thirteenth\u003cbr\u003ecentury, and …","Real"],["Real","2\u002f2","ever thought that all generals were real; but the\u003cbr\u003escholastics used to assume that generals were real when they\u003cbr\u003ehad hardly any, or quite no, experiential evidence to\u003cbr\u003esupport their assumption; and their fault lay just there,\u003cbr\u003eand not in holding that generals could be real.) [—] That\u003cbr\u003ewhich any true …","Real"],["Real","1\u002f1","A real is anything that is not affected by men’s cognitions\u003cbr\u003eabout it.","Real"],["Real","1\u002f1","…reality means a certain kind of non-dependence upon\u003cbr\u003ethought, and so is a cognitionary character, while existence\u003cbr\u003emeans reaction with the environment, and so is a dynamic\u003cbr\u003echaracter…","Real"],["Real","1\u002f1","…the word real was introduced as a technical word (first of\u003cbr\u003elaw and then of logic) and was so little used before Scotus\u003cbr\u003eand so continually by him that it ought to be regarded as\u003cbr\u003ehis word; and my ethics of terminology will not permit me to\u003cbr\u003egive it any other meaning than that it is that whose …","Real"],["Real","1\u002f1","The word “reality” […] is used in ordinary parlance in its\u003cbr\u003ecorrect philosophical sense. It is curious that its legal\u003cbr\u003emeaning, in which we speak of “real estate,” is the\u003cbr\u003eearliest, occurring early in the twelfth century. Albertus\u003cbr\u003eMagnus, who, as a high ecclesiastic, must have had to do\u003cbr\u003ewith such …","Real"],["Real","1\u002f1","By real, I always mean that which is such as it is whatever\u003cbr\u003eyou or I or any generation of men may opine or otherwise\u003cbr\u003ethink that it is. There must not be any confusion between\u003cbr\u003ereality and exteriority[.] [T]hat is real which is as it is\u003cbr\u003eno matter what one may think about it. The external is that\u003cbr\u003e…","Real"],["Real","1\u002f1","But to say that a singular is known by sense is a confusion\u003cbr\u003eof thought. It is not known by the feeling-element of sense,\u003cbr\u003ebut by the compulsion, the insistency, that characterizes\u003cbr\u003eexperience. For the singular subject is real; and reality is\u003cbr\u003einsistency. That is what we mean by “reality.” It is the …","Real"],["Real","1\u002f1","“Real” is a word invented in the thirteenth century to\u003cbr\u003esignify having Properties, i.e. characters sufficing to\u003cbr\u003eidentify their subject, and possessing these whether they be\u003cbr\u003eanywise attributed to it by any single man or group of men,\u003cbr\u003eor not. Thus, the substance of a dream is not Real , since\u003cbr\u003eit was …","Real"],["Real","1\u002f1","That which is such that something true about it is either\u003cbr\u003etrue independently of the thought of any definite mind or\u003cbr\u003eminds or is at least true independently of what any person\u003cbr\u003eor any definite individual group of persons think about that\u003cbr\u003etruth, is real.","Real"],["Real","1\u002f1","Whether the object immediately before the mind is the Real\u003cbr\u003eobject or not seems to be a question from which it is\u003cbr\u003edifficult to extract any clear meaning; but it [is] quite\u003cbr\u003ecertain that no thinking about it will at all modify the\u003cbr\u003eReal object, since this is precisely what is meant by\u003cbr\u003ecalling it Real. …","Real"],["Real","1\u002f1","That is Real which has characters independently of what\u003cbr\u003econtrary or other characters any person or collection of\u003cbr\u003epersons may in any sort of idea attribute to it. This is not\u003cbr\u003eto say the characters are possessed independently of all\u003cbr\u003eThought about it, nor of whatever might be the final opinion\u003cbr\u003eto …","Real"],["Real","1\u002f1","…Real is the proper contrary of Illusion, Delusion, or\u003cbr\u003eFigment, while to exist means, by virtue of the ex in\u003cbr\u003eexsistere, to act upon, to react against, the other things\u003cbr\u003ethat exist in the psycho-physical universe.","Real"],["Real","1\u002f1","…that circumstance is Real which is as it is whether one\u003cbr\u003ethinks that it is so, or not. That object is Real of which\u003cbr\u003ewhatever is true or is truly said, is so, whether you or I\u003cbr\u003eor any person or persons think that it is so, or not, –\u003cbr\u003eunless, indeed, the predicate in question (i.e. that which\u003cbr\u003eis said …","Real"],["Real","1\u002f1","I call anything “real” be it anything asserted, or imagined,\u003cbr\u003eor conceived, or any element of such assertion, image, or\u003cbr\u003econcept, or of whatever other sort it may be, if, and only\u003cbr\u003eif, it possesses characters which it would possess, just the\u003cbr\u003esame, whether […] you or I, or anybody else, or everybody …","Real"],["Real","1\u002f1","For what is it for a thing to be Real? [—] To say that a\u003cbr\u003ething is Real is merely to say that such predicates as are\u003cbr\u003etrue of it, or some of them, are true of it regardless of\u003cbr\u003ewhatever any actual person or persons might think concerning\u003cbr\u003ethat truth. Unconditionality in that single respect\u003cbr\u003econstitutes …","Real"],["Real","1\u002f1","Now, what precisely do we mean when we assert that any thing\u003cbr\u003eis “real”; in other words, what is the character which we\u003cbr\u003emean, or intend to cause the person whom we address to\u003cbr\u003ebelieve, is true of that thing. What we all mean is that\u003cbr\u003ethere are predicates that are true of that thing, and would\u003cbr\u003ebe true …","Real"],["Real","1\u002f1","…using the word “real” to signify something which is as it\u003cbr\u003eis independently of its being so represented in any\u003cbr\u003eindividual mind or minds, even though it be not independent\u003cbr\u003eof all that may be in some individual mind or minds…","Real"],["Real","1\u002f1","What we can in some measure know is our universe in such a\u003cbr\u003esense that we cannot mean anything of what may be “beyond.”\u003cbr\u003eBut the Ding an sich is very different from my idea of the\u003cbr\u003eReal, which is what I opine, or incline to believe that the\u003cbr\u003emen wisest about it will some day come unceasingly (as long\u003cbr\u003e…","Real"],["Real","1\u002f1","By “reality” is to be understood that part or ingredient of\u003cbr\u003ethe being of anything which does not depend upon that\u003cbr\u003ething’s actually being represented.","Real"]],"hovertemplate":"\u003cb\u003e%{hovertext}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003econcept=%{customdata[0]}\u003cbr\u003echunk=%{customdata[1]}\u003cbr\u003equote=%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Real attestation #0","Real attestation #0","Real attestation #1","Real attestation #2","Real attestation #2","Real attestation #2","Real attestation #3","Real attestation #4","Real attestation #4","Real attestation #4","Real attestation #5","Real attestation #6","Real attestation #7","Real attestation #8","Real attestation #9","Real attestation #9","Real attestation #10","Real attestation #11","Real attestation #12","Real attestation #13","Real attestation #14","Real attestation #15","Real attestation #15","Real attestation #16","Real attestation #17","Real attestation #18","Real attestation #19","Real attestation #20","Real attestation #21","Real attestation #22","Real attestation #23","Real attestation #24","Real attestation #25","Real attestation #26","Real attestation #27","Real attestation #28","Real attestation #29","Real attestation #30","Real attestation #31","Real attestation #32","Real attestation #33"],"legendgroup":"Real","marker":{"color":"#00cc96","symbol":"circle","opacity":0.8,"size":6},"mode":"markers","name":"Real","showlegend":true,"x":{"dtype":"f4","bdata":"LFbzQD877kDPBv5ADKT8QF25+UAy9wBBjcv2QOjO+0Bw7\u002ftAiHD\u002fQMgd70DlpvBAm\u002fZqQHWFBEFGj+xAtY7oQFTaAEE3tPdAzPAAQc9w50D5KA9Bl+TyQD0+7EBAGwFB9kYGQcyA+EB9yvdAEUEBQVl1EkEIY\u002flAiFcBQWXPAEEW+v1AdRoIQVFLAEGksf5AIiH5QBSL\u002fECWygFBxLwGQarCAUE="},"xaxis":"x","y":{"dtype":"f4","bdata":"ojk0QQOWNUH0aDJB0dc1QUgHN0E+wzVBQ8ExQTteM0ElazVBXCs3QUsmNUEdCypBzPoiQVt9NEF6GCxBQfIvQQZRMkF2FTBB6K8zQZ8\u002fQE
