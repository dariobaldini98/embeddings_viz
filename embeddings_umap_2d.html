["Dissociation","1\u002f1","In a paper published in the Proceedings of the American\u003cbr\u003eAcademy of Arts and Sciences for 1867 May 14, I defined the\u003cbr\u003ethree ways in which an idea can be mentally isolated from\u003cbr\u003eanother. They [are] Dissociation, Prescission, and\u003cbr\u003eDiscrimination. Dissociation consists in imagining a case\u003cbr\u003einto which the …","other"],["Distinction","1\u002f1","…even when one element cannot even be supposed without\u003cbr\u003eanother, they may ofttimes be distinguished from one\u003cbr\u003eanother. Thus we can neither imagine nor suppose a taller\u003cbr\u003ewithout a shorter, yet we can distinguish the taller from\u003cbr\u003ethe shorter. I call this mode of separation Distinction.","other"],["Dot","1\u002f1","A heavy dot scribed at the hook of a spot shall be\u003cbr\u003eunderstood as filling the corresponding blank of the rheme\u003cbr\u003eof the spot with an indefinite sign of an individual, so\u003cbr\u003ethat when there is a dot attached to every hook, the result\u003cbr\u003eshall be a proposition which is particular in respect to\u003cbr\u003eevery subject.","other"],["Double Cut","1\u002f1","Two cuts one of which has the enclosure of the other on its\u003cbr\u003earea and has nothing else there constitute a double cut.","other"],["Doubt","1\u002f3","We generally know when we wish to ask a question and when we\u003cbr\u003ewish to pronounce a judgment, for there is a dissimilarity\u003cbr\u003ebetween the sensation of doubting and that of believing. But\u003cbr\u003ethis is not all which distinguishes doubt from belief. There\u003cbr\u003eis a practical difference. Our beliefs guide our desires …","other"],["Doubt","2\u002f3","when the occasion arises. Doubt has not the least such\u003cbr\u003eactive effect, but stimulates us to inquiry until it is\u003cbr\u003edestroyed. This reminds us of the irritation of a nerve and\u003cbr\u003ethe reflex action produced thereby; while for the analogue\u003cbr\u003eof belief, in the nervous system, we must look to what are\u003cbr\u003ecalled …","other"],["Doubt","3\u002f3","into the interrogative form does not stimulate the mind to\u003cbr\u003eany struggle after belief. There must be a real and living\u003cbr\u003edoubt, and without this all discussion is idle.","other"],["Doubt","1\u002f1","… the action of thought is excited by the irritation of\u003cbr\u003edoubt, and ceases when belief is attained; so that the\u003cbr\u003eproduction of belief is the sole function of thought. All\u003cbr\u003ethese words, however, are too strong for my purpose. It is\u003cbr\u003eas if I had described the phenomena as they appear under a\u003cbr\u003emental …","other"],["Doubt","1\u002f2","A belief is chiefly an affair of the soul, not of the\u003cbr\u003econsciousness; a doubt, on the contrary, is chiefly an\u003cbr\u003eaffair of consciousness. It is an uneasy feeling, a special\u003cbr\u003econdition of irritation, in which the idea of two\u003cbr\u003eincompatible modes of conduct [is] before the doubter’s\u003cbr\u003eimagination, and …","other"],["Doubt","2\u002f2","Such anger is a virtual acknowledgment of one’s own doubt;\u003cbr\u003ethat is to say, not a genuine doubt, or feeling of\u003cbr\u003euneasiness, but a sense that it is possible we may come to\u003cbr\u003edoubt it. Such doubt, at first of a purely external nature,\u003cbr\u003esets up as reaction an effort to enter into the doubt and to\u003cbr\u003e…","other"],["Doubt","1\u002f1","The state of doubt is a state of indeterminacy between two\u003cbr\u003epropositions. It is unsatisfactory. It is a state of\u003cbr\u003estimulation, accompanied by a peculiar feeling.","other"],["Doubt","1\u002f2","Philosophers of very diverse stripes propose that philosophy\u003cbr\u003eshall take its start from one or another state of mind in\u003cbr\u003ewhich no man, least of all a beginner in philosophy,\u003cbr\u003eactually is. One proposes that you shall begin by doubting\u003cbr\u003eeverything, and says that there is only one thing that you\u003cbr\u003ecannot …","other"],["Doubt","2\u002f2","say that one is to believe what is not true, or that what a\u003cbr\u003eman does not doubt is ipso facto true?” No, but unless he\u003cbr\u003ecan make a thing white and black at once, he has to regard\u003cbr\u003ewhat he does not doubt as absolutely true.[—] Belief is not\u003cbr\u003ea momentary mode of consciousness; it is a habit of mind …","other"],["Doubt","1\u002f1","Doubt is a state of mind characterized by a feeling of\u003cbr\u003euneasiness. Nevertheless, we cannot from a logical, and\u003cbr\u003eespecially from a pragmaticistical point of view, regard the\u003cbr\u003edoubt as consisting in feeling. [—] A true doubt is […] a\u003cbr\u003edoubt which really interferes with the proper action of a\u003cbr\u003ebelief- …","other"],["Doubt","1\u002f1","Every decent house dog has been taught beliefs that appear\u003cbr\u003eto have no application to the wild state of the dog; and yet\u003cbr\u003eyour trained dog has not, I guess, been observed to have\u003cbr\u003epassed through a period of scepticism on the subject. There\u003cbr\u003eis every reason to suppose that belief came first, and the …","other"],["Doubt","1\u002f1","…a doubt is a real state of dissatisfaction; and the common\u003cbr\u003epractice of making believe to doubt, and then offering\u003cbr\u003econsiderations to appease that make-believe doubt, is a\u003cbr\u003efoolish waste of time, since the man who does not doubt can\u003cbr\u003erealize the state of mind of the man who does […] only to a\u003cbr\u003every …","other"],["Doubt","1\u002f1","Very ignorant persons confound doubt with disbelief. Many\u003cbr\u003eothers think simple unbelief constitutes doubt. What “doubt”\u003cbr\u003ereally denotes is to be insupportably discontent to dispose\u003cbr\u003efor oneself of the proposition that is said to be “doubted,”\u003cbr\u003ein any suggestible way whatever, whether it be to affirm …","other"],["Doubt","1\u002f1","…belief is essentially satisfactory; and the state of\u003cbr\u003eCartesian doubt is mere pretence or self-deception. For real\u003cbr\u003edoubt is most distressing, and nobody can pass from the\u003cbr\u003enaturally satisfied state of belief to a state of\u003cbr\u003edistressing doubt, unless some still stronger belief forces\u003cbr\u003ehim to doubt. We …","other"],["Doubt","1\u002f1","Genuine doubt is a state of mind so distressing that many\u003cbr\u003epersons cannot support it long. If I may be allowed to use\u003cbr\u003ethe word “Habit” to denote any state of mind by virtue of\u003cbr\u003ewhich a person would, under definite circumstances, —\u003cbr\u003emostly, if not invariably, consisting in his experiencing\u003cbr\u003econscious …","other"],["Duality","1\u002f1","A relation of reason is not purely dyadic: it is a relation\u003cbr\u003ethrough a sign: that is why it is dicible. Consequently the\u003cbr\u003erelation involved in duality is not dicible, but surd; and\u003cbr\u003eduality must contain as an ingredient of it a surd\u003cbr\u003edisquiparance. [—] The double relation of equiparance which\u003cbr\u003e…","other"],["Dyad","1\u002f1","An ordinary relative with an active verb as “– is a lover of\u003cbr\u003e–” or “the loving by – of –” has two blanks; it is a dyad,\u003cbr\u003eor dyadic relative.","other"],["Dyad","1\u002f1","…let a number of the proper designations of individual\u003cbr\u003esubjects be omitted, so that the assertion becomes a mere\u003cbr\u003eblank form for an assertion which can be reconverted into an\u003cbr\u003eassertion by filling all the blanks with proper names. I\u003cbr\u003eterm such a blank form a rheme. [—] If the number of blanks\u003cbr\u003eexceeds …","other"],["Dyad","1\u002f1","A rhema which has one blank is called a monad; a rhema of\u003cbr\u003etwo blanks, a dyad; a rhema of three blanks, a triad; etc.","other"],["Dyad","1\u002f1","In the present application, a medad must mean an\u003cbr\u003eindecomposable idea altogether severed logically from every\u003cbr\u003eother; a monad will mean an element which, except that it is\u003cbr\u003ethought as applying to some subject, has no other characters\u003cbr\u003ethan those which are complete in it without any reference to\u003cbr\u003e…","other"],["Dyadic Relation","1\u002f1","…a dyadic relation […] is nothing but an aggregation of\u003cbr\u003epairs. Now any two hecceities may in either order form a\u003cbr\u003epair; and any aggregate whatever of such pairs will form\u003cbr\u003esome dyadic relation. Hence, we may totally disregard the\u003cbr\u003emanner in which the hecceities are connected in determining\u003cbr\u003ethe …","other"],["Dyadic Relation","1\u002f1","A fact true of a pair of subjects […] is a “dyadic\u003cbr\u003erelation.”","other"],["Dyadic Relation","1\u002f1","A dyadic relation is a predicate of an ordered pair of\u003cbr\u003esubjects, of which one, the grammatical subject, is called\u003cbr\u003ethe relate, and the other, the grammatical object[,] is\u003cbr\u003ecalled the correlate.","other"],["Dyadic Relation","1\u002f1","Dyadic relation. A fact relating to two individuals. Thus,\u003cbr\u003ethe fact that A is similar to B, and the fact that A is a\u003cbr\u003elover of B, and the fact that A and B are both men, are\u003cbr\u003edyadic relations; while the fact that A gives B to C is a\u003cbr\u003etriadic relation. Every relation of one order of relativity\u003cbr\u003emay be …","other"],["Dyadic Relation","1\u002f1","A dyadic relation is a character whose being consists in the\u003cbr\u003elogical possibility of a definite fact concerning an ordered\u003cbr\u003epair, or dyad, of subjects; the first of these being termed\u003cbr\u003ethe relate, the second the correlate; and the relation is\u003cbr\u003esaid to subsist between the relate and correlate when the …","other"],["Dyadic Relation","1\u002f1","A dyadic relation is a genaral character of dyads, or\u003cbr\u003eordered pairs. [—] A genuine dyadic relation is one which\u003cbr\u003edoes not consist in the two members of any dyad between\u003cbr\u003ewhich it subsists having certain qualities.","other"],["Dyadic Relation","1\u002f1","By a “dyadic relation” I mean a predicate applicable to two\u003cbr\u003esubjects, usually independent.","other"],["Dyadosemeion","1\u002f1","…the division of signs according to their Monadic Objects is\u003cbr\u003esimply into 1st, Signs of Objects whose Being is Monadic\u003cbr\u003e(signs of qualities, etc), 2nd, Signs of Objects whose Being\u003cbr\u003eis Dyadic (signs of existents, past events, etc), 3rd, Signs\u003cbr\u003eof Objects whose Being is Triadic (Signs of Laws, Types, …","other"],["Dynamical Interpretant","1\u002f1","…when we speak of the interpretant of a sign, we may mean\u003cbr\u003ethe rational interpretant which fairly and justly interprets\u003cbr\u003eit, or we may mean the dynamic interpretant, i.e. the way in\u003cbr\u003ewhich the sign will actually get interpreted in the mind of\u003cbr\u003ethe person addressed in case the sign be of such a nature …","other"],["Dynamical Interpretant","1\u002f1","In regard to the Interpretant we have […] to distinguish, in\u003cbr\u003ethe first place, the Immediate Interpretant, which is the\u003cbr\u003einterpretant as it is revealed in the right understanding of\u003cbr\u003ethe Sign itself, and is ordinarily called the meaning of the\u003cbr\u003esign; while in the second place, we have to take note of …","other"],["Dynamical Interpretant","1\u002f1","…there is the dynamical interpretant which is the effect or\u003cbr\u003ethe result which the sign actually does determine…","other"],["Dynamical Interpretant","1\u002f1","… it is necessary to distinguish the Immediate Object, or\u003cbr\u003ethe Object as the Sign represents it, from the Dynamical\u003cbr\u003eObject, or really efficient but not immediately present\u003cbr\u003eObject. It is likewise requisite to distinguish the\u003cbr\u003eImmediate Interpretant, i.e. the Interpretant represented or\u003cbr\u003esignified in …","other"],["Dynamical Interpretant","1\u002f2","The Dynamical Interpretant is whatever interpretation any\u003cbr\u003emind actually makes of a sign. This Interpretant derives its\u003cbr\u003echaracter from the Dyadic category, the category of Action.\u003cbr\u003eThis has two aspects, the Active and the Passive, which are\u003cbr\u003enot merely opposite aspects but make relative contrasts …","other"],["Dynamical Interpretant","2\u002f2","until it is plain one will be compelled to do so. Thus every\u003cbr\u003eactual interpretation is dyadic … [As] pragmaticism says …\u003cbr\u003e(one part of pragmaticism, for Pragmaticism is not\u003cbr\u003eexclusively an opinion about the Dynamic Interpretant), … it\u003cbr\u003esays, for one thing, that the meaning of any sign for\u003cbr\u003eanybody …","other"],["Dynamical Interpretant","1\u002f2","…suppose I awake in the morning before my wife, and that\u003cbr\u003eafterwards she wakes up and inquires, “What sort of a day is\u003cbr\u003eit?” This is a sign, whose Object, as expressed, is the\u003cbr\u003eweather at that time, but whose Dynamical Object is the\u003cbr\u003eimpression which I have presumably derived from peeping\u003cbr\u003ebetween the …","other"],["Dynamical Interpretant","2\u002f2","The Final Interpretant is the sum of the Lessons of the\u003cbr\u003ereply, Moral, Scientific, etc. Now it is easy to see that my\u003cbr\u003eattempt to draw this three-way, “trivialis” distinction,\u003cbr\u003erelates to a real and important three-way distinction, and\u003cbr\u003eyet that it is quite hazy and needs a vast deal of study\u003cbr\u003ebefore …","other"],["Dynamical Interpretant","1\u002f1","…it appears to me that all symptoms of disease, signs of\u003cbr\u003eweather, etc., have no utterer. For I do not think we can\u003cbr\u003eproperly say that God utters any sign when He is the Creator\u003cbr\u003eof all things. But when [Lady Welby] says, as she does, that\u003cbr\u003ethis is connected with Volition, I at once note that the …","other"],["Dynamical Interpretant","1\u002f1","My Dynamical Interpretant consists in direct effect actually\u003cbr\u003eproduced by a Sign upon an Interpreter of it. [—] My\u003cbr\u003eDynamical Interpretant is that which is experienced in each\u003cbr\u003eact of Interpretation and is different in each from that of\u003cbr\u003ethe other… The Dynamical Interpretant is a single actual\u003cbr\u003eevent.","other"],["Dynamical Interpretant","1\u002f1","Now we can regard the Interpretant in 3 ways, or rather\u003cbr\u003ethere are 3 distinct things which may properly be regarded\u003cbr\u003eas the Interpretant. For any thing that the sign, as such,\u003cbr\u003eeffects may be considered as the Interpretant. And this may\u003cbr\u003ebe 1st something merely subjective, the vague determination\u003cbr\u003eof …","other"],["Dynamical Object","1\u002f1","… we have to distinguish the Immediate Object, which is the\u003cbr\u003eObject as the Sign itself represents it, and whose Being is\u003cbr\u003ethus dependent upon the Representation of it in the Sign,\u003cbr\u003efrom the Dynamical Object, which is the Reality which by\u003cbr\u003esome means contrives to determine the Sign to its\u003cbr\u003eRepresentation.","other"],["Dynamical Object","1\u002f1","… the dynamical object does not mean something out of the\u003cbr\u003emind. It means something forced upon the mind in perception,\u003cbr\u003ebut including more than perception reveals. It is an object\u003cbr\u003eof actual Experience.","other"],["Dynamical Object","1\u002f1","…every sign has two objects. It has that object which it\u003cbr\u003erepresents itself to have, its Immediate Object, which has\u003cbr\u003eno other being than that of being represented to be, a mere\u003cbr\u003eRepresentative Being, or as the Kantian logicians used to\u003cbr\u003esay a merely Objective Being; and on the other hand there is\u003cbr\u003ethe …","other"],["Dynamical Object","1\u002f1","It is usual and proper to distinguish two Objects of a Sign,\u003cbr\u003ethe Mediate without, and the Immediate within the Sign. Its\u003cbr\u003eInterpretant is all that the Sign conveys: acquaintance with\u003cbr\u003eits Object must be gained by collateral experience. The\u003cbr\u003eMediate Object is the Object outside of the Sign; I call it\u003cbr\u003e…","other"],["Dynamical Object","1\u002f1","As to the Object of a Sign, it is to be observed that the\u003cbr\u003eSign not only really is determined by its Object, – that is,\u003cbr\u003efor example, the name Charlemagne is in correspondence with\u003cbr\u003ethe historic Emperor who live in the IXth century, or the\u003cbr\u003ename Othello is fitted to that Moorish general whom …","other"],["Dynamical Object","1\u002f1","… it is necessary to distinguish the Immediate Object, or\u003cbr\u003ethe Object as the Sign represents it, from the Dynamical\u003cbr\u003eObject, or really efficient but not immediately present\u003cbr\u003eObject.","other"],["Dynamical Object","1\u002f1","We must distinguish between the Immediate Object, - i.e.,\u003cbr\u003ethe Object as represented in the sign, - and the Real (no,\u003cbr\u003ebecause perhaps the Object is altogether fictive, I must\u003cbr\u003echoose a different term; therefore:), say rather the\u003cbr\u003eDynamical Object, which, from the nature of things, the Sign\u003cbr\u003ecannot …","other"],["Dynamical Object","1\u002f1","As to the Object, that may mean the Object as cognized in\u003cbr\u003ethe Sign and therefore an Idea, or it may be the Object as\u003cbr\u003eit is regardless of any particular aspect of it, the Object\u003cbr\u003ein such relations as unlimited and final study would show it\u003cbr\u003eto be. The former I call the Immediate Object, the latter …","other"],["Economy of Research","1\u002f1","The doctrine of Economy, in general, treats of the relations\u003cbr\u003ebetween utility and cost. That branch of it which relates to\u003cbr\u003eresearch considers the relations between utility and the\u003cbr\u003ecost of diminishing the probable error of our knowledge. Its\u003cbr\u003emain problem is how with a given expenditure of money, …","other"],["Economy of Research","1\u002f1","Dr. Ernst Mach, who has one of the best faults a philosopher\u003cbr\u003ecan have, that of riding his horse to death, does just this\u003cbr\u003ewith his principle of Economy in science. But of course\u003cbr\u003ethere is a doctrine of the Economies of Research. One or two\u003cbr\u003eof its principles are easily made out. The value of …","other"],["Effectual Interpretant","1\u002f1","There is the Intentional Interpretant, which is a\u003cbr\u003edetermination of the mind of the utterer; the Effectual\u003cbr\u003eInterpretant, which is a determination of the mind of the\u003cbr\u003einterpreter; and the Communicational Interpretant, or say\u003cbr\u003ethe Cominterpretant, which is a determination of that mind\u003cbr\u003einto which the …","other"],["Efficient Causation","1\u002f1","Efficient causation […] is a compulsion determined by the\u003cbr\u003eparticular condition of things, and is a compulsion acting\u003cbr\u003eto make that situation begin to change in a perfectly\u003cbr\u003edeterminate way; and what the general character of the\u003cbr\u003eresult may be in no way concerns the efficient causation.","other"],["Efficient Causation","1\u002f1","Efficient causation is that kind of causation whereby the\u003cbr\u003eparts compose the whole; final causation is that kind of\u003cbr\u003ecausation whereby the whole calls out its parts. Final\u003cbr\u003ecausation without efficient causation is helpless; mere\u003cbr\u003ecalling for parts is what a Hotspur, or any man, may do; but\u003cbr\u003ethey will …","other"],["Efficient Cause","1\u002f1","If the cause […] is a part of the causatum, in the sense\u003cbr\u003ethat the causatum could not logically be without the cause,\u003cbr\u003eit is called an internal cause; otherwise, it is called an\u003cbr\u003eexternal cause. If the cause is of the nature of an\u003cbr\u003eindividual thing or fact, and the other factor requisite to\u003cbr\u003ethe …","other"],["Effort","1\u002f1","Effort, or exertion, is a polarized awareness in which the\u003cbr\u003eactive part has called up a contrary resisting part. It is\u003cbr\u003ealmost instantaneous and is only kept up by constant\u003cbr\u003erepetitions.","other"],["Elements","1\u002f1","In my view, logic has three parts, 1st the Elements which\u003cbr\u003emakes analysis of what one has to deal with; Arguments &amp;c.\u003cbr\u003e2nd Critic, which examines the conditions of the validity of\u003cbr\u003earguments, and 3rd Methodeutic, which shows how any inquiry\u003cbr\u003eought to be conducted.","other"],["Emotional Interpretant","1\u002f1","The first proper significate effect of a sign is a feeling\u003cbr\u003eproduced by it. There is almost always a feeling which we\u003cbr\u003ecome to interpret as evidence that we comprehend the proper\u003cbr\u003eeffect of the sign, although the foundation of truth in this\u003cbr\u003eis frequently very slight. This “emotional interpretant,” as\u003cbr\u003e…","other"],["Emotional Interpretant","1\u002f1","…there are three different interpretants. First, there is\u003cbr\u003ethe “emotional interpretant,” which consists in a feeling,\u003cbr\u003eor rather in the quality of a feeling. A concerted piece of\u003cbr\u003emusic, for example, brings a succession of musical emotions\u003cbr\u003eanswering to those of the composer. This is an extreme case;\u003cbr\u003e…","other"],["Emotional Interpretant","1\u002f1","It is now necessary to point out that there are three kinds\u003cbr\u003eof interpretants. Our categories suggest them, and the\u003cbr\u003esuggestion is confirmed by careful examination. I terms them\u003cbr\u003ethe Emotional, the Energetic, and Logical Interpretants.\u003cbr\u003eThey consist respectively in feelings, in efforts, and in\u003cbr\u003ehabit- …","other"],["Enclosure of Cut","1\u002f1","By a Cut shall be understood to mean a self-returning linear\u003cbr\u003eseparation (naturally represented by a fine-drawn or\u003cbr\u003epeculiarly colored line) which severs all that it encloses\u003cbr\u003efrom the sheet of assertion on which it stands itself, or\u003cbr\u003efrom any other area on which it stands itself. The whole\u003cbr\u003espace …","other"],["Enclosure of Cut","1\u002f1","A cut drawn upon the sheet of assertion together with its\u003cbr\u003earea and whatever is scribed upon that area constitutes a\u003cbr\u003egraph-replica scribed upon the sheet of assertion, and is\u003cbr\u003ecalled the enclosure of the cut.","other"],["Energetic Interpretant","1\u002f1","If a sign produces any further proper significate effect, it\u003cbr\u003ewill do so through the mediation of the emotional\u003cbr\u003einterpretant, and such further effect will always involve an\u003cbr\u003eeffort. I call it the energetic interpretant. The effort may\u003cbr\u003ebe a muscular one, as it is in the case of the command to\u003cbr\u003eground …","other"],["Energetic Interpretant","1\u002f1","…many signs bring about actual events. The infantry\u003cbr\u003eofficer’s word of command “Ground arms!” produces as its\u003cbr\u003eexistential interpretant, (the sign having first been\u003cbr\u003eapprehended in an “emotional interpretant,”) the slamming\u003cbr\u003edown of the musket-butts. The less thought intervenes\u003cbr\u003ebetween the …","other"],["Energetic Interpretant","1\u002f1","It is now necessary to point out that there are three kinds\u003cbr\u003eof interpretants. Our categories suggest them, and the\u003cbr\u003esuggestion is confirmed by careful examination. I terms them\u003cbr\u003ethe Emotional, the Energetic, and Logical Interpretants.\u003cbr\u003eThey consist respectively in feelings, in efforts, and in\u003cbr\u003ehabit- …","other"],["Ens Rationis","1\u002f1","An ens rationis is something whose being consists in the\u003cbr\u003epossibility of something being true about something else.","other"],["Ens Rationis","1\u002f1","An ens rationis may be defined as a subject whose being\u003cbr\u003econsists in a Secondness, or fact, concerning something\u003cbr\u003eelse. Its being is thus of the nature of Thirdness, or\u003cbr\u003ethought. Any abstraction, such as Truth or Justice, is an\u003cbr\u003eens rationis. That does not prevent Truth and Justice from\u003cbr\u003ebeing real …","other"],["Entelechy","1\u002f1","…I call the sign the Entelechy, or perfectionment, of\u003cbr\u003ereality.","other"],["Entelechy","1\u002f1","The purpose of every sign is to express “fact,” and by being\u003cbr\u003ejoined with other signs, to approach as nearly as possible\u003cbr\u003eto determining an interpretant which would be the perfect\u003cbr\u003eTruth, the absolute Truth, and as such (at least, we may use\u003cbr\u003ethis language) would be the very Universe. Aristotle gropes\u003cbr\u003e…","other"],["Entelechy","1\u002f1","The mode of being of the composition of thought, which is\u003cbr\u003ealways of the nature of the attribution of a predicate to a\u003cbr\u003esubject, is the living intelligence which is the creator of\u003cbr\u003eall intelligible reality, as well as of the knowledge of\u003cbr\u003esuch reality. It is the entelechy, or perfection of being.","other"],["Entire Graph","1\u002f1","All that is at any time scribed on the sheet of assertion is\u003cbr\u003ecalled the entire scribed graph.","other"],["Entire Graph","1\u002f1","The graph which consists of all the graphs on the sheet of\u003cbr\u003eassertion, or which consists of all that are on any one area\u003cbr\u003esevered from the sheet, shall be termed the entire graph of\u003cbr\u003ethe sheet of assertion or of that area, as the case may be.","other"],["Entire Graph","1\u002f1","Partial graphs are graphs on the sheet of assertion that are\u003cbr\u003enot the only ones scribed on the sheet. The entire graph is\u003cbr\u003eall that is scribed on the sheet.","other"],["Entitative Graph","1\u002f1","It is a subsidiary recommendation of a mode of\u003cbr\u003ediagrammatization, but one which ought to be accorded some\u003cbr\u003eweight, that it is one that the nature and habits of our\u003cbr\u003eminds will cause us at once to understand, without our being\u003cbr\u003eput to the trouble of remembering a rule that has no\u003cbr\u003erelation to our …","other"],["Equiparance","1\u002f1","The logical and hemilogical relations belong to the old\u003cbr\u003eclass of relations of reason, while relations in re are\u003cbr\u003ealogical. But there are a few not unimportant relations of\u003cbr\u003ereason which are likewise alogical. In my paper of 1867, I\u003cbr\u003ecommitted the error of identifying those relations\u003cbr\u003econstituted by …","other"],["Equiparance","1\u002f1","An equiparance is a fact about a set of objects irrespective\u003cbr\u003eof their order, such as being together, being alike, being\u003cbr\u003eunlike…","other"],["Equiparance","1\u002f1","…an equiparance; that is, the relation of B to A is\u003cbr\u003eessentially the same as that of A to B, so far as the\u003cbr\u003eduality of the pair is concerned. But no equiparance\u003cbr\u003ewhatever, with the exception of the very few that are\u003cbr\u003enecessary, such as identity, coexistence, etc., is a\u003cbr\u003elogically simple relation.","other"],["Equiparance","1\u002f1","Which is the more primitive (or fundamental, or simple) form\u003cbr\u003eof relation, that of an Equiparance (i.e. a reciprocal\u003cbr\u003erelation), or that of a Disquiparance? I say that it is the\u003cbr\u003eDisquiparance, or rather, it is the Opponency, or relation\u003cbr\u003eof which a specialization may be a Disquiparance.","other"],["Essence","1\u002f1","Coming to Essence, this in its epistemological force is that\u003cbr\u003eintelligible character which truly defines what a general or\u003cbr\u003eindefinite, that is, what an indeterminate monadic predicate\u003cbr\u003eprimarily asserts, so that all else that it asserts is the\u003cbr\u003enecessary consequence of this epistemological essence. …","other"],["Essence","1\u002f1","The essence of a thing consists in its being rendered\u003cbr\u003eintelligible by being regarded from a certain general point\u003cbr\u003eof view. This gives it an intellectual nutritiousness. For\u003cbr\u003einstance, I may be shown a complicated piece of machinery,\u003cbr\u003eand while recognizing how many parts of it must or may move\u003cbr\u003e…","other"],["Essential Breadth","1\u002f2","The informed breadth and depth suppose a state of\u003cbr\u003einformation which lies somewhere between two imaginary\u003cbr\u003eextremes. These are, first, the state in which no fact would\u003cbr\u003ebe known, but only the meaning of terms; and, second, the\u003cbr\u003estate in which the information would amount to an absolute\u003cbr\u003eintuition of …","other"],["Essential Breadth","2\u002f2","which we never could have except by means of its contrast to\u003cbr\u003esomething else. Hence we must know that Whatever is not-P‘is\u003cbr\u003enot-T, Whatever is not-P”is not-T, and Whatever is not-P”’is\u003cbr\u003enot-T. Thus, if we define the essential breadth of a term as\u003cbr\u003ethose real things of which, according to its very …","other"],["Essential Depth","1\u002f1","The informed breadth and depth suppose a state of\u003cbr\u003einformation which lies somewhere between two imaginary\u003cbr\u003eextremes. These are, first, the state in which no fact would\u003cbr\u003ebe known, but only the meaning of terms; and, second, the\u003cbr\u003estate in which the information would amount to an absolute\u003cbr\u003eintuition of …","other"],["Essential Depth","1\u002f1","The essential depth of a term which is sometimes called its\u003cbr\u003eessence consists of the really conceivable qualities\u003cbr\u003epredicated of it in its definition. This is one of the most\u003cbr\u003eimportant features of logic.","other"],["Essential Necessity","1\u002f1","There are two meanings of the words possible and necessary\u003cbr\u003ewhich are of special interest to the logician more than to\u003cbr\u003eother men. These refer to the states of information in which\u003cbr\u003ewe are supposed to know nothing, except the meanings of\u003cbr\u003ewords, and their consequences, and in which we are supposed\u003cbr\u003eto …","other"],["Essential Possibility","1\u002f1","That is essentially or logically possible which a person who\u003cbr\u003eknows no facts, though perfectly au fait at reasoning and\u003cbr\u003ewell-acquainted with the words involved, is unable to\u003cbr\u003epronounce untrue.","other"],["Essential Possibility","1\u002f1","…possibility may be understood in many senses; but they may\u003cbr\u003eall be embraced under the definition that that is possible\u003cbr\u003ewhich, in a certain state of information, is not known to be\u003cbr\u003efalse. By varying the supposed state of information all the\u003cbr\u003evarieties of possibility are obtained. Thus, essential …","other"],["Essential Possibility","1\u002f1","Very many writers assert that everything is logically\u003cbr\u003epossible which involves no contradiction. Let us call that\u003cbr\u003esort of logical possibility, essential, or formal, logical\u003cbr\u003epossibility. It is not the only logical possibility; for in\u003cbr\u003ethis sense, two propositions contradictory of one another\u003cbr\u003emay both …","other"],["Esthetics","1\u002f1","Normative science has three widely separated divisions: i.\u003cbr\u003eEsthetics; ii. Ethics; iii. Logic. Esthetics is the science\u003cbr\u003eof ideals, or of that which is objectively admirable without\u003cbr\u003eany ulterior reason. I am not well acquainted with this\u003cbr\u003escience; but it ought to repose on phenomenology.","other"],["Esthetics","1\u002f1","…it is generally said that the three normative sciences are\u003cbr\u003elogic, ethics, and esthetics, being the three doctrines that\u003cbr\u003edistinguish good and bad; Logic in regard to representations\u003cbr\u003eof truth, Ethics in regard to efforts of will, and Esthetics\u003cbr\u003ein objects considered simply in their presentation.","other"],["Esthetics","1\u002f1","…As for esthetics, although the first year of my study of\u003cbr\u003ephilosophy was devoted to this branch exclusively, yet I\u003cbr\u003ehave since then so completely neglected it that I do not\u003cbr\u003efeel entitled to have any confident opinions about it. I am\u003cbr\u003einclined to think that there is such a Normative Science;\u003cbr\u003ebut I …","other"],["Esthetics","1\u002f1","…philosophical esthetics (which becomes something very\u003cbr\u003edifferent from the study which the noun usually\u003cbr\u003edesignates)[,] studies the characters which will belong to\u003cbr\u003ethe phenomenon so far as it is controllable, that is, the\u003cbr\u003echaracters of what is aimed at. Thus, the question, What is\u003cbr\u003ethe summum bonum, …","other"],["Esthetics","1\u002f1","Esthetics is that normative science which studies the\u003cbr\u003econditions of that kind of excellence which objects may\u003cbr\u003epossess in their presentation, or appearance, regardless of\u003cbr\u003etheir relations.","other"],["Esthetics","1\u002f1","My notion is that there is a study of esthetics, not the\u003cbr\u003eexclusive pleasure-ground of those who spend their lives in\u003cbr\u003ethe delights of art, nor yet particularly considering\u003cbr\u003econduct, but a study to make out what it is wherein the\u003cbr\u003efine, the adorable, the noble, is such.","other"],["Esthetics","1\u002f1","…self-control depends upon the comparison of what is done\u003cbr\u003ewith an ideal admirable per se, without any ulterior reason.\u003cbr\u003eNow the science of that which is admirable without an\u003cbr\u003eulterior reason is Esthetics.","other"],["Ethics","1\u002f1","Philosophy seems to consist of two parts, Logic and\u003cbr\u003eMetaphysics. I exclude Ethics, for two reasons. In the first\u003cbr\u003eplace, as the science of the end and aim of life, [ethics]\u003cbr\u003eseems to be exclusively psychical, and therefore to be\u003cbr\u003econfined to a special department of experience, while\u003cbr\u003ephilosophy …","other"],["Ethics","1\u002f1","Normative science has three widely separated divisions: i.\u003cbr\u003eEsthetics; ii. Ethics; iii. Logic. … Ethics, or the science\u003cbr\u003eof right and wrong, must appeal to Esthetics for aid in\u003cbr\u003edetermining the summum bonum. It is the theory of self-\u003cbr\u003econtrolled, or deliberate, conduct.","other"],["Ethics","1\u002f1","…it is generally said that the three normative sciences are\u003cbr\u003elogic, ethics, and esthetics, being the three doctrines that\u003cbr\u003edistinguish good and bad; Logic in regard to representations\u003cbr\u003eof truth, Ethics in regard to efforts of will, and Esthetics\u003cbr\u003ein objects considered simply in their presentation.","other"],["Ethics","1\u002f1","Supposing, however, that normative science divides into\u003cbr\u003eesthetics, ethics, and logic, then it is easily perceived,\u003cbr\u003efrom my standpoint, that this division is governed by the\u003cbr\u003ethree categories. For Normative Science in general being the\u003cbr\u003escience of the laws of conformity of things to ends,\u003cbr\u003eesthetics …","other"],["Ethics","1\u002f1","Ethics studies in the controllable phenomenon the act and\u003cbr\u003eprocess of controlling it. This study is the very heart of\u003cbr\u003enormative science, and emphasizes more strongly than the\u003cbr\u003eothers that dichotomy which is the constitutive\u003cbr\u003echaracteristic of normative science. For it is the study of\u003cbr\u003ethe controlled …","other"],["Ethics","1\u002f1","Ethics is that normative science which studies the\u003cbr\u003econditions of that excellence which may or may not belong to\u003cbr\u003evoluntary action in its relation to its purpose.","other"],["Ethics","1\u002f1","…What quality of anything is it that is fine in itself\u003cbr\u003ewithout any ulterior reason? Then the problem of ethics\u003cbr\u003ebeing the study of the general conditions for making the\u003cbr\u003efine existent, it is quite plausible in advance that this\u003cbr\u003emay depend upon what the fine is. But it is a part of the\u003cbr\u003esolution of …","other"],["Ethics","1\u002f1","Reasoning is self-controlled thought; and thus Logic is\u003cbr\u003edirectly dependent upon Ethics, or the science of self-\u003cbr\u003econtrol, in general.","other"],["Eventual Interpretant","1\u002f1","The Eventual Interpretant of Sign is all that General Truth\u003cbr\u003ethat it destines, in view of the other general truths of the\u003cbr\u003euniverse, conditionally upon its full acceptance. It is the\u003cbr\u003esum and substance of all the real difference that its\u003cbr\u003eacceptance will make. [—] Any Eventual Interpretant must be\u003cbr\u003eof …","other"],["Exact Logic","1\u002f1","Logic may be defined as the science of the laws of the\u003cbr\u003estable establishment of beliefs. Then, exact logic will be\u003cbr\u003ethat doctrine of the conditions of establishment of stable\u003cbr\u003ebelief which rests upon perfectly undoubted observations and\u003cbr\u003eupon mathematical, that is, upon diagrammatical, or, iconic,\u003cbr\u003e…","other"],["Exact Logic","1\u002f1","Logic (exact): Ger. exakte Logik; Fr. logique exacte; Ital.\u003cbr\u003elogica esatta. The doctrine that the theory of validity and\u003cbr\u003estrength of reasoning ought to be made one of the ‘exact\u003cbr\u003esciences,’ that is, that generalisations from ordinary\u003cbr\u003eexperience ought, at an early point in its exposition, to be\u003cbr\u003e…","other"],["Existence","1\u002f1","The existence of things consists in their regular behavior.","other"],["Existence","1\u002f1","It is to be noted that existence is an affair of blind\u003cbr\u003eforce. “The very hyssop that grows on the wall exists in\u003cbr\u003ethat chink because the whole universe could not prevent it.”\u003cbr\u003eNo law determines any atom to exist. Existence is presence\u003cbr\u003ein some experiential universe – whether the universe of\u003cbr\u003ematerial …","other"],["Existence","1\u002f1","There are different kinds of existence. There is the\u003cbr\u003eexistence of physical actions, there is the existence of\u003cbr\u003epsychical volitions, there is the existence of all time,\u003cbr\u003ethere is the existence of the present, there is the\u003cbr\u003eexistence of material things, there is the existence of the\u003cbr\u003ecreations of one of …","other"],["Existence","1\u002f1","Existence, though brought about by dyadism, or opposition,\u003cbr\u003eas its proper determination, yet, when brought about, lies\u003cbr\u003eabstractly and in itself considered, within itself. It is\u003cbr\u003enumerical identity, which is a dyadic relation of a subject\u003cbr\u003eto itself of which nothing but an existent individual is …","other"],["Existence","1\u002f1","Existence is that mode of being which lies in opposition to\u003cbr\u003eanother. To say that a table exists is to say that it is\u003cbr\u003ehard, heavy, opaque, resonant, that is, produces immediate\u003cbr\u003eeffects upon the senses, and also that it produces purely\u003cbr\u003ephysical effects, attracts the earth (that is, is heavy), …","other"],["Existence","1\u002f1","What then does the logic of events require’? What is\u003cbr\u003erequired, as an objectively hypothetic result, is that an\u003cbr\u003earbitrary selection of them should crowd out the others.\u003cbr\u003eThis is existence, the arbitrary, blind, reaction against\u003cbr\u003eall others of accidental combinations of qualities. [—] But\u003cbr\u003eexistence is …","other"],["Existence","1\u002f1","…whatever exists is individual, since existence (not\u003cbr\u003ereality) and individuality are essentially the same thing…","other"],["Existence","1\u002f1","Existence […] is a special mode of reality, which, whatever\u003cbr\u003eother characteristics it possesses, has that of being\u003cbr\u003eabsolutely determinate.","other"],["Existence","1\u002f1","The modern philosophers - one and all, unless Schelling be\u003cbr\u003ean exception - recognize but one mode of being, the being of\u003cbr\u003ean individual thing or fact, the being which consists in the\u003cbr\u003eobject’s crowding out a place for itself in the universe, so\u003cbr\u003eto speak, and reacting by brute force of fact, against …","other"],["Existence","1\u002f1","…P. holds, with Hegel, that existence consists in the blind\u003cbr\u003ereaction of the existent with the rest of the universe in\u003cbr\u003ewhich it exists…","other"],["Existence","1\u002f1","The method prescribed in the maxim [of pragmatism] is to\u003cbr\u003etrace out in the imagination the conceivable practical\u003cbr\u003econsequences, – that is, the consequences for deliberate,\u003cbr\u003eself-controlled conduct, – of the affirmation or denial of\u003cbr\u003ethe concept; and the assertion of the maxim is that herein\u003cbr\u003elies the …","other"],["Existence","1\u002f1","The stone’s actually falling is purely the affair of the\u003cbr\u003estone and the earth at the time. This is a case of reaction.\u003cbr\u003eSo is existence which is the mode of being of that which\u003cbr\u003ereacts with other things.","other"],["Existence","1\u002f1","That mode of being which we call existence, the reaction of\u003cbr\u003eeverything in the universe against every other, the crowding\u003cbr\u003eout of a place for itself, acting most on things near, less\u003cbr\u003eon things far, but brutally insisting on a place is\u003cbr\u003eSecundan. I say “brutally”, because no law, so far as we\u003cbr\u003eknow, …","other"],["Existence","1\u002f1","…reality means a certain kind of non-dependence upon\u003cbr\u003ethought, and so is a cognitionary character, while existence\u003cbr\u003emeans reaction with the environment, and so is a dynamic\u003cbr\u003echaracter…","other"],["Existence","1\u002f1","…the term existence is properly a term, not of logic, but of\u003cbr\u003emetaphysics; and metaphysically understood, an object\u003cbr\u003eexists, if and only if, it reacts with every other existing\u003cbr\u003eobject of the same universe. But in the definition of a\u003cbr\u003elogical proper name, exist is used in its logical sense, and\u003cbr\u003emeans …","other"],["Existence","1\u002f1","…existence consists in the blind reactions between objects\u003cbr\u003ein one universe. No mere law, no “would-be”, can make that\u003cbr\u003eexertion of blind strength.","other"],["Existence","1\u002f1","…existence means precisely the exercise of compulsion.","other"],["Existence","1\u002f1","I will also take the liberty of substituting “reality” for\u003cbr\u003e“existence.” This is perhaps overscrupulosity; but I myself\u003cbr\u003ealways use exist in its strict philosophical sense of “react\u003cbr\u003ewith the other like things in the environment.” Of course,\u003cbr\u003ein that sense, it would be fetichism to say that God …","other"],["Existence","1\u002f1","A brute force, as, for example, an existent particle […] is\u003cbr\u003enothing for itself; whatever it is, it is for what it is\u003cbr\u003eattracting and what it is repelling: its being is actual,\u003cbr\u003econsists in action, is dyadic. That is what I call\u003cbr\u003eexistence.","other"],["Existence","1\u002f1","All to which the senses normally testify without room for\u003cbr\u003ecritical reasoning is usually and properly said to be\u003cbr\u003e“experienced”; and all that is truly experienced is, in the\u003cbr\u003eepistemological sense, existent. [—] In the metaphysical\u003cbr\u003esense, existence is that mode of being which consists in the\u003cbr\u003e…","other"],["Existence","1\u002f1","…Real is the proper contrary of Illusion, Delusion, or\u003cbr\u003eFigment, while to exist means, by virtue of the ex in\u003cbr\u003eexsistere, to act upon, to react against, the other things\u003cbr\u003ethat exist in the psycho-physical universe.","other"],["Existence","1\u002f1","…existence […] may be used in a wider or a narrower sense.\u003cbr\u003eIn its wider sense it is a synonym for Actual, and is such\u003cbr\u003eBeing as is both Definite and in all respects Determinate;\u003cbr\u003ewhile in its narrower sense it is a Substance, or\u003cbr\u003esubstratum, which acts on, and is acted on by, the Universe\u003cbr\u003eof Substance.","other"],["Existential Graph","1\u002f1","An existential graph is a logical graph constructed upon a\u003cbr\u003eperfectly consistent system of representation such that any\u003cbr\u003eunenclosed partial graph shall asserts something asserted by\u003cbr\u003ethe entire graph.","other"],["Existential Graph","1\u002f1","An existential graph is a logical graph governed by a.\u003cbr\u003esystem of representation founded upon the idea that the\u003cbr\u003esheet upon which it is written, as well as every portion of\u003cbr\u003ethat sheet, represents one recognized universe, real or\u003cbr\u003efictive, and that every graph drawn on that sheet, and not\u003cbr\u003ecut off from …","other"],["Existential Relation","1\u002f1","A rerelation may either be such as can only subsist between\u003cbr\u003echaracters or between laws (such as the relation of\u003cbr\u003e“essentially depending upon”), or it may be such as can\u003cbr\u003esubsist between two existent individual objects. In the\u003cbr\u003eformer case, it may be termed a modal relation (not a good\u003cbr\u003eterm), in the …","other"],["Experience","1\u002f1","The historic happenings which affect men’s beliefs [are]\u003cbr\u003ecalled experience. [—] As for this experience under the\u003cbr\u003einfluence of which beliefs are formed what is that? It is\u003cbr\u003enothing but the forceful element in the course of life.\u003cbr\u003eWhatever it is that in our history wears out our attempts to\u003cbr\u003eresist it, …","other"],["Experience","1\u002f1","Mathematical hypotheses are arbitrary creations of the mind.\u003cbr\u003eAs such, their substance is not experienced. For an\u003cbr\u003eexperience is the irresistible influence from without which\u003cbr\u003ean incident exerts upon the mind. An experience may be\u003cbr\u003eeither cognitive or emotional; but by experience\u003cbr\u003ephilosophers mean the …","other"],["Experience","1\u002f1","Experience is the course of life. The world is that which\u003cbr\u003eexperience inculcates.","other"],["Experience","1\u002f1","I use the word “experience” in a much broader sense than it\u003cbr\u003ecarries in the special sciences. For those sciences,\u003cbr\u003eexperience is that which their special means of observation\u003cbr\u003edirectly bring to light, and it is contrasted with the\u003cbr\u003einterpretations of those observations which are effected by\u003cbr\u003econnecting …","other"],["Experience","1\u002f1","What is experience? It is the resultant ideas that have been\u003cbr\u003eforced upon us. We find we cannot summon up what images we\u003cbr\u003elike. Try to banish an idea and it only comes home with\u003cbr\u003egreater violence later.","other"],["Experience","1\u002f1","By experience, I do not mean the first impressions of sense\u003cbr\u003emerely, I mean all that the history of our lives has forced\u003cbr\u003eus to assent to and accept.","other"],["Experience","1\u002f1","…experience means nothing but just that of a cognitive\u003cbr\u003enature which the history of our lives has forced upon us. It\u003cbr\u003eis indirect, if the medium of some other experience or\u003cbr\u003ethought is required to bring it out. Duality, thought\u003cbr\u003eabstractly, no doubt requires the intervention of\u003cbr\u003ereflection; but that …","other"],["Experience","1\u002f1","But precisely how does this action of experience take place?\u003cbr\u003eIt takes place by a series of surprises. There is no need of\u003cbr\u003egoing into details. At one time a ship is sailing along in\u003cbr\u003ethe trades over a smooth sea, the navigator having no more\u003cbr\u003epositive expectation than that of the usual monotony of …","other"],["Experience","1\u002f1","The type of an idea of Secondness is the experience of\u003cbr\u003eeffort, prescinded from the idea of a purpose. It may be\u003cbr\u003esaid that there is no such experience, that a purpose is\u003cbr\u003ealways in view as long as the effort is cognized. This may\u003cbr\u003ebe open to doubt; for in sustained effort we soon let the\u003cbr\u003epurpose drop …","other"],["Experience","1\u002f1","The phaneron, as I now call it, the sum total all of the\u003cbr\u003econtents of human consciousness, which I believe is about\u003cbr\u003ewhat you (borrowing the term of Avenarius) call pure\u003cbr\u003eexperience, - but I do not admit the point of view of\u003cbr\u003eAvenarius to be correct or to be consonant to any\u003cbr\u003epragmatism, nor to yours, …","other"],["Experience","1\u002f1","Experience may be defined as the cognitive element which the\u003cbr\u003ecourse of life has brutally forced upon me, without reason.\u003cbr\u003eIt implies a conservative, inert clinging to former ideas\u003cbr\u003ewhich has been conquered. This purely brute force is\u003cbr\u003eSecundan.","other"],["Experience","1\u002f1","The breaking of a belief can only be due to some novel\u003cbr\u003eexperience, whether external or internal. Now experience\u003cbr\u003ewhich could be summoned up at pleasure would not be\u003cbr\u003eexperience.","other"],["Experience","1\u002f1","We experience vicissitudes, especially. We cannot experience\u003cbr\u003ethe vicissitude without experiencing the perception which\u003cbr\u003eundergoes the change; but the concept of experience is\u003cbr\u003ebroader than that of perception, and includes much that is\u003cbr\u003enot, strictly speaking, an object of perception. It is the …","other"],["Experience","1\u002f1","An experience […] is a single event, or is an expectation of\u003cbr\u003eit; and no sum of single objects can make up a general. An\u003cbr\u003eexperience, or the generalization of experiences, seems to\u003cbr\u003eme to be rather the object determining a concept than the\u003cbr\u003emeaning determined by it.","other"],["Experience","1\u002f1","An “Experience” is a brutally produced conscious effect that\u003cbr\u003econtributes to a habit, self-controlled, yet so satisfying,\u003cbr\u003eon deliberation, as to be destructible by no positive\u003cbr\u003eexercise of internal vigour.","other"],["Experience","1\u002f1","Experience, in the proper sense of the term, is all that one\u003cbr\u003ehas gone through. It consists in the events of one’s life.","other"],["Experience","1\u002f1","By Experience, I mean any conscious effect contributing to a\u003cbr\u003ehabit, satisfactory and selfcontrolled yet destructible by\u003cbr\u003eno exercise of intellectual vigor but only by deadening\u003cbr\u003eone’s powers.","other"],["Experience","1\u002f1","Experience is that which is quite irresistibly forced in\u003cbr\u003eupon us in the course of life.","other"],["External","1\u002f2","The method prescribed in the maxim [of pragmatism] is to\u003cbr\u003etrace out in the imagination the conceivable practical\u003cbr\u003econsequences, – that is, the consequences for deliberate,\u003cbr\u003eself-controlled conduct, – of the affirmation or denial of\u003cbr\u003ethe concept; and the assertion of the maxim is that herein\u003cbr\u003elies the …","other"],["External","2\u002f2","consist of existent objects merely, nor merely of these and\u003cbr\u003etheir reactions; but on the contrary, its most important\u003cbr\u003ereals have the mode of being of what the nominalist calls\u003cbr\u003e“mere” words, that is, general types and would-bes. The\u003cbr\u003enominalist is right in saying that they are substantially of\u003cbr\u003ethe …","other"],["External","1\u002f1","An external object is anything that is not affected by any\u003cbr\u003eof man’s cognitions (whether about it or about anything\u003cbr\u003eelse) to whom it is external.","other"],["External","1\u002f1","An external object is anything that is not affected by any\u003cbr\u003ecognitions, whether about it or not, of the man to whom it\u003cbr\u003eis external. Exaggerate this, in the usual philosopher\u003cbr\u003efashion, and you have the conception of what is not affected\u003cbr\u003eby any cognitions at all. Take the converse of this\u003cbr\u003edefinition …","other"],["External","1\u002f1","There must not be any confusion between reality and\u003cbr\u003eexteriority[.] [T]hat is real which is as it is no matter\u003cbr\u003ewhat one may think about it. The external is that which is\u003cbr\u003eas it is whatever one may think about anything.","other"],["External","1\u002f1","Any object whose attributes, i.e. all that may truly be\u003cbr\u003epredicated, or asserted, of it, will, and always would,\u003cbr\u003eremain exactly what they are, unchanged, though you or I or\u003cbr\u003eany man or men should think or should have thought as\u003cbr\u003evariously as you please, I term external, in\u003cbr\u003econtradistinction to …","other"],["External","1\u002f1","A Real object may be External or Internal, i.e. mental, as a\u003cbr\u003edream is. For only that is external whose possession of some\u003cbr\u003echaracter is [not merely] independent of individuals’\u003cbr\u003eopinions, but whose possession of any such Real character is\u he\u003cbr\u003eoperation of blind law. The most obvious of all its\u003cbr\u003echaracters cannot be so explained. It is the multitudinous\u003cbr\u003efacts of all experience that show us this; but that which\u003cbr\u003ehas opened our eyes to these facts is the principle of\u003cbr\u003efallibilism. …","other"],["Fallibilism","1\u002f1","All positive reasoning is of the nature of judging the\u003cbr\u003eproportion of something in a whole collection by the\u003cbr\u003eproportion found in a sample. Accordingly, there are three\u003cbr\u003ethings to which we can never hope to attain by reasoning,\u003cbr\u003enamely, absolute certainty, absolute exactitude, absolute\u003cbr\u003euniversality. …","other"],["Fallibilism","1\u002f1","For years [—] I used for myself to collect my ideas under\u003cbr\u003ethe designation fallibilism; and indeed the first step\u003cbr\u003etoward finding out is to acknowledge you do not\u003cbr\u003esatisfactorily know already; so that no blight can so surely\u003cbr\u003earrest all intellectual growth as the blight of\u003cbr\u003ecocksureness; and ninety- …","other"],["Fallibilism","1\u002f1","No; but there is nothing at all in our knowledge which we\u003cbr\u003ehave any warrant at all for regarding as absolute in any\u003cbr\u003eparticular. Absolute infallibility may belong to the pope\u003cbr\u003eand the ecumenical councils: it is outside my province to\u003cbr\u003ediscuss that question. But I am quite confident it does not\u003cbr\u003ebelong …","other"],["Fallibilism","1\u002f1","The method of this book, therefore, is to accept the\u003cbr\u003ereasonings of pure mathematics as beyond all doubt. It is\u003cbr\u003efallible, as everything human is fallible. Twice two may\u003cbr\u003eperhaps not be four.","other"],["Falsity","1\u002f1","A proposition [whose] professed or intended object is not\u003cbr\u003ereally its object is false.","other"],["Famisign","1\u002f1","…Signs, in respect to their Modes of possible Presentation,
