e be thrown in the\u003cbr\u003eusual …","other"],["Probability","2\u002f2","you please, a metaphysical one, and is not due to any\u003cbr\u003elogical impossibility to the occurrence in a finite time of\u003cbr\u003ean endless succession of events each occupying a finite\u003cbr\u003etime. For when Achilles overtook the tortoise he had to go\u003cbr\u003ethrough such an endless series (endless in the series, but\u003cbr\u003enot …","other"],["Probable Deduction","1\u002f1","…that relation of the premissed facts to the concluded fact\u003cbr\u003ewhich is regarded as making the former a sign of the latter\u003cbr\u003e[—] may be altogether irrespective of whether the conclusion\u003cbr\u003eis recognized or not, yet such that it could not subsist if\u003cbr\u003ethe concluded fact were not probable; this is probable …","other"],["Probable Deduction","1\u002f1","Probable Deductions, or more accurately, Deductions of\u003cbr\u003eProbability, are Deductions whose Interpretants represent\u003cbr\u003ethem to be concerned with ratios of frequency. They are\u003cbr\u003eeither Statistical Deductions or Probable Deductions Proper.\u003cbr\u003eA Statistical Deduction is a Deduction whose Interpretant\u003cbr\u003erepresents …","other"],["Probable Deduction","1\u002f1","Probable Deduction is a Deduction which concludes that a\u003cbr\u003edefinite state of things has a given Probability because\u003cbr\u003ethis is substantially asserted in the Copulate Premiss.","other"],["Probable Inference","1\u002f1","Any inference which does not regard its own conclusion as\u003cbr\u003ebeing necessarily true (though the facts be as the premisses\u003cbr\u003eassert). In such an inference the facts asserted in the\u003cbr\u003epremisses are regarded as constituting a sign of the fact\u003cbr\u003estated in the conclusion in one or other of three senses, as\u003cbr\u003e…","other"],["Problem","1\u002f1","Any Problem (as I shall use the term) would be a proposition\u003cbr\u003epronouncing, in effect, that under circumstances known to\u003cbr\u003eexist or to be possible, a certain sort of result, described\u003cbr\u003epartly, at least, in a general way, exists or is possible,\u003cbr\u003ethis vague proposition being usually, though not …","other"],["Proof","1\u002f1","Proof [Lat. probare, to prove, through Fr.; it translates\u003cbr\u003eLat. probatio]: Ger. Probe; Fr. preuve; Ital. prova. An\u003cbr\u003eargument which suffices to remove all real doubt from a mind\u003cbr\u003ethat apprehends it. It is either mathematical demonstration;\u003cbr\u003ea probable deduction of so high probability that no real\u003cbr\u003edoubt …","other"],["Proper Name","1\u002f1","A proper name is a sign denoting something having an\u003cbr\u003eidentity consisting in continuity of existence and common to\u003cbr\u003ethe experience of the deliverer and interpreter of the\u003cbr\u003eproposition of which it forms a part.","other"],["Proposition","1\u002f1","An act of consciousness in which a person thinks he\u003cbr\u003erecognizes a belief is called a judgment. The expression of\u003cbr\u003ea judgment is called in logic a proposition.","other"],["Proposition","1\u002f1","A term may conform to the reality or not; that is, it may\u003cbr\u003esignify a kind of which there are examples in the universe\u003cbr\u003eof discourse or it may not. It is therefore not accurate to\u003cbr\u003edefine a proposition as which is either true or false. A\u003cbr\u003eproposition should be defined as that which professes to be\u003cbr\u003e…","other"],["Proposition","1\u002f1","A proposition is a symbol in which the representative\u003cbr\u003eelement, or reason, is left vague and unexpressed, but in\u003cbr\u003ewhich the reactive element is distinctly indicated. In\u003cbr\u003edriving along the road with a compagnon, he points at a\u003cbr\u003ehouse and remarks, “That is a pretty house.” It is a\u003cbr\u003eproposition. But I …","other"],["Proposition","1\u002f1","Symbols are of three classes: terms, which call attention to\u003cbr\u003ethings or quasi-things; propositions, which declare facts;\u003cbr\u003eand arguments, which profess to enlighten us as to the\u003cbr\u003erational connections of facts or possible facts.","other"],["Proposition","1\u002f1","A proposition is a symbol with the interpretant left blank…","other"],["Proposition","1\u002f1","A proposition may be defined as a symbol which definitely\u003cbr\u003eand separately shows all its objects, called its subjects,\u003cbr\u003ebut not its interpretant.","other"],["Proposition","1\u002f1","A Proposition is a Sign which distinctly indicates of what\u003cbr\u003eObject (called its Subject) it is the Sign, but which is\u003cbr\u003eleft to determine what Interpretant it may.","other"],["Proposition","1\u002f1","…a proposition is not a single thing and cannot properly be\u003cbr\u003esaid to have any existence. Its mode of being consists in\u003cbr\u003eits possibility. A proposition which might be expressed has\u003cbr\u003eall the being that belongs to propositions although nobody\u003cbr\u003eever expresses it or thinks it. It is the same proposition …","other"],["Proposition","1\u002f1","A representamen is either a rhema, a proposition, or an\u003cbr\u003eargument. An argument is a representamen which separately\u003cbr\u003eshows what interpretant it is intended to determine. A\u003cbr\u003eproposition is a representamen which is not an argument, but\u003cbr\u003ewhich separately indicates what object it is intended to\u003cbr\u003erepresent. …","other"],["Proposition","1\u002f1","An informant index is a proposition. For one cannot better\u003cbr\u003edefine a proposition (as distinguished from the assertion\u003cbr\u003ewhereby one assumes responsibility for its truth) than as a\u003cbr\u003erepresentation of which one part serves, directly or\u003cbr\u003eindirectly, as an index of its object, while the other part\u003cbr\u003eexcites …","other"],["Proposition","1\u002f1","…Peirce regards a proposition, by which he means the\u003cbr\u003esubstance of a judgment considered as abstracted from the\u003cbr\u003eassent to it or dissent from it, a symbol which has a part\u003cbr\u003eby which it separately indicates its object while it also\u003cbr\u003esignifies this object in another way. The genus is the\u003cbr\u003edicisign…","other"],["Proposition","1\u002f1","A sign which separately specifies what object is represents\u003cbr\u003eis a proposition; and a mere icon cannot do this. An index\u003cbr\u003emay; as a weather-cock does.","other"],["Proposition","1\u002f1","It is a perfection of a sign if it separately represents its\u003cbr\u003eobject; in which case it becomes a proposition, and is true\u003cbr\u003eor false.","other"],["Proposition","1\u002f1","A proposition […] is not to be understood as the lingual\u003cbr\u003eexpression of a judgment. It is, on the contrary, that sign\u003cbr\u003eof which the judgment is one replica and the lingual\u003cbr\u003eexpression another.","other"],["Proposition","1\u002f1","It is remarkable that while neither a pure icon nor a pure\u003cbr\u003eindex can assert anything, an index which forces something\u003cbr\u003eto be an icon, as a weathercock does, or which forces us to\u003cbr\u003eregard it as an icon, as the legend under a portrait does,\u003cbr\u003edoes make an assertion, and forms a proposition. This …","other"],["Proposition","1\u002f1","The peculiar characteristic of the proposition lies not in\u003cbr\u003eits possibly being false, but in its possibly turning out to\u003cbr\u003ebe false, and this whether it has been positively held or\u003cbr\u003emerely by not suspecting the possibility of its denial. That\u003cbr\u003eis wherein all advancement and diffusion of knowledge …","other"],["Proposition","1\u002f1","A sign which though calculated to produce belief, that is,\u003cbr\u003ethough it has the character of possible assertion, is\u003cbr\u003enevertheless not necessarily so intended, nor necessarily\u003cbr\u003eused toward that end, and which may even carry a mark to\u003cbr\u003eshow that it is actually not so intended, is a proposition.","other"],["Proposition","1\u002f1","A Proposition is any product of language which has the form\u003cbr\u003ethat adapts it to instilling belief into the mind of the\u003cbr\u003eperson addressed, supposing him to have confidence in its\u003cbr\u003eutterer. [—] A Proposition is nearly the same as an\u003cbr\u003e“Assertion.” The distinction which I use the two words to\u003cbr\u003emark is that …","other"],["Pseudo-continuum","1\u002f2","…I define a pseudo-continuum as that which modern writers on\u003cbr\u003ethe theory of functions call a continuum. But this is fully\u003cbr\u003erepresented by, and according to G. Cantor stands in one-to-\u003cbr\u003eone correspondence with, the totality of real values,\u003cbr\u003erational and irrational; and these are iconized, in their\u003cbr\u003eturn, …","other"],["Pseudo-continuum","2\u002f2","I am led to suspect that they do not regard the pseudo-\u003cbr\u003econtinuum of unlimited decimal expressions as [having\u003cbr\u003emembers] all absolutely distinct from any other, for the\u003cbr\u003ereason that, taking any one of them, it does not possess any\u003cbr\u003eone elementary and definite non-relative character which is\u003cbr\u003enot …","other"],["Pseudo-priman","1\u002f1","…although there is but one pure Priman, there are impure and\u003cbr\u003epseudo Primans, as well as Pseudo Secundans. For example, a\u003cbr\u003eLeibnizian monad is something which is represented to be all\u003cbr\u003ethat it is in itself, by itself, and for itself. But this is\u003cbr\u003eself-contradictory. If the monad really were for itself …","other"],["Pseudograph","1\u002f1","A graph is the propositional expression in the System of\u003cbr\u003eExistential Graphs of any possible state of the universe. It\u003cbr\u003eis a Symbol, and, as such, gener n the first way\u003cbr\u003eof dividing them, signs are either qualisigns, or signs …","other"],["Qualisign","1\u002f1","As it is in itself, a sign is either of the nature of an\u003cbr\u003eappearance, when I call it a qualisign; or secondly, it is\u003cbr\u003ean individual object or event, when I call it a sinsign (the\u003cbr\u003esyllable sin being the first sillable [sic] of semel, simul,\u003cbr\u003esingular, etc); or thirdly, it is of the nature of a general\u003cbr\u003e…","other"],["Qualisign","1\u002f1","The qualisign […] has no identity. It is the mere quality of\u003cbr\u003ean appearance &amp; is not exactly the same throughout a second.\u003cbr\u003eInstead of identity, it has great similarity, &amp; cannot\u003cbr\u003ediffer much without being called quite another qualisign.","other"],["Qualisign","1\u002f1","A sign in itself may be an indefinite possibility, when I\u003cbr\u003eterm as a Qualisign, or it may be an existent thing or\u003cbr\u003eevent, when I term it a Sinsign (sin- is the sim- of simul,\u003cbr\u003esimplex, etc.), or it may be a general type, when I call it\u003cbr\u003ea Legisign.","other"],["Qualisign","1\u002f1","A qualisign is an aspect, impression, or other priman\u003cbr\u003esignificant regardless of its parts or of anything else\u003cbr\u003esimply because it involves the very character signified.","other"],["Qualitative Induction","1\u002f1","[Qualitative Induction] consists of those inductions which\u003cbr\u003eare neither founded upon experience in one mass, as Crude\u003cbr\u003eInduction is, nor upon a collection of numerable instances\u003cbr\u003eof equal evidential values, but upon a stream of experience\u003cbr\u003ein which the relative evidential values of different parts\u003cbr\u003eof …","other"],["Quality","1\u002f1","Quality is the monadic element of the world. Anything\u003cbr\u003ewhatever, however complex and heterogeneous, has its quality\u003cbr\u003esui generis, its possibility of sensation, would al name which applies to a thing by virtue of its\u003cbr\u003ebeing the first correlate of a relation is called a\u003cbr\u003erelative.","other"],["Relative","1\u002f1","Our European languages are peculiar in their marked\u003cbr\u003edifferentiation of common nouns from verbs. Proper nouns\u003cbr\u003emust exist in all languages; and so must such “pronouns,” or\u003cbr\u003eindicative words, as this, that, something, anything. But it\u003cbr\u003eis probably true that in the great majority of the tongues\u003cbr\u003eof men, …","other"],["Relative","1\u002f1","A relative […] may be defined as the equivalent of a word or\u003cbr\u003ephrase which, either as it is (when I term it a complete\u003cbr\u003erelative), or else when the verb “is” is attached to it (and\u003cbr\u003eif it wants such attachment, I term it a nominal relative),\u003cbr\u003ebecomes a sentence with some number of proper names left …","other"],["Relative","1\u002f1","If from any proposition having more than one subject (used\u003cbr\u003eto include “objects”) we strike out the indices of the\u003cbr\u003esubjects, as in “– praises – to –,” “– dat in matrimonium\u003cbr\u003e–,” what remains and requires at least two insertions of\u003cbr\u003esubject-nouns to make a proposition is a “relative term,” or\u003cbr\u003e…","other"],["Relative","1\u002f1","A rhema of more than one blank is a relative.","other"],["Relative","1\u002f1","A predicate of more than one blank is called a relative\u003cbr\u003epredicate.","other"],["Relative","1\u002f1","…a relative, or relative term, is a word, phrase, or sign\u003cbr\u003efit to be the predicate of an assertion but requiring the\u003cbr\u003eaffixion of more than one subject in order to complete the\u003cbr\u003efully explicit expression of the matter of an assertion, a\u003cbr\u003edyadic relative requiring two subjects, etc.","other"],["Replica","1\u002f1","A symbol is employed over and over again, and we call all\u003cbr\u003ethe occurrences of it occ ay be used, it has to be embodied in a\u003cbr\u003eToken which shall be a sign of the Type, and thereby of the\u003cbr\u003eobject the Type signifies. I propose to call such a Token of\u003cbr\u003ea Type an Instance of the Type.","other"],["Representamen","1\u002f1","Since no one of the categories can be prescinded from those\u003cbr\u003eabove it, the list of supposable objects which they afford\u003cbr\u003eis, What is. Quale - that which refers to a ground Relate -\u003cbr\u003ethat which refers to ground and correlate Representamen -\u003cbr\u003ethat which refers to ground, correlate, and interpretantIt.","other"],["Representamen","1\u002f1","Let us call a thing considered as having a signification, a\u003cbr\u003erepresentament.","other"],["Representamen","1\u002f1","A sign, or representamen, involves a plural relation, for it\u003cbr\u003emay be defined as something in which an element of cognition\u003cbr\u003eis so embodied as to convey that cognition from the thought\u003cbr\u003eof the deliverer of the sign, in which that cognition was\u003cbr\u003eembodied, to the thought of the interpreter of the sign, …","other"],["Representamen","1\u002f1","A representation is that character of a thing by virtue of\u003cbr\u003ewhich, for the production of a certain mental effect, it may\u003cbr\u003estand in place of another thing. The thing having this\u003cbr\u003echaracter I term a representamen, the mental effect, or\u003cbr\u003ethought, its interpretant, the thing for which it stands,\u003cbr\u003eits object.","other"],["Representamen","1\u002f1","A Representamen can be considered from three formal points\u003cbr\u003eof view, namely, first, as the substance of the\u003cbr\u003erepresentation, or the Vehicle of the Meaning, which is\u003cbr\u003ecommon to the three representamens of the triad, second, as\u003cbr\u003ethe quasi-agent in the representation, conformity to which\u003cbr\u003emakes its Truth, …","other"],["Representamen","1\u002f1","… representation necessarily involves a genuine triad. For\u003cbr\u003eit involves a sign, or representamen, of some kind, outward\u003cbr\u003eor inward, mediating between an object and an interpreting\u003cbr\u003ethought. Now this is neither a matter of fact, since thought\u003cbr\u003eis general, nor is it a matter of law, since thought is …","other"],["Representamen","1\u002f1","A sign, or representamen, is something which stands to\u003cbr\u003esomebody for something in some respect or capacity. It\u003cbr\u003eaddresses somebody, that is, creates in the mind of that\u003cbr\u003eperson an equivalent sign, or perhaps a more developed sign.\u003cbr\u003eThat sign which it creates I call the interpretant of the\u003cbr\u003efirst sign. …","other"],["Representamen","1\u002f1","A representamen, or sign, is anything (not necessarily real)\u003cbr\u003ewhich stands at once in a relation of correspondence to a\u003cbr\u003esecond third, its object, and to another possible\u003cbr\u003erepresentamen, its interpretant, which it determines to\u003cbr\u003ecorrespondence with the same object. It thus involves the\u003cbr\u003eidea of a …","other"],["Representamen","1\u002f1","A representamen, or sign, is anything which stands, in any\u003cbr\u003erespect, at once in a relation of correspondence to a\u003cbr\u003ecorrelate, called its object[,] and to another correlate,\u003cbr\u003eits interpretant. which is a possible representamen\u003cbr\u003edetermined by the first and referring to the same object.\u003cbr\u003eThe idea of a …","other"],["Representamen","1\u002f2","… I confine the word representation to the operation of a\u003cbr\u003esign or its relation to the object for the interpreter of\u003cbr\u003ethe representation. The concrete subject that represents I\u003cbr\u003ecall a sign or a representamen. I use these two words, sign\u003cbr\u003eand representamen, differently. By a sign I mean anything\u003cbr\u003ewhich …","other"],["Representamen","2\u002f2","called its INTERPRETANT, this triadic relation being such\u003cbr\u003ethat the REPRESENTAMEN determines its interpretant to stand\u003cbr\u003ein the same triadic relation to the same object for some\u003cbr\u003einterpretant. It follows at once that this relation cannot\u003cbr\u003econsist in any actual event that ever can have occurred; for\u003cbr\u003ein …","other"],["Representamen","1\u002f2","A Sign, or Representamen, is a First which stands in such a\u003cbr\u003egenuine triadic relation to a Second, called its Object, as\u003cbr\u003eto be capable of determining a Third, called its\u003cbr\u003eInterpretant, to assume the same triadic relation to its\u003cbr\u003eObject in which it stands itself to the same Object. The\u003cbr\u003etriadic …","other"],["Representamen","2\u002f2","Representamen with a mental Interpretant. Possibly there may\u003cbr\u003ebe Representamens that are not Signs. Thus, if a sunflower,\u003cbr\u003ein turning towards the sun, becomes by that very act fully\u003cbr\u003ecapable, without further condition, of reproducing a\u003cbr\u003esunflower which turns in precisely corresponding ways toward\u003cbr\u003ethe …","other"],["Representamen","1\u002f1","In every genuine Triadic Relation, the First Correlate may\u003cbr\u003ebe regarded as determining the Third Correlate in some\u003cbr\u003erespect; and triadic relations may be divided according as\u003cbr\u003ethat determination of the Third Correlate is to having some\u003cbr\u003equality, or to being in some existential relation to the\u003cbr\u003eSecond …","other"],["Representamen","1\u002f1","I call that which represents a representamen.","other"],["Representamen","1\u002f1","A representamen is an object, A, in such a triadic relation\u003cbr\u003eto an object, B, for an object, C, (the italicized\u003cbr\u003eprepositions merely indicating a difference between the\u003cbr\u003edyadic relation of A to B, and that of A to C) that A is fit\u003cbr\u003eto create C by the determination of something, so that C\u003cbr\u003eshall be in …","other"],["Representamen","1\u002f1","A sign is a species under the genus representamen, the\u003cbr\u003edefinition of which says nothing about a mind. A\u003cbr\u003erepresentamen is an object A, in such a triadic relation to\u003cbr\u003ean object, B, for an object C (the italicized prepositions\u003cbr\u003emerely indicating a difference between the relations) that\u003cbr\u003eit is fit to …","other"],["Representamen","1\u002f1","I use “sign” in the widest sense of the definition. It is a\u003cbr\u003ewonderful case of an almost popular use of a very broad word\u003cbr\u003ein almost the exact sense of the scientific definition. [—]\u003cbr\u003eI formerly preferred the word representamen. But there was\u003cbr\u003eno need of this horrid long word. On the contrary, it …","other"],["Representation","1\u002f1","…a representation is something which stands for something. I\u003cbr\u003ewill not undertake to analyze […] this conception of\u003cbr\u003estanding for something — but, it is sufficiently plain that\u003cbr\u003eit involves the standing to something for something.","other"],["Representation","1\u002f1","A representation is an object which stands for another, so\u003cbr\u003ethat an experience of the former affords us a knowledge of\u003cbr\u003ethe latter. Three things are essential to its existence. In\u003cbr\u003ethe first place, it must like any other object have\u003cbr\u003equalities independent of its meaning. The printed word\u003cbr\u003e‘man’, for …","other"],["Representation","1\u002f1","A representation is an object which stands for another so\u003cbr\u003ethat an experience of the former affords us a knowledge of\u003cbr\u003ethe latter. There are three essential conditions to which\u003cbr\u003eevery representation must conform. It must in the first\u003cbr\u003eplace like any other object have qualities independent of\u003cbr\u003eits …","other"],["Representation","1\u002f1","…a thing which stands for another thing is a representation\u003cbr\u003eor sign. So that it appears that every species of actual\u003cbr\u003ecognition is of the nature of a sign. [—] Let us examine\u003cbr\u003esome of the characters of signs in general. A sign must in\u003cbr\u003ethe first place have some qualities in itself which serve to\u003cbr\u003e…","other"],["Representation","1\u002f1","Representation is a relation of one thing, – the\u003cbr\u003erepresentamen, or sign – to another, – the object, – this\u003cbr\u003erelation consisting in the determination of a third, – the\u003cbr\u003einterpretant representamen, – to be in the same mode of\u003cbr\u003erelation to the second as the first is to that second.","other"],["Representation","1\u002f1","“Representation” and “sign” are synonyms.","other"],["Representation","1\u002f1","Representation, by which I mean the function of a sign in\u003cbr\u003egeneral, is a combinant, or trifile, relation; since it\u003cbr\u003esubsists between the sign, the object represented, and the\u003cbr\u003einterpretant or sign of the same object determined by the\u003cbr\u003esign in the mind of the person addressed, or in other field\u003cbr\u003eof …","other"],["Representationism","1\u002f1","The doctrine that percepts stand for something behind them.\u003cbr\u003eIn a certain sense it must be admitted, even by\u003cbr\u003epresentationists, that percepts only perform the function of\u003cbr\u003econveying knowledge of something else. That is to say, they\u003cbr\u003ehave to be combined and generalized to become useful\u003cbr\u003eknowledge; so …","other"],["Rerelation","1\u002f1","A dyadic relation proper is either such as can only have\u003cbr\u003eplace between two subjects of different universes of\u003cbr\u003ediscourse (as the membership of a natural person in a\u003cbr\u003ecorporation), or is such as can subsist between two objects\u003cbr\u003eof the same universe. A relation of the former description\u003cbr\u003emay be termed a …","other"],["Resemblance","1\u002f1","Resemblance […] is a mode of association by the inward\u003cbr\u003enature of ideas and of mind.","other"],["Resolve","1\u002f1","[The] act of stamping with approval, “endorsing” as one’s\u003cbr\u003eown, an imaginary line of conduct so that it shall give a\u003cbr\u003egeneral shape to our actual future conduct is what we call a\u003cbr\u003eresolve.","other"],["Retrospective Science","1\u002f1","We can now no longer postpone the recognition of a second\u003cbr\u003eSub-branch of theoretical science. It is a department\u003cbr\u003eperfectly well recognized. It belongs by virtue of its\u003cbr\u003epurpose to the branch of Theory; yet varies enough in its\u003cbr\u003epurpose from the active science to be erected into a Sub-\u003cbr\u003ebranch. It is …","other"],["Retrospective Science","1\u002f1","…since the beginning of the nineteenth century, when\u003cbr\u003eColeridge so defined it in the opening dissertation to the\u003cbr\u003eEncyclopaedia Metropolitana, non-scientific people have\u003cbr\u003egenerally understood “science” to mean systematized\u003cbr\u003eknowledge. [—] The present writer [—] will call science in\u003cbr\u003ethe Coleridgean …","other"],["Rhema","1\u002f1","A rhema is somewhat closely analogous to a chemical atom or\u003cbr\u003eradicle with unsaturated bonds. A non-relative rhema is like\u003cbr\u003ea univalent radicle; it has but one unsaturated bond. A\u003cbr\u003erelative rhema is like a multivalent radicle. The blanks of\u003cbr\u003ea rhema can only be filled by terms, or, what is the same …","other"],["Rhema","1\u002f1","Rhemata are very nearly what are ordinarily designated as\u003cbr\u003eTerms. Indeed, they are the same thing more accurately\u003cbr\u003eapprehended. A Rhema, or Term, is a Sign which is left to\u003cbr\u003estand for whatever it may stand for.","other"],["Rhema","1\u002f1","A representamen is either a rhema, a proposition, or an\u003cbr\u003eargument. An argument is a representamen which separately\u003cbr\u003eshows what interpretant it is intended to determine. A\u003cbr\u003eproposition is a representamen which is not an argument, but\u003cbr\u003ewhich separately indicates what object it is intended to\u003cbr\u003erepresent. …","other"],["Rhema","1\u002f1","…the word rhema is used in logic to denote any proposition\u003cbr\u003eand any blank form which would become a proposition if every\u003cbr\u003eone of its blanks were filled with a proper name.","other"],["Rhema","1\u002f1","If parts of a proposition be erased so as to leave blanks in\u003cbr\u003etheir places, and if these blanks are of such a nature that\u003cbr\u003eif each of them be filled by a proper name the result will\u003cbr\u003ebe a proposition, then the blank form of proposition which\u003cbr\u003ewas first produced by the erasures is termed a rheme. …","other"],["Rhema","1\u002f1","A Rheme is a Sign which, for its Interpretant, is a Sign of\u003cbr\u003equalitative Possibility, that is, is understood as\u003cbr\u003erepresenting such and such a kind of possible Object. Any\u003cbr\u003erheme, perhaps, will afford some information; but it is not\u003cbr\u003einterpreted as doing so. [—] Or we may say that a Rheme is a\u003cbr\u003esign …","other"],["Rhema","1\u002f1","A rhema is either a proposition or a blank form that would\u003cbr\u003ebecome a proposition if all its blanks were filled with\u003cbr\u003eproper names.","other"],["Rhema","1\u002f1","An assertion fulfilling the condition having been obtained,\u003cbr\u003elet a number of the proper designations of individual\u003cbr\u003esubjects be omitted, so that the assertion becomes a mere\u003cbr\u003eblank form for an assertion which can be reconverted into an\u003cbr\u003eassertion by filling all the blanks with proper names. I\u003cbr\u003eterm …","other"],["Rhema","1\u002f1","Each rhema is equivalent to a blank form such that of all\u003cbr\u003eits blanks are filled with proper names, it becomes a\u003cbr\u003eproposition, or symbol capable of assertion.","other"],["Rhema","1\u002f1","Let a heavy dot or dash be used in place of a noun which has\u003cbr\u003ebeen erased from a proposition. A blank form of proposition\u003cbr\u003eproduced by such erasures as can be filled, each with a\u003cbr\u003eproper name, to make a proposition again, is called a rhema,\u003cbr\u003eor, relatively to the proposition of which it is conceived …","other"],["Rhema","1\u002f1","A rheme is a sign whose proper interpretant ignores all\u003cbr\u003edifference between the sign and its object (and a fortiori\u003cbr\u003eall difference between the sign and its interpretant)","other"],["Rhema","1\u002f1","In regard to its relation to its signified interpretant, a\u003cbr\u003esign is either a Rheme, a Dicent, or an Argument. This\u003cbr\u003ecorresponds to the old division Term, Proposition, &amp;\u003cbr\u003eArgument, modified so as to be applicable to signs\u003cbr\u003egenerally. [—] A rheme is any sign that is not true nor\u003cbr\u003efalse, like almost any …","other"],["Rhema","1\u002f1","Another case is where a sign fully interpreted in its\u003cbr\u003edefinition, the very creation of the new sign, not now\u003cbr\u003ebringing about an actual event, as with the dicisign, but\u003cbr\u003emerely imparting to the definition a certain capacity, or\u003cbr\u003econtingent power, that of being properly applied to\u003cbr\u003edesignate whatever …","other"],["Rhema","1\u002f1","If from a propositional symbol we erase one or more of the\u003cbr\u003eparts which separately denote its objects, the remainder is\u003cbr\u003ewhat is called a rhema; but I shall take the liberty of\u003cbr\u003ecalling it a term. [—] On the whole, it appears to me that\u003cbr\u003ethe only difference between my rhema and the “term” of other\u003cbr\u003e…","other"],["Rhema","1\u002f1","In their relations to their Triadic, i.e. intended or\u003cbr\u003eadaptational Interpretants, Signs may, 1st, determine those\u003cbr\u003einterpretants, merely in the sense that, if the\u003cbr\u003eInterpretants represent the Objects as the Signs themselves\u003cbr\u003edo they are such Interpretants as are intended. Such is an\u003cbr\u003eideal statuette, …","other"],["Rhema","1\u002f1","Take any proposition and erase certain parts of it, so that\u003cbr\u003eit is no longer a proposition but only a blank form which\u003cbr\u003eafter every blank had been filled by a proper name would\u003cbr\u003ebecome a proposition, however nonsensical. Such a blank form\u003cbr\u003eof proposition which can be converted into a proposition by\u003cbr\u003e…","other"],["Rhema","1\u002f1","A rheme is a blank form of proposition, such that when each\u003cbr\u003eblank is filled with a proper name, the result is a\u003cbr\u003eproposition. The valency of a rheme is the number of proper\u003cbr\u003enames that have to be inserted in it to make a complete\u003cbr\u003eproposition.","other"],["Rhema","1\u002f1","By a rheme, or predicate, will here be meant a blank form of\u003cbr\u003eproposition which might have resulted by striking out\u003cbr\u003ecertain parts of a proposition, and leaving a blank in the\u003cbr\u003eplace of each, the parts stricken out being such that if\u003cbr\u003eeach blank were filled with a proper name, a proposition\u003cbr\u003e(however …","other"],["Rhema","1\u002f1","When a blank form is such that the result of determining\u003cbr\u003eeach blank in it to express a proper name is to reconvert it\u003cbr\u003einto a proposition, however silly, that blank form is termed\u003cbr\u003ea rheme or predicate.","other"],["Rhema","1\u002f1","A rhema is an indispensible part of speech in every\u003cbr\u003elanguage. Every verb is a rhema.","other"],["Rim","1\u002f1","By a rim shall be understood an oval line making it, with\u003cbr\u003eits contents, the expression either of a rheme or a proper\u003cbr\u003ename of an ens rationis.","other"],["Scholastic Realism","1\u002f1","B ardless of any\u003cbr\u003ethird…","other"],["Secondness","1\u002f1","I find that there are in the phaneron, [—] 2nd, elements\u003cbr\u003eeach of which is such as it is relatively to to something\u003cbr\u003eover against it, regardless of any third. Such an element\u003cbr\u003emay also have a character in itself, a priman character,\u003cbr\u003einseparable from what it is to the other. But however\u003cbr\u003einseparable …","other"],["Secondness","1\u002f1","Secondness is the Mode of Being of that which is such as it\u003cbr\u003eis relatively to a Second but regardless of any third. That\u003cbr\u003emakes it of a brute nature.","other"],["Secondness","1\u002f1","Careful analysis shows that to the three grades of valency\u003cbr\u003eof indecomposable concepts correspond three classes of\u003cbr\u003echaracters or predicates. Firstly come ” firstnesses,” or\u003cbr\u003epositive internal characters of the subject in itself;\u003cbr\u003esecondly come “secondnesses,” or brute actions of one\u003cbr\u003esubject or …","other"],["Seed","1\u002f1","By a seed (granum) of an existential relation is to be\u003cbr\u003eunderstood an existing individual which not only stands in\u003cbr\u003ethat relation to some correlate, but to which also some\u003cbr\u003erelate stands in that relation.","other"],["Selective","1\u002f1","Along with such indexical directions of what to do to find\u003cbr\u003ethe object meant, ought to be classed those pronouns which\u003cbr\u003eshould be entitled selective pronouns [or quantifiers]\u003cbr\u003ebecause they inform the hearer how he is to pick out one of\u003cbr\u003ethe objects intended, but which grammarians call by the very\u003cbr\u003e…","other"],["Selective","1\u002f1","A symbol for a single individual, which individual is more\u003cbr\u003ethan once referred to, but is not identified as the object\u003cbr\u003eof a proper name, shall be termed a Selective.","other"],["Selective","1\u002f1","… in any case in which the lines \u003eof things. 2 Semiotic. Or the science of representations. 3\u003cbr\u003eFormal Science. Or the science of forms.","other"],["Semeiotic","1\u002f1","… we have now established three species of representations:\u003cbr\u003ecopies, signs, and symbols; of the last of which only logic\u003cbr\u003etreats. A second approximation to a definition of it then\u003cbr\u003ewill be, the science of symbols in general and as such. But\u003cbr\u003ethis definition is still too broad; this might, indeed, form\u003cbr\u003e…","other"],["Semeiotic","1\u002f1","The term “logic” is unscientifically by me employed in two\u003cbr\u003edistinct senses. In its narrower sense, it is the science of\u003cbr\u003ethe necessary conditions of the attainment of truth. In its\u003cbr\u003ebroader sense, it is the science of the necessary laws of\u003cbr\u003ethought, or, still better (thought always taking place by …","other"],["Semeiotic","1\u002f1","Logic, in its general sense, is, as I believe I have shown,\u003cbr\u003eonly another name for semiotic (σημειωτική), the quasi-\u003cbr\u003enecessary, or formal, doctrine of signs. By describing the\u003cbr\u003edoctrine as “quasi-necessary,” or formal, I mean that we\u003cbr\u003eobserve the characters of such signs as we know, and from\u003cbr\u003esuch an …","other"],["Semeiotic","1\u002f1","That our thoughts are signs is an old and familiar doctrine.\u003cbr\u003eI show that it is only in so far as thoughts are signs, and\u003cbr\u003eparticularly […] symbols, that they become subjects of\u003cbr\u003elogic; and further that the rules of logic are applicable to\u003cbr\u003eall symbols. Accordingly by regarding logic as a science of\u003cbr\u003e…","other"],["Semeiotic","1\u002f1","The study of languages ought to be based upon a study of the\u003cbr\u003enecessary conditions to which signs must conform in order to\u003cbr\u003efulfill their functions as signs. I have gradually been led\u003cbr\u003eto conclude that it is best to identify referring to “quod fere in omnium ore celebre est, aliud\u003cbr\u003escilicet esse quod appellatiua significant, et aliud esse\u003cbr\u003equod …","other"],["Semeiotic","1\u002f1","…it would seem proper that in the present state of knowledge\u003cbr\u003elogic should be regarded as coëxtensive with General\u003cbr\u003eSemeiotic, the a priori theory of signs.","other"],["Semeiotic","1\u002f1","Logic is […] synonymous with semeiotic, the pure theory of\u003cbr\u003esigns in general.","other"],["Semiosis","1\u002f1","It is important to understand what I mean by semiosis. All\u003cbr\u003edynamical action, or action of brute force, physical or\u003cbr\u003epsychical, either takes place between two subjects (whether\u003cbr\u003ethey react equally upon each other, or one is agent and the\u003cbr\u003eother patient, entirely or partially) or at any rate is a …","other"],["Semiosis","1\u002f1","…the acceleration of the pulse is a probable symptom of\u003cbr\u003efever and the rise of the mercury in an ordinary thermometer\u003cbr\u003eor the bending of the double strip of metal in a metallic\u003cbr\u003ethermometer is an indication, or, to use the technical term,\u003cbr\u003eis an index, of an increase of atmospheric temperature,\u003cbr\u003ewhich, …","other"],["Sensation","1\u002f1","An experience in which the element of feeling is predominant\u003cbr\u003eis a sensation.","other"],["Sensation","1\u002f3","If you look at a flame, you observe that it is orange, and\u003cbr\u003ethat orange color as it was seen on that particular occasion\u003cbr\u003eand was attributed to a reality then and there before you,\u003cbr\u003eand not called up in memory, was a sensation. So if you hear\u003cbr\u003ea cry, whether it is real or a hallucination, if you take …","other"],["Sensation","2\u002f3","imagination could be. The sight forces itself upon me. The\u003cbr\u003esensation has two parts: first, the feeling, and second, the\u003cbr\u003esense of its assertiveness, of my being compelled to have\u003cbr\u003eit. The consequence is that remembering a sensation is not\u003cbr\u003eat all the same thing as having it. For though there is some\u003cbr\u003e…","other"],["Sensation","3\u002f3","altersense. To avoid circumlocution, I will speak of the\u003cbr\u003ealtersense element of sensation, as Sensation simply. Thus,\u003cbr\u003eAltersense has two varieties, Sensation and Will. The\u003cbr\u003edifference between them is that Sensation is an event in\u003cbr\u003ewhich a feeling is forced upon the mind; while Volition or\u003cbr\u003eWilling, is …","other"],["Sheet of Assertion","1\u002f1","The System of Existential Graphs is a certain class of\u003cbr\u003ediagrams upon which it is permitted to operate certain\u003cbr\u003etransformations. There is required a certain surface upon\u003cbr\u003ewhich it is practicable to scribe the diagrams and from\u003cbr\u003ewhich they can be erased in whole or in part. The whole of\u003cbr\u003ethis surface …","other"],["Sheet of Assertion","1\u002f1","It is agreed that a certain sheet, or blackboard, shall,\u003cbr\u003eunder the name of The Sheet of Assertion, be considered as\u003cbr\u003erepresenting the universe of discourse, and as asserting\u003cbr\u003ewhatever is taken for granted between the graphist and the\u003cbr\u003einterpreter to be true of that universe. The sheet of\u003cbr\u003eassertion …","other"],["Sheet of Assertion","1\u002f1","The sheet on which the graphs are written (called the sheet\u003cbr\u003eof assertion), as well as each portion of it, is a graph\u003cbr\u003easserting that a recognized universe is definite (so that no\u003cbr\u003eassertion can be both true and false of it), individual (so\u003cbr\u003ethat any assertion is either true or false of it), and real\u003cbr\u003e…","other"],["Sheet of Assertion","1\u002f1","What we have to do […] is to form a perfectly consistent\u003cbr\u003emethod of expressing any assertion diagrammatically. The\u003cbr\u003ediagram must then evidently be something that we can see and\u003cbr\u003econtemplate. Now what we see appears spread out as upon a\u003cbr\u003esheet. Consequently our diagram must be drawn upon a sheet.\u003cbr\u003eWe …","other"],["Sheet of Assertion","1\u002f1","A certain sheet, called the sheet of assertion, is\u003cbr\u003eappropriated to the drawing upon it of such graphs that\u003cbr\u003ewhatever may be at any time drawn upon it, called the entire\u003cbr\u003egraph, shall be regarded as expressing an assertion by an\u003cbr\u003eimaginary person, called the graphist, concerning a\u003cbr\u003euniverse, perfectly …","other"],["Sheet of Assertion","1\u002f1","The matter which the Graph-instances are to determine, and\u003cbr\u003ewhich thereby becomes the Quasi-mind in which the Graphist\u003cbr\u003eand Interpreter are at one, being a Seme of The Truth, that\u003cbr\u003eis, of the widest Universe of Reality, and at the same time,\u003cbr\u003ea Pheme of all that is tacitly taken for granted between …","other"],["Singular","1\u002f1","Singular. Not general; being in one place at one time.","other"],["Singular","1\u002f1","(1) Applicable, as a sign, to a single individual. (2) In\u003cbr\u003emathematics: a singular place upon a continuum is a place\u003cbr\u003ewhose properties differ from those of all other places in\u003cbr\u003ethe vicinity, so as to constitute in one aspect a\u003cbr\u003ediscontinuity.","other"],["Singular","1\u002f1","If a sign refers to an object well known already to utterer\u003cbr\u003eand interpreter, and gives neither party any latitude as to\u003cbr\u003ewhat it represents, it may be called a singular sign, or\u003cbr\u003esingular.","other"],["Singular","1\u002f1","If a sign allows no latitude, either to utterer or to\u003cbr\u003einterpreter, as t what object or meaning it shall be\u003cbr\u003eregarded as representing, it may be called a singular sign.","other"],["Singular","1\u002f1","…a sign cannot be at once vague and general in the same\u003cbr\u003erespect. It may, however, be both definite and individual;\u003cbr\u003eand in that case may be said to be used singularly. ‘Man’ is\u003cbr\u003eused vaguely in ‘Some man sins’; generally, in ‘Every man\u003cbr\u003esins’; singularly, in ‘This man sins.’","other"],["Sinsign","1\u002f1","A Sinsign (where the syllable sin is taken as meaning “being\u003cbr\u003eonly once,” as in single, simple, Latin semel, etc.) is an\u003cbr\u003eactual existent thing or event which is a sign. It can only\u003cbr\u003ebe so through its qualities; so that it involves a\u003cbr\u003equalisign, or rather, several qualisigns. But these\u003cbr\u003equalisigns are …","other"],["Sinsign","1\u002f1","…signs are divisible, first, according to their modes of\u003cbr\u003ebeing, as objects; secondly, according to the modes of their\u003cbr\u003ereferences to their objects; thirdly, according to the modes\u003cbr\u003eof their references to their interpretants. In the first way\u003cbr\u003eof dividing them, signs are either qualisigns, or signs …","other"],["Sinsign","1\u002f1","As it is in itself, a sign is either of the nature of an\u003cbr\u003eappearance, when I call it a qualisign; or secondly, it is\u003cbr\u003ean individual object or event, when I call it a sinsign (the\u003cbr\u003esyllable sin being the first sillable [sic] of semel, simul,\u003cbr\u003esingular, etc); or thirdly, it is of the nature of a general\u003cbr\u003e…","other"],["Sinsign","1\u002f1","…in the first place a sign may, in its own firstness, either\u003cbr\u003ebe a mere idea or quality of feeling, or it may be a\u003cbr\u003e‘sinsign’, that is, an individual existent (and P. holds,\u003cbr\u003ewith Hegel, that existence consists in the blind reaction of\u003cbr\u003ethe existent with the rest of the universe in which it\u003cbr\u003eexists), …","other"],["Sinsign","1\u002f1","A sign in itself may be an indefinite possibility, when I\u003cbr\u003eterm as a Qualisign, or it may be an existent thing or\u003cbr\u003eevent, when I term it a Sinsign (sin- is the sim- of simul,\u003cbr\u003esimplex, etc.), or it may be a general type, when I call it\u003cbr\u003ea Legisign.","other"],["Sinsign","1\u002f1","A sinsign is a definite individual existent which is\u003cbr\u003esignificant because of the circumstances of its existence,\u003cbr\u003ewhich are either significant or include the very object\u003cbr\u003edenoted.","other"],["Speculative Grammar","1\u002f1","So, cultivators of the art of reasoning found themselves\u003cbr\u003elong ago obliged to institute a speculative grammar which\u003cbr\u003eshould study modes of signifying, in general. It is best\u003cbr\u003eregarded as separate from logic proper; for one of these\u003cbr\u003edays philologists may take it in hand, for which logicians\u003cbr\u003ewill thank …","other"],["Speculative Grammar","1\u002f1","“Exact” logic, in its widest sense, will (as I apprehend)\u003cbr\u003econsist of three parts. For it will be necessary, first of\u003cbr\u003eall, to study those properties of beliefs which belong to\u003cbr\u003ethem as beliefs, irrespective of their stability. This will\u003cbr\u003eamount to what Duns Scotus called speculative grammar. For\u003cbr\u003eit …","other"],["Speculative Grammar","1\u002f1","Of Representation, in general, there are three Theories,\u003cbr\u003enamely, First, the Theory of the general conditions under\u003cbr\u003ewhich a representamen may embody a Meaning; this has been\u003cbr\u003eknown as Speculative Grammar.","other"],["Speculative Grammar","1\u002f1","But besides being logical in the sense of demanding a\u003cbr\u003elogical analysis, our inquiry also relates to two as a\u003cbr\u003econception of logic. The term “logic” is unscientifically by\u003cbr\u003eme employed in two distinct senses. In its narrower sense,\u003cbr\u003eit is the science of the necessary conditions of the\u003cbr\u003eattainment of …","other"],["Speculative Grammar","1\u002f1","In consequence of every representamen being thus connected\u003cbr\u003ewith three things, the ground, the object, and the\u003cbr\u003einterpretant, the science of semiotic has three branches.\u003cbr\u003eThe first is called by Duns Scotus grammatica speculativa.\u003cbr\u003eWe may term it pure grammar. It has for its task to\u003cbr\u003eascertain what must …","other"],["Speculative Grammar","1\u002f1","There are three ways in which signs can be studied, first as\u003cbr\u003eto the general conditions of their having any meaning, which\u003cbr\u003eis the Grammatica Speculativa of Duns Scotus, second as to\u003cbr\u003ethe condions of their truth, which is logic, and thirdly, as\u003cbr\u003eto the conditions of their transferring their meaning to …","other"],["Speculative Grammar","1\u002f1","It is generally admitted that there is a doctrine which\u003cbr\u003eproperly antecedes what we have called critic. It considers,\u003cbr\u003efor example, in what sense and how there can be any true\u003cbr\u003eproposition and false proposition, and what are the general\u003cbr\u003econditions to which thought or signs of any kind must\u003cbr\u003econform in …","other"],["Speculative Grammar","1\u002f1","Logic is the science of the general necessary laws of Signs\u003cbr\u003eand especially of Symbols. As such, it has three\u003cbr\u003edepartments. Obsistent logic, logic in the narrow sense, or\u003cbr\u003eCritical Logic, is the theory of the general conditions of\u003cbr\u003ethe reference of Symbols and other Signs to their professed\u003cbr\u003eObjects, …","other"],["Speculative Grammar","1\u002f1","That our thoughts are signs is an old and familiar doctrine.\u003cbr\u003eI show that it is only in so far as thoughts are signs, and\u003cbr\u003eparticularly […] symbols, that they become subjects of\u003cbr\u003elogic; and further that the rules of logic are applicable to\u003cbr\u003eall symbols. Accordingly by regarding logic as a science of\u003cbr\u003e…","other"],["Speculative Grammar","1\u002f1","Logic, which began historically, and in each individual\u003cbr\u003estill begins, with the wish to distinguish good and bad\u003cbr\u003ereasonings, develops into a general theory of signs. Its\u003cbr\u003ethree departments are the physiological, or Speculative\u003cbr\u003eGrammar; its classificatory part, judging particularly what\u003cbr\u003ereasoning is …","other"],["Speculative Grammar","1\u002f1","All thought being performed by means of signs, logic may be\u003cbr\u003eregarded as the science of the general laws of signs. It has\u003cbr\u003ethree branches: (1) Speculative Grammar, or the general\u003cbr\u003etheory of the nature and meanings of signs, whether they be\u003cbr\u003eicons, indices, or symbols; (2) Critic, which classifies …","other"],["Speculative Grammar","1\u002f1","I [….] take a position quite to that of the English\u003cbr\u003elogicians, beginning with Scotus himself, in regarding this\u003cbr\u003eintroductory part of logic as nothing but an analysis of\u003cbr\u003ewhat kinds of signs are absolutely essential to the\u003cbr\u003eembodiment of thought. I call it, after Scotus, Speculative\u003cbr\u003eGrammar. I fully …","other"],["Speculative Grammar","1\u002f1","… a speculative rhetoric, the science of the essential\u003cbr\u003econditions under which a sign may determine an interpretant\u003cbr\u003esign of itself and of whatever it signifies, or may, as a\u003cbr\u003esign, bring about a physical result. [—] In the Roman\u003cbr\u003eschools, grammar, logic, and rhetoric were felt to be akin\u003cbr\u003eand to make …","other"],["Speculative Grammar","1\u002f1","…speculative grammar, corresponding to stecheology\u003cbr\u003e(Elementarlehre), classifies and describes signs.","other"],["Speculative Grammar","1\u002f1","… I extend logic to embrace all the necessary principles of\u003cbr\u003esemeiotic, and I recognize a logic of icons, and a logic of\u003cbr\u003eindices, as well as a logic of symbols; an ev. Mr. Gay and Dr. David\u003cbr\u003eHartley, usefully limited the term “association” to the\u003cbr\u003eprocess whereby one idea acquires the power to attract\u003cbr\u003eanother from the depths of memory to the surface of\u003cbr\u003econsciousness, …","other"],["Suggestion","1\u002f1","I follow the usage of the early associationalists, Gay,\u003cbr\u003eHartley, etc., in confining the term “association” to the\u003cbr\u003estoring away, in our spiritual or physical organisms, [of]\u003cbr\u003eideas that, when so stored away, are in the potential mode\u003cbr\u003eof being, and in terming the agency of ideas in calling\u003cbr\u003eforth …","other"],["Suggestion by Contiguity","1\u002f1","…suggestion by contiguity may be defined as the suggestion\u003cbr\u003eby an idea of another, which has been associated with it,\u003cbr\u003enot by the nature of thought, but by experience, or the\u003cbr\u003ecourse of life.","other"],["Suggestion by Resemblance","1\u002f1","Suggestion by resemblance is easily enough understood, as\u003cbr\u003esoon as the conception is once grasped that the similarity\u003cbr\u003eof two ideas consists in the fact that the mind naturally\u003cbr\u003ejoins them in thought in a certain way.","other"],["Sumisign","1\u002f1","The second trichotomy of representamens is [divided] into:\u003cbr\u003efirst, simple signs, substitutive signs, or Sumisigns;\u003cbr\u003esecond, double signs, informational signs, quasi-\u003cbr\u003epropositions, or Dicisigns; third, triple signs, rationally\u003cbr\u003epersuasive signs, arguments, or Suadisigns.","other"],["Sumisign","1\u002f1","…a Sumisign is any Representamen of which the Interpretant\u003cbr\u003erepresents it as an Icon…","other"],["Surd Relation","1\u002f1","Relations are truly, though not very lucidly, said to be\u003cbr\u003eeither relations of reason or relations in re. The latter\u003cbr\u003eexpression the more obtrusively fails to hit its nail\u003cbr\u003esquarely on the head. It woul er the\u003cbr\u003etheorem, until something suggests that other idea to the …","other"],["Theorematic Reasoning","1\u002f1","How it can be that, although the reasoning is based upon the\u003cbr\u003estudy of an individual schema, it is nevertheless necessary,\u003cbr\u003ethat is, applicable, to all possible cases, is one of the\u003cbr\u003equestions we shall have to consider. Just now, I wish to\u003cbr\u003epoint out that after the schema has been constructed …","other"],["Theorematic Reasoning","1\u002f1","A Deduction is an argument whose Interpretant represents\u003cbr\u003ethat it belongs to a general class of possible arguments\u003cbr\u003eprecisely analogous which are such that in the long run of\u003cbr\u003eexperience the greater part of those whose premisses are\u003cbr\u003etrue will have true conclusions. Deductions are either\u003cbr\u003eNecessary or …","other"],["Theorematic Reasoning","1\u002f1","In corollarial reasoning, the premisses act as stimulus to a\u003cbr\u003esuggestion according to general logical associations. But in\u003cbr\u003etheoric demonstration, it is necessary that associations\u003cbr\u003eshould be introduced of which the premisses afford not the\u003cbr\u003eslightest hint. To this result two mental events must take …","other"],["Theorematic Reasoning","1\u002f1","Deduction has two parts. [—] Explication is followed by\u003cbr\u003eDemonstration, or Deductive Argumentation. [—] It invariably\u003cbr\u003erequires something of the nature of a diagram; that is, an\u003cbr\u003e“Icon,” or Sign that represents its Object in resembling it.\u003cbr\u003eIt usually, too, needs “Indices,” or Signs that represent …","other"],["Theorematic Reasoning","1\u002f1","There are two kinds of Deduction; and it is truly\u003cbr\u003esignificant that it should have been left for me to discover\u003cbr\u003ethis. I first found, and subsequently proved, that every\u003cbr\u003eDeduction involves the observation of a Diagram (whether\u003cbr\u003eOptical, Tactical, or Acoustic) and having drawn the diagram\u003cbr\u003e(for I …","other"],["Theoretical Belief","1\u002f2","…it does not follow that because every theoretical belief\u003cbr\u003eis, at least indirectly, a practical belief, this is the\u003cbr\u003ewhole meaning of the theoretical belief. Of theoretical\u003cbr\u003ebeliefs, in so far as they are not practical, we may\u003cbr\u003edistinguish between those which are expectations, and those\u003cbr\u003ewhich are not …","other"],["Theoretical Belief","2\u002f2","anything, they must be somehow expectative. The word\u003cbr\u003e“expect” is now and then applied by careless and ignorant\u003cbr\u003espeakers, especially the English, to what is surmised in\u003cbr\u003eregard to the past. It is not illogical language: it is only\u003cbr\u003eelliptical. “I expect that Adam must have felt a little sore\u003cbr\u003eover the …","other"],["Theoretical Science","1\u002f1","I recognize two branches of science: Theoretical, whose\u003cbr\u003epurpose is simply and solely knowledge of God’s truth; and\u003cbr\u003ePractical, for the uses of life.","other"],["Theoric Step","1\u002f1","I shall term the step of so introducing into a demonstration\u003cbr\u003ea new idea not explicitly or directly contained in the\u003cbr\u003epremisses of the reasoning or in the condition of the\u003cbr\u003eproposition which gets proved by the aid of this\u003cbr\u003eintroduction, a theoric step. Two considerable advantages\u003cbr\u003emay be expected from …","other"],["Theoric Transformation","1\u002f1","[Theō’ric transformation] is an operation of necessary, or\u003cbr\u003erather, of compulsive reasoning, (granted the premisses the\u003cbr\u003einterpreter of the reasoning is compelled to assent to the\u003cbr\u003econclusion,) which formal logic cannot possibly take into\u003cbr\u003eaccount, since from the point of view of formal logic there\u003cbr\u003eis …","other"],["Theoric Transformation","1\u002f1","…every difficult mathematical theorem evidently involves\u003cbr\u003esome transformation of thought of which formal logic can\u003cbr\u003etake no account, although it is perfectly evident and\u003cbr\u003eundeniable, when it is suggested. This transformation, which\u003cbr\u003ecreates an ens rationis, may appropriately be termed a\u003cbr\u003e“theo’ric” …","other"],["Theoric Transformation","1\u002f1","It is not quite so true as Kant thought it to be that\u003cbr\u003ededuction is purely explicative; but the amplificative\u003cbr\u003eelement that a certain kind of deduction, called theo’ric\u003cbr\u003etransformation, affords, consists, after all, only in new\u003cbr\u003eforms of conceiving old facts.","other"],["Theory","1\u002f1","Theory [—] An outline statement, presenting to contemplation\u003cbr\u003ea sort of ideal diagram, or construction, which is to serve\u003cbr\u003eto represent a series of facts, not as they first present\u003cbr\u003ethemselves, but so as to render the relations between them\u003cbr\u003ecomprehensible. Theory is used in opposition to fact, and …","other"],["Theory","1\u002f1","The whole aim of science is to find out facts, and to work\u003cbr\u003eout a satisfactory theory of them. Still, a theory does not\u003cbr\u003enecessarily lose its utility by not being altogether true.\u003cbr\u003eIt must be intelligible and diagrammatical, or it has no\u003cbr\u003etitle to the name theory. The facts to which it refers are\u003cbr\u003enot …","other"],["Theory","1\u002f1","Of the two great tasks of humanity, Theory and Practice, the\u003cbr\u003eformer sets out from a sign of a real object with which it\u003cbr\u003eis acquainted, passing from this, as its matter, to\u003cbr\u003esuccessive interpretants embodying more and more fully its\u003cbr\u003eform, wishing ultimately to reach a direct perception of the\u003cbr\u003e…","other"],["Thing","1\u002f1","By a thing I mean an object whose occurrence in any universe\u003cbr\u003eof reality or fiction ll consciousness. Some elements (the sensations)\u003cbr\u003eare completely present at every instant so long as they\u003cbr\u003elast, while others (like thought) are actions having\u003cbr\u003ebeginning, middle, …","other"],["Thought","1\u002f1","A cerebral habit of the highest kind, which will determine\u003cbr\u003ewhat we do in fancy as well as what we do in action, is\u003cbr\u003ecalled a belief. The representation to ourselves that we\u003cbr\u003ehave a specified habit of this kind is called a judgment. A\u003cbr\u003ebelief-habit in its development begins by being vague,\u003cbr\u003especial, …","other"],["Thought","1\u002f1","It seems, then, that the true categories of consciousness\u003cbr\u003eare: first, feeling, the consciousness which can be included\u003cbr\u003ewith an instant of time, passive consciousness of quality,\u003cbr\u003ewithout recognition or analysis; second, consciousness of an\u003cbr\u003einterruption into the field of consciousness, sense of …","other"],["Thought","1\u002f1","… the psychologists undertake to locate various mental\u003cbr\u003epowers in the brain; and above all consider it as quite\u003cbr\u003ecertain that the faculty of language resides in a certain\u003cbr\u003elobe; but I believe it comes decidedly nearer the truth\u003cbr\u003e(though not really true) that language resides in the\u003cbr\u003etongue. In my …","other"],["Thought","1\u002f1","In the ideas of Firstness, Secondness, and Thirdness, the\u003cbr\u003ethree elements, or Universal Categories, appear under their\u003cbr\u003eforms of Firstness. They appear under their forms of\u003cbr\u003eSecondness in the ideas of Facts of Firstness, or Qualia,\u003cbr\u003eFacts of Secondness, or Relations, and Facts of Thirdness,\u003cbr\u003eor Signs; …","other"],["Thought","1\u002f1","Thirdness is found wherever one thing brings about a\u003cbr\u003eSecondness between two things. In all such cases, it will be\u003cbr\u003efound that Thought plays a part. By thought is meant\u003cbr\u003esomething like the meaning of a word, which may be “embodied\u003cbr\u003ein,” that is, may govern, this or that, but is not confined\u003cbr\u003eto any …","other"],["Thought","1\u002f1","What we call a “thought,” not that which is in somebody’s\u003cbr\u003emind at one moment, and is gone, but that which passes from\u003cbr\u003emind to mind, say the idea of Justice, is certainly of the\u003cbr\u003enature of a word. People think it is of no consequence\u003cbr\u003ebecause it needs to be embodied in a passing thought or in\u003cbr\u003ethe …","other"],["Thought","1\u002f1","Our thought is in my opinion […] an appeal in symbols of the\u003cbr\u003eself of the present to the self of the immediate future. It\u003cbr\u003eis conducted, if not in propositions, in something very much\u003cbr\u003eof that nature. I do not think it is, in its movement,\u003cbr\u003epropositional; but we are continually drawing up\u003cbr\u003epropositions …","other"],["Thought","1\u002f1","…it is necessary to draw a distinction between thinking and\u003cbr\u003ethought. A sentence printed in a book is true or false. It\u003cbr\u003eembodies thought, although it does no thinking. [—] …all\u003cbr\u003edeliberative meditation, or thinking proper, takes the form\u003cbr\u003eof a dialogue. The person divides himself into two parties …","other"],["Thought","1\u002f1","Do not confound thought with thinking. Thought is the Object\u003cbr\u003ethat you think. Thinking, as contradistinguished from\u003cbr\u003efeeling and from the effort of attention, is the operation\u003cbr\u003eof the mind by which you strive to make out the Truth. You\u003cbr\u003eexpect to extract it from the object before your mind, the …","other"],["Thought","1\u002f1","‘Thinking’ is a fabled ‘operation of the mind’ by which an\u003cbr\u003eimaginary object is brought before one’s gaze. If that\u003cbr\u003eobject is a Sign upon which an argument may turn, we call it\u003cbr\u003ea Thought. All that we know of the ‘Thinking’ is that we\u003cbr\u003eafterwards remember that our attention was actively on the …","other"],["Thought","1\u002f1","…thoughts ought to be regarded as signs. Let anybody call to\u003cbr\u003emind some recent earnest self-deliberation, and I think he\u003cbr\u003ewill acknowledge that it took a dialogic form, every\u003cbr\u003ereasoning appealing to the self of the near following moment\u003cbr\u003eof time for assent and confirmation.","other"],["Thought","1\u002f1","True Thought takes the form […] of a dialogue. For true\u003cbr\u003ethought is deliberate, and deliberation implies the asking\u003cbr\u003eof questions, and appeals to another personality for\u003cbr\u003econfirmation, objections, and other dialogic forms.","other"],["Time","1\u002f1","Time consists in a regularity in the relations of\u003cbr\u003einteracting feelings.","other"],["Time","1\u002f1","The dimension of successive copies of feeling, so far as it\u003cbr\u003eapplies to accidental reactions, I identify with Time.","other"],["Token","1\u002f1","A common mode of estimating the amount of matter in a MS. or\u003cbr\u003eprinted book is to count the number of words. There will\u003cbr\u003eordinarily be about twenty the’s on a page, and of course\u003cbr\u003ethey count as twenty words. In another sense of the word\u003cbr\u003e“word,” however, there is but one word “the” in the English\u003cbr\u003e…","other"],["Token","1\u002f1","A Sign may itself have a “possible” Mode of Being. E.g. A\u003cbr\u003ehexagon inscribed in or circumscribed about a conic. It is a\u003cbr\u003eSign, in that the collinearity of the intersections of\u003cbr\u003eopposite sides shows the curve to be a conic, if the hexagon\u003cbr\u003eis inscribed; but if it be circumscribed the copunctuality\u003cbr\u003eof …","other"],["Token","1\u002f1","A Sign may be an Occurrence, such as any one of a score of\u003cbr\u003e“thes” on a single page of a single copy of an English book.\u003cbr\u003eI call such a Sign a Token.","other"],["Token [as General Sign]","1\u002f1","A sign is in a conjoint relation to the thing denoted and to\u003cbr\u003ethe mind. If this triple relation is not of a degenerate\u003cbr\u003especies, the sign is related to its object only in\u003cbr\u003econsequence of a mental association, and depends upon a\u003cbr\u003ehabit. Such signs are always abstract and general, because\u003cbr\u003ehabits are …","other"],["Token [as General Sign]","1\u002f1","Signs, or representations, are of three kinds: Icons,\u003cbr\u003eIndices, and Tokens. The token represents its object in\u003cbr\u003econsequence of a mental association, and depends upon a\u003cbr\u003ehabit. Such signs are abstract and general, because habits\u003cbr\u003eare general rules to which the organism has become\u003cbr\u003esubjected. They are, …","other"],["Token [as General Sign]","1\u002f1","…a sign may bring the thought into relation to the thing\u003cbr\u003esignified by virtue of a habit or association of ideas, in\u003cbr\u003ewhich case it is a general sign, or as I call it a token…","other"],["Tone","1\u002f1","… a definitely significant Form, I propose to term a Type. A\u003cbr\u003eSingle event which happens once and whose identity is\u003cbr\u003elimited to that one happening or a Single object or thing\u003cbr\u003ewhich is in some single place at any one instant of time,\u003cbr\u003esuch event or thing being significant only as occurring just\u003cbr\u003ewhen …","other"],["Tone","1\u002f1","A Sign may itself have a “possible” Mode of Being. E.g. A\u003cbr\u003ehexagon inscribed in or circumscribed about a conic. It is a\u003cbr\u003eSign, in that the collinearity of the intersections of\u003cbr\u003eopposite sides shows the curve to be a conic, if the hexagon\u003cbr\u003eis inscribed; but if it be circumscribed the copunctuality\u003cbr\u003eof …","other"],["Total Graph","1\u002f1","Partial graphs are graphs on the sheet of assertion that are\u003cbr\u003enot the only ones scribed on the sheet. The entire graph is\u003cbr\u003eall that is scribed on the sheet. The total graph is the\u003cbr\u003eentire graph together with the sheet of assertion itself.","other"],["Triad","1\u002f1","Let me remind you that three things do not necessarily make\u003cbr\u003ea genuine triad or have what I call threeness, except in a\u003cbr\u003emodified and reduced sense. By a genuine triad I mean three\u003cbr\u003ethings in a genuine triple relation which is not a mere\u003cbr\u003emixture of dual relations.","other"],["Triad","1\u002f1","A rhema which has one blank is called a monad; a rhema of\u003cbr\u003etwo blanks, a dyad; a rhema of three blanks, a triad; etc.","other"],["Triad","1\u002f1","In the present application, a medad must mean an\u003cbr\u003eindecomposable idea altogether severed logically from every\u003cbr\u003eother; a monad will mean an element which, except that it is\u003cbr\u003ethought as applying to some subject, has no other characters\u003cbr\u003ethan those which are complete in it without any reference to\u003cbr\u003e…","other"],["Triadic Relation","1\u002f1","It is impossible to analyze a triadic relation, or fact\u003cbr\u003eabout three objects, into dyadic relations; for the very\u003cbr\u003eidea of a compound supposes two parts, at least, and a\u003cbr\u003ewhole, or three objects, at least, in all. On the other\u003cbr\u003ehand, every tetradic relation, or fact about four objects\u003cbr\u003ecan be analyzed …","other"],["Triadic Relation","1\u002f1","A triadic relation is a general relation of triads, or\u003cbr\u003eordered triplets. [—] A genuine triadic relation is one\u003cbr\u003ewhich neither consists of dyadic relations nor of monadic\u003cbr\u003echaracters.","other"],["Triadomany","1\u002f1","… I was long ago (1867) led, after only three or four years’\u003cbr\u003estudy, to throw all ideas into the three classes of\u003cbr\u003eFirstness, of Secondness, and of Thirdness. This sort of\u003cbr\u003enotion is as distasteful to me as to anybody; and for years,\u003cbr\u003eI endeavored to pooh-pooh and refute it; but it long ago\u003cbr\u003econquered …","other"],["Triadomany","1\u002f1","I fully admit that there is a not uncommon craze for\u003cbr\u003etrichotomies. I do not know but the psychiatrists have\u003cbr\u003eprovided a name for it. If not, they should. “Trichimania,”\u003cbr\u003e[?] unfortunately, happens to be preëmpted for a totally\u003cbr\u003edifferent passion; but it might be called triadomany. I am\u003cbr\u003enot so …","other"],["Triadosemeion","1\u002f1","…the division of signs according to their Monadic Objects is\u003cbr\u003esimply into 1st, Signs of Objects whose Being is Monadic\u003cbr\u003e(signs of qualities, etc), 2nd, Signs of Objects whose Being\u003cbr\u003eis Dyadic (signs of existents, past events, etc), 3rd, Signs\u003cbr\u003eof Objects whose Being is Triadic (Signs of Laws, Types, …","other"],["Trichotomic","1\u002f1","TRICHOTOMIC is the art of making three-fold divisions.","other"],["Truth","1\u002f1","All human thought and opinion contains an arbitrary,\u003cbr\u003eaccidental element, dependent on the limitations in\u003cbr\u003ecircumstances, power, and bent of the individual; an element\u003cbr\u003eof error, in short. But human opinion universally tends in\u003cbr\u003ethe long run to a definite form, which is the truth. Let any\u003cbr\u003ehuman being …","other"],["Truth","1\u002f1","The question therefore is, how is true belief (or belief in\u003cbr\u003ethe real) distinguished from false belief (or belief in\u003cbr\u003efiction). Now, as we have seen in the former paper, the\u003cbr\u003eideas of truth and falsehood, in their full development,\u003cbr\u003eappertain exclusively to the experiential method of settling\u003cbr\u003eopinion. …","other"],["Truth","1\u002f1","The commodious and compact representation in our minds, or\u003cbr\u003eicon of our hopes about beliefs[,] is that there is\u003cbr\u003esomething fixed and not subject to our wills called the\u003cbr\u003ereality, and that our beliefs come to shape themselves more\u003cbr\u003eand more under experience in conformity to that reality. So\u003cbr\u003efar as they …","other"],["Truth","1\u002f1","A proposition should be defined as that which professes to\u003cbr\u003ebe true, or assigns a logical value to itself. The Truth is\u003cbr\u003edefined as that logical value which a proposition assigns to\u003cbr\u003eitself. Whether or not there really is such value, whether\u003cbr\u003ethere is any truth is a question, not of definitions, but …","other"],["Truth","1\u002f1","By a true proposition (if there be any such thing) I mean a\u003cbr\u003eproposition which at some time, past or future, emerges into\u003cbr\u003ethought, and has the following three characters: 1st, no\u003cbr\u003edirect effort of yours, mine, or anybody’s, can reverse it\u003cbr\u003epermanently, or even permanently prevent its asserting …","other"],["Truth","1\u002f2","Truth is a character which attaches to an abstract\u003cbr\u003eproposition, such as a person might utter. It essentially\u003cbr\u003edepends upon that proposition’s not professing to be exactly\u003cbr\u003etrue. But we hope that in the progress of science its error\u003cbr\u003ewill indefinitely diminish, just as the error of 3.14159,\u003cbr\u003ethe value …","other"],["Truth","2\u002f2","and one-sidedness, and this confession is an essential\u003cbr\u003eingredient of truth. [—] In the above we have considered\u003cbr\u003epositive scientific truth. But the same definitions equally\u003cbr\u003ehold in the normative sciences. If a moralist describes an\u003cbr\u003eideal as the summum bonum, in the first place, the perfect\u003cbr\u003etruth of …","other"],["Truth","1\u002f1","But even if it were impossible to distinguish between truth\u003cbr\u003eand reality, that would not in the least prevent our\u003cbr\u003edefining what it is that truth consists in. Truth and\u003cbr\u003efalsity are characters confined to propositions. A\u003cbr\u003eproposition is a sign which separately indicates its object.\u003cbr\u003eThus, a portrait …","other"],["Truth","1\u002f1","These characters equally apply to pure mathematics. [—] A\u003cbr\u003eproposition is not a statement of perfectly pure mathematics\u003cbr\u003euntil it is devoid of all definite meaning, and comes to\u003cbr\u003ethis – that a property of a certain icon is pointed out and\u003cbr\u003eis declared to belong to anything like it, of which\u003cbr\u003einstances …","other"],["Truth","1\u002f1","All the above relates to complex truth, or the truth of\u003cbr\u003epropositions. This is divided into many varieties, among\u003cbr\u003ewhich may be mentioned ethical truth, or the conformity of\u003cbr\u003ean assertion to the speaker’s or writer’s belief, otherwise\u003cbr\u003ecalled veracity, and logical truth, that is, the concordance\u003cbr\u003eof a …","other"],["Truth","1\u002f1","Every man is fully satisfied that there is such a thing as\u003cbr\u003etruth, or he would not ask any question. That truth consists\u003cbr\u003ein a conformity to something independent of his thinking it\u003cbr\u003eto be so, or of any man’s opinion on that subject. But for\u003cbr\u003ethe man who holds this second opinion, the only reality, …","other"],["Truth","1\u002f1","… to believe the absolute truth would be to have such a\u003cbr\u003ebelief that under no circumstances, such as actually occur,\u003cbr\u003eshould we find ourselves surprised.","other"],["Truth","1\u002f1","The purpose of every sign is to express “fact,” and by being\u003cbr\u003ejoined with other signs, to approach as nearly as possible\u003cbr\u003eto determining an interpretant which would be the perfect\u003cbr\u003eTruth, the absolute Truth, and as such (at least, we may use\u003cbr\u003ethis language) would be the very Universe. Aristotle gropes\u003cbr\u003e…","other"],["Truth","1\u002f1","…by the True is meant that at which inquiry aims.","other"],["Truth","1\u002f1","That is the plain lesson of pragmatism: error is that which\u003cbr\u003esufficient inquiry would refute. Consequently, truth is that\u003cbr\u003ebelief to which sufficient inquiry would inevitably lead.\u003cbr\u003eBut truth is the assertion that subjects have the attributes\u003cbr\u003ethat they in reality have. Hence, the pragmatistic …","other"],["Truth","1\u002f1","Unless truth be recognized as public, - as that of which any\u003cbr\u003eperson would come to be convinced if he carried his inquiry,\u003cbr\u003ehis sincere search for immovable belief, far enough, - then\u003cbr\u003ethere will be nothing to prevent each one of us from\u003cbr\u003eadopting an utterly futile belief of his own which all the\u003cbr\u003erest …","other"],["Truth","1\u002f1","…when I say that I believe that a given assertion is “true,”\u003cbr\u003ewhat I mean is that I believe that, as regards that\u003cbr\u003eparticular assertion, […] sufficiently energetic, searching,\u003cbr\u003eand intelligently conducted inquiry, – could a person carry\u003cbr\u003eit on endlessly, – would cause him to be fully satisfied\u003cbr\u003ewith …","other"],["Truth","1\u002f1","…what else, when one considers it, can our “truth” ever\u003cbr\u003eamount to other than the way in which people would come to\u003cbr\u003ethink if research were carried sufficiently far?","other"],["Truth","1\u002f1","To say that a thing is Real is merely to say that such\u003cbr\u003epredicates as are true of it, or some of them, are true of\u003cbr\u003eit regardless of whatever any actual person or persons might\u003cbr\u003ethink concerning that truth. Unconditionality in that single\u003cbr\u003erespect constitutes what we call Reality.[—] I call “truth”\u003cbr\u003e…","other"],["Tychasm","1\u002f1","Three modes of evolution have thus been brought before us:\u003cbr\u003eevolution by fortuitous variation, evolution by mechanical\u003cbr\u003enece hat\u003cbr\u003eabsolute chance is a factor of the universe. There is one\u003cbr\u003eclass of objectors to it who are so impressed with what they\u003cbr\u003ehave read in popular books about the triumphs of science\u003cbr\u003ethat they really imagine that science has proved that the …","other"],["Tychism","1\u002f1","In 1891-3, in the ‘Monist’ […], he outlined a hypothesis\u003cbr\u003ecapable of being Subjected to inductive tests, which\u003cbr\u003ehypothesis, called tychism, was that the laws of nature,\u003cbr\u003ealthough real. are results of a process of evolution, and as\u003cbr\u003esuch are not yet and never will be exactly fulfilled by the\u003cbr\u003efacts, …","other"],["Tychism","1\u002f1","It is that synthesis of tychism and of pragmatism for which\u003cbr\u003eI long ago proposed the name, Synechism.","other"],["Tychism","1\u002f1","… absolute chance – pure tychism …","other"],["Tychism","1\u002f1","When law rigidly acts, the equations of dynamics show that\u003cbr\u003ethe variety in the result is precisely the variety in the\u003cbr\u003econditions, and no more. But just as all observations of the\u003cbr\u003eresults, however nice they may be, will be affected with\u003cbr\u003eerrors, so we may suppose that in the facts themselves there\u003cbr\u003e…","other"],["Type","1\u002f1","A common mode of estimating the amount of matter in a MS. or\u003cbr\u003eprinted book is to count the number of words. There will\u003cbr\u003eordinarily be about twenty the’s on a page, and of course\u003cbr\u003ethey count as twenty words. In another sense of the word\u003cbr\u003e“word,” however, there is but one word “the” in the English\u003cbr\u003e…","other"],["Type","1\u002f1","…in the sense in which “the” is one word only, no matter how\u003cbr\u003emany times it may occur, it is a Type, a form or habit.","other"],["Type","1\u002f1","A Sign may itself have a “possible” Mode of Being. E.g. A\u003cbr\u003ehexagon inscribed in or circumscribed about a conic
