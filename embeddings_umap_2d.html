somewhat of the\u003cbr\u003enature of a verbal definition, and is very inferior to the …","other"],["Ultimate Logical Interpretant","1\u002f1","It is evident that a definition, even if it be imperfect\u003cbr\u003eowing to vagueness, is an intellectual interpretant of the\u003cbr\u003eterm it defines. But it is equally evident that it cannot be\u003cbr\u003ethe ultimate intellectual interpretant, inasmuch as it is\u003cbr\u003eitself a sign, and a sign of the kind that has itself an …","other"],["Universal Grammar","1\u002f1","Symbols, as such, are subject to three laws one of which is\u003cbr\u003ethe conditio sine qua non of its standing for anything, the\u003cbr\u003esecond of its translating anything, and the third of its\u003cbr\u003erealizing anything. The first law is Logic, the second\u003cbr\u003eUniversal Rhetoric, the third Universal Grammar.","other"],["Universal Rhetoric","1\u002f1","Symbols, as such, are subject to three laws one of which is\u003cbr\u003ethe conditio sine qua non of its standing for anything, the\u003cbr\u003esecond of its translating anything, and the third of its\u003cbr\u003erealizing anything. The first law is Logic, the second\u003cbr\u003eUniversal Rhetoric, the third Universal Grammar.","other"],["Universe of Discourse","1\u002f1","De Morgan, in the remarkable memoir with which he opened his\u003cbr\u003ediscussion of the syllogism (1846, p. 380) has pointed out\u003cbr\u003ethat we often carry on reasoning under an implied\u003cbr\u003erestriction as to what we shall consider as possible, which\u003cbr\u003erestriction, applying to the whole of what is said, need not\u003cbr\u003ebe …","other"],["Universe of Discourse","1\u002f1","De Morgan and his followers frequently speak of a “limited\u003cbr\u003euniverse of discourse” in logic. An unlimited universe would\u003cbr\u003ecomprise the whole realm of the logically possible. In such\u003cbr\u003ea universe, every universal proposition, not tautologous, is\u003cbr\u003efalse; every particular proposition, not absurd, is true. …","other"],["Universe of Discourse","1\u002f2","Whether the constituent individuals or units of a collection\u003cbr\u003ehave each of them a distinct identity of its own or not,\u003cbr\u003edepends upon the nature of the universe of discourse. If the\u003cbr\u003euniverse of discourse is a matter of objective and completed\u003cbr\u003eexperience, since experience is the aggregate of mental …","other"],["Universe of Discourse","2\u002f2","amount of general specification can reduce a general class\u003cbr\u003eof possibilities to an individual case. It is only\u003cbr\u003eactuality, the force of existence, which bursts the fluidity\u003cbr\u003eof the general and produces a discrete unit. Since Kant it\u003cbr\u003ehas been a very wide-spread idea that it is time and space\u003cbr\u003ewhich …","other"],["Universe of Discourse","1\u002f1","In all discourse, or reasoning, there are virtually two\u003cbr\u003eparties. Either there are actually two parties, as when one\u003cbr\u003espeaker addresses an audience of one or more persons; or\u003cbr\u003eelse one person reasons out something with himself, and even\u003cbr\u003ethen, the difference between his conceptions and opinions\u003cbr\u003ebefore …","other"],["Universe of Discourse","1\u002f2","In every proposition the circumstances of its enunciation\u003cbr\u003eshow that it refers to some collection of individuals or of\u003cbr\u003epossibilities, which cannot be adequately described, but can\u003cbr\u003eonly be indicated as something familiar to both speaker and\u003cbr\u003eauditor. At one time it may be the physical universe of …","other"],["Universe of Discourse","2\u002f2","then alone be one thing to say that an object wants some\u003cbr\u003echaracter common to all men and another to say that it\u003cbr\u003epossesses every character common to all non-men. Only\u003cbr\u003einstead of giving three qualities it gives four, for the\u003cbr\u003eassertion may be that an object wants some character common\u003cbr\u003eto all non-men; …","other"],["Universe of Discourse","1\u002f1","… I wish my description of what is true or false, to apply\u003cbr\u003eto what is not only true or false generally, but also to\u003cbr\u003ewhat is true or false under conditions already assumed.\u003cbr\u003eWhatever may be the limitations previously imposed, that to\u003cbr\u003ewhich the truth or falsity is limited may be called the\u003cbr\u003euniverse …","other"],["Universe of Discourse","1\u002f1","Logicians call […] a collection of things or subjects of\u003cbr\u003eforce, to which the whole discussions relates, the universe\u003cbr\u003eof discourse. This universe consists in the first place of\u003cbr\u003ecertain mutually well-understood centres or subjects of\u003cbr\u003eforce well-understood to be different from one another;\u003cbr\u003esecondly, …","other"],["Universe of Discourse","1\u002f1","…if one person is to convey any information to another, it\u003cbr\u003emust be upon the basis of a common experience. They must not\u003cbr\u003eonly have this common experience, but each must know the\u003cbr\u003eother has it; and not only that but each must know the other\u003cbr\u003eknows that he knows the other has it; so that when one says\u003cbr\u003e…","other"],["Universe of Discourse","1\u002f1","…the Phemic Sheet iconizes the Universe of Discourse, since\u003cbr\u003eit more immediately represents a field of Thought, or Mental\u003cbr\u003eExperience, which is itself directed to the Universe of\u003cbr\u003eDiscourse, and considered as a sign, denotes that Universe.\u003cbr\u003eMoreover, it [is because it must be understood] as being …","other"],["Universe of Discourse","1\u002f1","The universe of discourse is the aggregate of the individual\u003cbr\u003eobjects which “exist,” that is are independently side by\u003cbr\u003eside in the collection of experiences to which the deliverer\u003cbr\u003eand interpreter of a set of symbols have agreed to refer and\u003cbr\u003eto consider.","other"],["Uttering","1\u002f1","By “Uttering” I mean putting forth, whether audibly or\u003cbr\u003evisibly or otherwise[,] any sort of sign. For instance, I\u003cbr\u003eshould say that the master of a ship who should cause signal\u003cbr\u003eflags to be hoisted “Uttered” that combination of flags.","other"],["Vague","1\u002f1","Vague (in logic) [Lat, vagus, rambling, indefinite]: Ger.\u003cbr\u003eunbestimmt ; Fr. vague ; Ital. vago. Indeterminate in\u003cbr\u003eintention. A proposition is vague when there are states of\u003cbr\u003ethings concerning which it is intrinsically uncertain\u003cbr\u003ewhether, had they been contemplated by the speaker, he would\u003cbr\u003ehave …","other"],["Vague","1\u002f1","…an assertion is comprehensive in so far as it extends the\u003cbr\u003eperson to whom it is addressed a certain latitude in the\u003cbr\u003einterpretation of it; it is vague in so far as it reserves\u003cbr\u003eto the utterer of it a similar latitude.","other"],["Vague","1\u002f1","If a sign allows the utterer a certain latitude of choice as\u003cbr\u003eto what his meaning may be; so that he may perhaps defend\u003cbr\u003eits applicability in several ways […] then the sign may be\u003cbr\u003esaid to be vague, or non-definite.","other"],["Vague","1\u002f1","If a sign allows a latitude of choice to the utterer in\u003cbr\u003ecertain respects and within certain limits, as to what its\u003cbr\u003eobject or meaning shall be, it may be called vague, or non-\u003cbr\u003edeterminate.","other"],["Vague","1\u002f1","If a sign is apt to represent many things, the option as to\u003cbr\u003ewhat single thing it shall be taken to represent may be\u003cbr\u003ereserved by the utterer of it, to whom it naturally belongs;\u003cbr\u003ein which case it may be said to be used vaguely, or not\u003cbr\u003edefinitely.","other"],["Vague","1\u002f1","Every utterance naturally leaves the right of further\u003cbr\u003eexposition in the utterer; and therefore, in so far as a\u003cbr\u003esign is indeterminate, it is vague, unless it is expressly\u003cbr\u003eor by a well-understood convention rendered general. [—]\u003cbr\u003ePerhaps a more scientific pair of definitions would be that\u003cbr\u003eanything is …","other"],["Verisimilitude","1\u002f1","I will now give an idea of what I mean by likely or\u003cbr\u003everisimilar. [—] I call that theory likely which is not yet\u003cbr\u003eproved but is supported by such evidence, that if the rest\u003cbr\u003eof the conceivably possible evidence should turn out upon\u003cbr\u003eexamination to be of a similar character, the theory would\u003cbr\u003ebe …","other"],["Verisimilitude","1\u002f1","The names which I would propose for general adoption for the\u003cbr\u003ethree different kinds of acceptability of propositions are\u003cbr\u003eplausibilityverisimilitudeprobability The last alone seems\u003cbr\u003eto be capable of a certain degree of exactitude or\u003cbr\u003emeasurement [—] By verisimilitude I mean that kind of\u003cbr\u003erecommendation …","other"],["Virtual","1\u002f1","(1) A virtual X (where X is a common noun) is something, not\u003cbr\u003ean X, which has the efficiency (virtus) of an X. This is the\u003cbr\u003eproper meaning of the word; but (2) it has been seriously\u003cbr\u003econfounded with ‘potential,’ which is almost its contrary.\u003cbr\u003eFor the potential X is of the nature of X, but is without …","other"],["Virtual","1\u002f1","…a “virtual x,” where x stands for a common noun, means\u003cbr\u003esomething which is not an x, but which has, for whatever\u003cbr\u003epurpose may be uppermost, the virtue of an x, that is, such\u003cbr\u003eproperties as make it equivalent to an x.","other"],["Virtual","1\u002f1","“Virtual,” followed by any common noun, say ‘N,’ makes an\u003cbr\u003eappellative phrase which denotes anything which, while it is\u003cbr\u003enot an ‘N,’ has, nevertheless, the chara
